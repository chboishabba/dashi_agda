name: Hurwitz Hopf Noether Millennium cross-pollination

on:
  push:
    branches:
      - 'agent/hurwitz-hopf-noether-millennium-crosspollination'
    paths:
      - 'DASHI/EverythingHurwitzHopfNoetherCrossPollination.agda'
      - 'DASHI/Mathematics/Algebra/**'
      - 'DASHI/Mathematics/Symmetry/**'
      - 'DASHI/Mathematics/Topology/**'
      - 'DASHI/Mathematics/CrossPollination/**'
      - 'DASHI/Physics/YangMills/YangMillsKleinNoetherGaugeInvariantBridgeExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsHurwitzHopfStructuralGateExact.agda'
      - 'DASHI/Physics/Closure/NavierStokesKleinCriticalScalingExact.agda'
      - 'DASHI/Physics/Closure/NavierStokesHopfNoetherContinuationGateExact.agda'
      - 'scripts/check_hurwitz_hopf_noether_millennium_crosspollination.sh'
      - '.github/workflows/hurwitz-hopf-noether-millennium-crosspollination.yml'
  pull_request:
    branches:
      - 'agent/ym-clay-alpha-round30-strong-coupling-functional-route'
    paths:
      - 'DASHI/EverythingHurwitzHopfNoetherCrossPollination.agda'
      - 'DASHI/Mathematics/Algebra/**'
      - 'DASHI/Mathematics/Symmetry/**'
      - 'DASHI/Mathematics/Topology/**'
      - 'DASHI/Mathematics/CrossPollination/**'
      - 'DASHI/Physics/YangMills/YangMillsKleinNoetherGaugeInvariantBridgeExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsHurwitzHopfStructuralGateExact.agda'
      - 'DASHI/Physics/Closure/NavierStokesKleinCriticalScalingExact.agda'
      - 'DASHI/Physics/Closure/NavierStokesHopfNoetherContinuationGateExact.agda'
      - 'scripts/check_hurwitz_hopf_noether_millennium_crosspollination.sh'
      - '.github/workflows/hurwitz-hopf-noether-millennium-crosspollination.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Hurwitz Hopf Noether cross-pollination
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/hurwitz-hopf-noether-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_hurwitz_hopf_noether_millennium_crosspollination.sh
          ) > hurwitz-hopf-noether-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 500 hurwitz-hopf-noether-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurwitz-hopf-noether-logs
          path: |
            hurwitz-hopf-noether-check.log
            hurwitz-hopf-noether-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='Hurwitz Hopf Noether Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='Hurwitz Hopf Noether Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='hurwitz-hopf-noether-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
