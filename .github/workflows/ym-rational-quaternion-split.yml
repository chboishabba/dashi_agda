name: YM rational quaternion split typecheck

on:
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
      AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
      DASHI_NO_TMUX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck split quaternion leaves and consumer
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ym-rational-quaternion-split.log"
          scripts/run_agda29_parallel_check.sh \
            DASHI/Physics/YangMills/BalabanP33RationalQuaternionCoreExact.agda \
            DASHI/Physics/YangMills/BalabanP33RationalQuaternionAlgebraLawsExact.agda \
            DASHI/Physics/YangMills/BalabanP33RationalQuaternionWilsonJetExact.agda \
            DASHI/Physics/YangMills/BalabanP33RationalQuaternionFlatCurlIdentityExact.agda \
            DASHI/Physics/YangMills/BalabanP33RationalQuaternionWilsonSecondVariationExact.agda
      - name: Upload Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-rational-quaternion-split-log
          path: ym-rational-quaternion-split.log*
