name: NS Round37 P/Q stabilizer signed ledger

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKN*Round37Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPQStabilizerSignedLedgerRound37Validation.agda'
      - 'scripts/check_ns_pq_stabilizer_signed_ledger_round37.sh'
      - '.github/workflows/ns-pq-stabilizer-signed-ledger-round37.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agda-round37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Round37 frontier tranche
        run: bash scripts/check_ns_pq_stabilizer_signed_ledger_round37.sh
      - name: Upload checker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round37-checker-logs
          path: |
            .agda-check-logs
            *.log
          if-no-files-found: ignore
