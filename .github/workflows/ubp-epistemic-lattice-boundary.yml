name: UBP epistemic lattice boundary

on:
  push:
    branches: [master]
    paths:
      - 'DASHI/Foundations/UBP/**'
      - 'Docs/support/reference/UBPEpistemicLatticeBoundary.md'
      - 'scripts/check_ubp_epistemic_lattice_boundary.py'
      - '.github/workflows/ubp-epistemic-lattice-boundary.yml'
  pull_request:
    paths:
      - 'DASHI/Foundations/UBP/**'
      - 'Docs/support/reference/UBPEpistemicLatticeBoundary.md'
      - 'scripts/check_ubp_epistemic_lattice_boundary.py'
      - '.github/workflows/ubp-epistemic-lattice-boundary.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  focused-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run fail-closed static audit
        run: python3 scripts/check_ubp_epistemic_lattice_boundary.py

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Typecheck focused Agda aggregate
        run: |
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh \
            DASHI/Foundations/UBP/Regression.agda
