name: Yang-Mills Clay cross-pollination round 25

on:
  push:
    branches:
      - 'agent/ym-clay-cross-pollination-round25'
    paths:
      - 'DASHI/Physics/Common/**'
      - 'DASHI/Physics/YangMills/**'
      - 'scripts/check_yang_mills_clay_cross_pollination_round25.sh'
      - 'scripts/check_yang_mills_clay_highest_alpha_round24.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/yang-mills-clay-cross-pollination-round25.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Common/**'
      - 'DASHI/Physics/YangMills/**'
      - 'scripts/check_yang_mills_clay_cross_pollination_round25.sh'
      - 'scripts/check_yang_mills_clay_highest_alpha_round24.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/yang-mills-clay-cross-pollination-round25.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Yang-Mills Clay cross-pollination
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ym-round25-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_yang_mills_clay_cross_pollination_round25.sh
          ) > ym-round25-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 ym-round25-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-round25-cross-pollination-logs
          path: |
            ym-round25-check.log
            ym-round25-agda.log
          if-no-files-found: warn
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
