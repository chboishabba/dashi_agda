name: Yang-Mills Clay highest-alpha Round 42 extension

# SECURITY BOUNDARY
#
# The self-hosted Agda runner executes checked-out repository code.  Therefore
# this workflow is intentionally restricted to pushes on the trusted Round-42
# development branch and is NOT triggered by pull_request events.  The open PR
# still receives the resulting commit status because its head is this branch,
# without allowing arbitrary PR checkout content to execute on the shared
# self-hosted runner.
on:
  push:
    branches:
      - agent/ym-clay-alpha-round42-master-reconciled-floor-recovery

jobs:
  round42-green-extension:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Validate Round 42 Green extension
        shell: bash
        run: |
          chmod +x scripts/check_yang_mills_clay_highest_alpha_round42_extension.sh
          AGDA_JOBS=1 bash scripts/check_yang_mills_clay_highest_alpha_round42_extension.sh
