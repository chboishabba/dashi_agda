name: Yang-Mills Clay highest-alpha cumulative extension

# SECURITY BOUNDARY
#
# The self-hosted Agda runner executes checked-out repository code.  Therefore
# this workflow is intentionally restricted to pushes on trusted development
# branches and is NOT triggered by pull_request events.  An open PR can still
# receive the resulting head-commit status without allowing arbitrary PR
# checkout content to execute on the shared self-hosted runner.
on:
  push:
    branches:
      - agent/ym-clay-alpha-round42-master-reconciled-floor-recovery
      - agent/ym-clay-alpha-round44-nonlinear-geometry-covariance

permissions:
  contents: read

jobs:
  cumulative-green-extension:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Validate cumulative Yang-Mills extension
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="${RUNNER_TEMP:-/tmp}/dashi-agda29"
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/round42-extension-agda.log"
          export AGDA_JOBS="${AGDA_JOBS:-1}"
          chmod +x scripts/check_yang_mills_clay_highest_alpha_round42_extension.sh
          bash scripts/check_yang_mills_clay_highest_alpha_round42_extension.sh
