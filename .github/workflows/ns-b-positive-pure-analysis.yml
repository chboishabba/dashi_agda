name: NS positive B pure analysis

on:
  push:
    branches:
      - 'agent/ns-b-positive-pure-analysis-maxcut'
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingQuarterMarginMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingQuarterMarginMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingStrictSplitMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingStrictSplitMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Test.agda'
      - '.github/workflows/ns-b-positive-pure-analysis.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingQuarterMarginMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingQuarterMarginMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingStrictSplitMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingStrictSplitMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Test.agda'
      - '.github/workflows/ns-b-positive-pure-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Agda semantic preflight
        run: python -m pip install -e tools/agda_preflight
      - name: Preflight B pure-analysis max-cut
        run: |
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingQuarterMarginMaxCutExact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingQuarterMarginMaxCutTest.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingStrictSplitMaxCutExact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalCriticalTouchingStrictSplitMaxCutTest.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Test.agda
