name: conscious-access-network-of-networks

on:
  pull_request:
    paths:
      - 'DASHI/Biology/StateDependentMultiplexTransducer.agda'
      - 'DASHI/Biology/ProductiveTransformCoherence.agda'
      - 'DASHI/Biology/SparseExpertRoutingCoalition.agda'
      - 'DASHI/Biology/ConsciousAccessCoalition.agda'
      - 'DASHI/Biology/UnconsciousAccessRegime.agda'
      - 'DASHI/Biology/SymbolicTransformWithoutHomunculus.agda'
      - 'DASHI/Biology/DeterministicCoarseGrainingBoundary.agda'
      - 'DASHI/Biology/PsychedelicAttractorReweightingBoundary.agda'
      - 'DASHI/Biology/ConsciousAccessNetworkSourceAtlas.agda'
      - 'DASHI/Biology/ConsciousAccessNetworkRegression.agda'
      - 'DASHI/Cognition/PNF/**.agda'
      - 'DASHI/Biology/NeuralDecisionProducerBridgeExact.agda'
      - 'DASHI/Biology/Everything.agda'
      - 'Docs/support/reference/ConsciousAccessNetworkOfNetworksFormalism.md'
      - 'scripts/check_conscious_access_network_of_networks.sh'
      - '.github/workflows/conscious-access-network-of-networks.yml'
  workflow_dispatch:

concurrency:
  group: conscious-access-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check conscious-access network-of-networks tranche
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
          export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export DASHI_NO_TMUX=1
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/conscious-access-network-agda.log"
          export AGDA_JOBS=4
          bash scripts/check_conscious_access_network_of_networks.sh
