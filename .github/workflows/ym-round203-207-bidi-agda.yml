name: YM R203-R207 BIDI Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanCMP98Equation119Round191Validation.agda'
      - 'DASHI/Physics/YangMills/BalabanFiniteSampleObservablePairingRound203Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanEquation119DerivativeDoesNotDetermineAverageRound204Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanFiniteMeasureWavefunctionL2BridgeRound205Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanFiniteMeasureIBPWavefunctionSymmetryRound206Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanFederbushRationalLieToRealSU2CarrierRound207Exact.agda'
      - '.github/workflows/ym-round203-207-bidi-agda.yml'

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ym-round203-207-agda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check YM R203-R207 BIDI with Agda 2.9
        id: agda
        shell: bash
        run: |
          set +e
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ym-round203-207-bidi.log"
          export AGDA_JOBS=4
          scripts/run_agda29_parallel_check.sh \
            DASHI/Physics/YangMills/BalabanCMP98Equation119Round191Validation.agda \
            > /tmp/ym-round203-207-bidi.log 2>&1
          status=$?
          tail -n 200 /tmp/ym-round203-207-bidi.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused Agda log
        uses: actions/upload-artifact@v4
        with:
          name: ym-round203-207-bidi-log
          path: /tmp/ym-round203-207-bidi.log
      - name: Fail on Agda error
        if: steps.agda.outputs.status != '0'
        run: exit 1
