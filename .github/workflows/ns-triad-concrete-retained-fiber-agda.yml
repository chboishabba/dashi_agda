    paths:
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalRetainedAuthorities.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClassFiniteFibers.agda'
      - 'DASHI/Physics/Closure/NSTriadKNUnifiedConcreteFiberSource.agda'
