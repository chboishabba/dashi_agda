      - 'DASHI/Physics/Closure/NSTriadKNFiniteSpectralDoesNotImplyUniform.agda'
      - 'DASHI/Physics/Closure/NSTriadKNGalerkinGlobalRegularityCompletion.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalTriadFrontierProgram.agda'
