name: NS triad physical frontier Agda

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKN*.agda'
      - 'DASHI/Papers/NavierStokes/TheoremInterfaceRound1*.agda'
      - 'scripts/ns_triad_signed_frontier_lab.py'
      - 'scripts/check_ns_triad_completion_identities.py'
      - 'scripts/check_ns_triad_clay_frontier.py'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ns-triad-concrete-retained-fiber-agda.yml'
  workflow_dispatch:

concurrency:
  group: ns-triad-physical-frontier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Reject new frontier holes and postulates
        run: python3 scripts/check_ns_triad_clay_frontier.py

      - name: Verify exact signed finite laboratory
        run: >-
          python3 scripts/ns_triad_signed_frontier_lab.py
          --cutoff 1 --overlap 3 --verify

      - name: Verify exact null, orbit, and shell identities
        run: >-
          python3 scripts/check_ns_triad_completion_identities.py
          --cutoff 3 --separation 3

      - name: Type-check complete physical Stage3 frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNConcretePhysicalRetainedFiberProgram.agda

      - name: Type-check Round101 eigenpacket frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound101Validation.agda

      - name: Type-check Round102 two-obligation frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound102Validation.agda

      - name: Type-check Round103 radial-flux frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound103Validation.agda

      - name: Type-check Round104 packet-flux frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound104Validation.agda

      - name: Type-check Round105 Waleffe phase frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound105Validation.agda

      - name: Type-check Round106 cross-route frontier alignment
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound106Validation.agda

      - name: Type-check Round107 Serrin-Wiener forcing reduction
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound107Validation.agda

      - name: Type-check Round108 critical-scaling and signed forcing audit
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound108Validation.agda

      - name: Type-check Round109 self-external Waleffe frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound109Validation.agda

      - name: Type-check Round110 internal-payment external-residue frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound110Validation.agda

      - name: Type-check Round111 external-residual commutator/Bony frontier
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound111Validation.agda
