      - 'DASHI/Physics/Closure/NSTriadKNRetainedPositiveSectorKernelOperator.agda'
      - 'DASHI/Physics/Closure/NSTriadKNAdmissibleFourierTriadCarrier.agda'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ns-triad-concrete-retained-fiber-agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Type-check concrete physical Stage3 aggregate
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNConcretePhysicalRetainedFiberProgram.agda
