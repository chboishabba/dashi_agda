name: SensibLaw institutional operation

on:
  push:
    paths:
      - 'DASHI/Law/SensibLawOperationalLegalityExact.agda'
      - 'DASHI/Law/SensibLawOperationalLegalityRegression.agda'
      - 'DASHI/Law/SensibLawInstitutionalResponsibilityExact.agda'
      - 'DASHI/Law/SensibLawInstitutionalResponsibilityRegression.agda'
      - 'DASHI/Law/SensibLawEpistemicConsequenceBoundaryExact.agda'
      - 'DASHI/Law/SensibLawEpistemicConsequenceBoundaryRegression.agda'
      - 'DASHI/Law/SensibLawInstitutionalOperationEverything.agda'
      - 'DASHI/Law/SensibLawInstitutionalOperationEverythingRegression.agda'
      - 'DASHI/Core/QueryIndexedProjectionAdequacyExact.agda'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/sensiblaw-institutional-operation.yml'
  pull_request:
    paths:
      - 'DASHI/Law/SensibLawOperationalLegalityExact.agda'
      - 'DASHI/Law/SensibLawOperationalLegalityRegression.agda'
      - 'DASHI/Law/SensibLawInstitutionalResponsibilityExact.agda'
      - 'DASHI/Law/SensibLawInstitutionalResponsibilityRegression.agda'
      - 'DASHI/Law/SensibLawEpistemicConsequenceBoundaryExact.agda'
      - 'DASHI/Law/SensibLawEpistemicConsequenceBoundaryRegression.agda'
      - 'DASHI/Law/SensibLawInstitutionalOperationEverything.agda'
      - 'DASHI/Law/SensibLawInstitutionalOperationEverythingRegression.agda'
      - 'DASHI/Core/QueryIndexedProjectionAdequacyExact.agda'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/sensiblaw-institutional-operation.yml'
  workflow_dispatch:

concurrency:
  group: sensiblaw-institutional-operation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject trust escapes in institutional operation tranche
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Law/SensibLawOperationalLegalityExact.agda
            DASHI/Law/SensibLawOperationalLegalityRegression.agda
            DASHI/Law/SensibLawInstitutionalResponsibilityExact.agda
            DASHI/Law/SensibLawInstitutionalResponsibilityRegression.agda
            DASHI/Law/SensibLawEpistemicConsequenceBoundaryExact.agda
            DASHI/Law/SensibLawEpistemicConsequenceBoundaryRegression.agda
            DASHI/Law/SensibLawInstitutionalOperationEverything.agda
            DASHI/Law/SensibLawInstitutionalOperationEverythingRegression.agda
          )
          if grep -nE '\bpostulate\b|\{!|!\}|--allow-unsolved-metas' "${files[@]}"; then
            echo 'trust escape found in institutional operation tranche' >&2
            exit 1
          fi
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: sensiblaw-institutional-operation-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Check institutional operation modules
        id: focused
        shell: bash
        run: |
          set +e
          (
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-sensiblaw-institutional-operation.log"
            export AGDA_JOBS=2
            targets=(
              DASHI/Law/SensibLawOperationalLegalityRegression.agda
              DASHI/Law/SensibLawInstitutionalResponsibilityRegression.agda
              DASHI/Law/SensibLawEpistemicConsequenceBoundaryRegression.agda
              DASHI/Law/SensibLawInstitutionalOperationEverythingRegression.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-sensiblaw-institutional-operation.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 220 agda-sensiblaw-institutional-operation.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensiblaw-institutional-operation-agda-log
          path: agda-sensiblaw-institutional-operation.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
