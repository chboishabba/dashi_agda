name: NS Round41 defect density annular Com

on:
  push:
    branches:
      - agent/ns-defect-density-annular-com-round41
    paths:
      - 'DASHI/Physics/Closure/NSTriadKN*Round41Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNDefectDensityAnnularComRound41Validation.agda'
      - 'scripts/check_ns_defect_density_annular_com_round41.sh'
      - '.github/workflows/ns-defect-density-annular-com-round41.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKN*Round41Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNDefectDensityAnnularComRound41Validation.agda'
      - 'scripts/check_ns_defect_density_annular_com_round41.sh'
      - '.github/workflows/ns-defect-density-annular-com-round41.yml'
  workflow_dispatch:

jobs:
  agda-round41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Round41 hard-math tranche
        run: bash scripts/check_ns_defect_density_annular_com_round41.sh
      - name: Upload checker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round41-checker-logs
          path: |
            .agda-check-logs
            *.log
          if-no-files-found: ignore
