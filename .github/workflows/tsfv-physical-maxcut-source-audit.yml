name: TSFV P01-P08 Physical Maxcut Source Audit

on:
  push:
    branches:
      - research/lorentz31-directional-kk-ym-20261103
    paths:
      - 'DASHI/Physics/Foundations/TSFVSelectedLatticeAcousticKKFlatControlExact.agda'
      - 'DASHI/Physics/Foundations/TSFVKKHorizontalReductionNoninjectiveBidiExact.agda'
      - 'DASHI/Physics/Foundations/TSVFOSRealTimeDifferenceQuotientGeneratorWeldExact.agda'
      - 'DASHI/Unified/BalabanRGTOERegression.agda'
      - 'DASHI/Unified/TSFVUnifiedRegression.agda'
      - 'DASHI/Unified/TSFVParentChildRegression.agda'
      - 'scripts/check_tsfv_selected_scalar_kk_os_control_20261106.py'
      - 'scripts/check_tsfv_lattice_impulse_dimension_exact_20261106.py'
      - 'Docs/roadmaps/Emergent31QuantumYMKKExactLemmaRoadmap20261103.md'
      - '.github/workflows/tsfv-physical-maxcut-source-audit.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/TSFVSelectedLatticeAcousticKKFlatControlExact.agda'
      - 'DASHI/Physics/Foundations/TSFVKKHorizontalReductionNoninjectiveBidiExact.agda'
      - 'DASHI/Physics/Foundations/TSVFOSRealTimeDifferenceQuotientGeneratorWeldExact.agda'
      - 'DASHI/Unified/BalabanRGTOERegression.agda'
      - '.github/workflows/tsfv-physical-maxcut-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-symbolic-source:
    name: Exact SymPy chosen-source model (not physical YM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact reference dependencies
        run: |
          python -m pip install 'sympy==1.14.0' 'numpy==2.1.3'
          python -m pip show sympy numpy
      - name: Execute same-source flat KK and free OS model
        run: |
          python scripts/check_tsfv_selected_scalar_kk_os_control_20261106.py
          python scripts/check_tsfv_lattice_impulse_dimension_exact_20261106.py
      - name: Check 186 original lemma IDs/status coverage
        run: |
          python scripts/check_emergent31_complete_186_status_20261104.py

  agda-selected-golden:
    name: Agda native selected owners and Golden source graph
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install reproducible system Agda provenance
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq agda-bin agda-stdlib >/dev/null
          cp -a /usr/share/agda-stdlib .agda-stdlib
          agda --version
          apt-cache policy agda-bin agda-stdlib
          sha256sum .agda-stdlib/standard-library.agda-lib || true
      - name: Typecheck exact native source owners with Agda safe
        shell: bash
        run: |
          set +e
          failures=0
          for module in \
            DASHI/Physics/Foundations/TSFVKKSelectedHorizontalMetricSchurExact.agda \
            DASHI/Physics/Foundations/TSFVSelectedLatticeAcousticKKFlatControlExact.agda \
            DASHI/Physics/Foundations/TSFVKKHorizontalReductionNoninjectiveBidiExact.agda \
            DASHI/Physics/Foundations/TSVFOSRealTimeDifferenceQuotientGeneratorWeldExact.agda \
            DASHI/Unified/BalabanRGTOERegression.agda \
            DASHI/Unified/TSFVUnifiedRegression.agda \
            DASHI/Unified/TSFVParentChildRegression.agda; do
            echo "::group::Agda safe $module"
            timeout 360s agda --safe --no-libraries --no-default-libraries \
              -i . -i .agda-stdlib "$module"
            result=$?
            echo "AGDA_EXIT module=$module status=$result"
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "AGDA_GOLDEN_FAILURES=$failures"
          test "$failures" -eq 0

# A successful job certifies the listed Agda source roots against its
# printed compiler/stdlib versions. It cannot certify a physical
# microscopic (3,1) emergence, an interacting 4D YM OS construction,
# a physically selected 5D Einstein matter source, or a Clay mass gap.
