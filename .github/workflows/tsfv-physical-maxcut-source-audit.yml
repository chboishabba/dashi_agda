name: TSFV P01-P08 Physical Maxcut Source Audit

on:
  push:
    branches:
      - research/lorentz31-directional-kk-ym-20261103
    paths:
      - 'DASHI/Physics/Foundations/TSFVSelectedLatticeAcousticKKFlatControlExact.agda'
      - 'DASHI/Physics/Foundations/TSFVAcousticMassInverseBidiNoGoExact.agda'
      - 'DASHI/Physics/Foundations/TSFVAcousticLocalImpulseThirdDerivativeExact.agda'
      - 'DASHI/Physics/Foundations/TSFVKKHorizontalReductionNoninjectiveBidiExact.agda'
      - 'DASHI/Physics/Foundations/TSVFOSRealTimeDifferenceQuotientGeneratorWeldExact.agda'
      - 'DASHI/Unified/BalabanRGTOERegression.agda'
      - 'DASHI/Unified/TSFVUnifiedRegression.agda'
      - 'DASHI/Unified/TSFVParentChildRegression.agda'
      - 'scripts/check_tsfv_selected_scalar_kk_os_control_20261106.py'
      - 'scripts/check_tsfv_acoustic_impulse_mass_bidi_20261106.py'
      - 'scripts/check_tsfv_unification_48_phase_cut_20261106.py'
      - 'scripts/run_tsfv_unification_maxcut_20261106.sh'
      - 'scripts/check_tsfv_lattice_impulse_dimension_exact_20261106.py'
      - 'Docs/roadmaps/Emergent31QuantumYMKKExactLemmaRoadmap20261103.md'
      - 'Docs/roadmaps/TSFVUnificationExecutionPhasesDeliverablesExactLemmas20261106.md'
      - '.github/workflows/tsfv-physical-maxcut-source-audit.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/TSFVSelectedLatticeAcousticKKFlatControlExact.agda'
      - 'DASHI/Physics/Foundations/TSFVAcousticMassInverseBidiNoGoExact.agda'
      - 'DASHI/Physics/Foundations/TSFVAcousticLocalImpulseThirdDerivativeExact.agda'
      - 'DASHI/Physics/Foundations/TSFVKKHorizontalReductionNoninjectiveBidiExact.agda'
      - 'DASHI/Physics/Foundations/TSVFOSRealTimeDifferenceQuotientGeneratorWeldExact.agda'
      - 'DASHI/Unified/BalabanRGTOERegression.agda'
      - '.github/workflows/tsfv-physical-maxcut-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-symbolic-source:
    name: Exact SymPy chosen-source model (not physical YM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact reference dependencies
        run: |
          python -m pip install 'sympy==1.14.0' 'numpy==2.1.3'
          python -m pip show sympy numpy
      - name: Execute same-source flat KK and free OS model
        run: |
          python scripts/check_tsfv_selected_scalar_kk_os_control_20261106.py
          python scripts/check_tsfv_lattice_impulse_dimension_exact_20261106.py
          python scripts/check_tsfv_acoustic_impulse_mass_bidi_20261106.py
      - name: Check 186 original lemma IDs/status coverage
        run: |
          python scripts/check_emergent31_complete_186_status_20261104.py
          python scripts/check_tsfv_unification_48_phase_cut_20261106.py

  agda-selected-golden:
    name: Agda29 parallel_checker selected-source + transitive roots
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: DeterminateSystems/nix-installer-action@v3
      - name: Run canonical Agda29 parallel checker for #1460
        env:
          AGDA_JOBS: '4'
          DASHI_NO_TMUX: '1'
          AGDA_FLAKE: 'github:chboishabba/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin'
          AGDA_LOG_PATH: ${{ runner.temp }}/tsfv-agda29-parallel.log
          DASHI_AGDA29_CACHE_ROOT: ${{ runner.temp }}/dashi-agda29-tsfv
        run: |
          set -euo pipefail
          bash scripts/run_tsfv_unification_maxcut_20261106.sh

# A green job establishes only the specific Agda and source-level checks.
# A separate transitive trust audit and source-matched PHYSICAL E1
# evidence remain necessary for the unification theorem.
