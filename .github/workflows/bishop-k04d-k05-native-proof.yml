name: Bishop K04d K05 Agda-2.9 golden proof receipts

on:
  push:
    branches:
      - feat/twin-prime-six-wheel-bounded-gap-reuse-20261028
    paths:
      - 'DASHI/Analysis/Bishop*.agda'
      - 'DASHI/Foundations/BishopFiniteEvenOddCauchyReindexExact.agda'
      - 'DASHI/Foundations/BishopNegativeLogGeometricSourceConvergenceExact.agda'
      - 'DASHI/Foundations/BishopNegativeLogExponentialReciprocalFromCancellationExact.agda'
      - 'DASHI/Foundations/BishopMachinQuarterAngleBranchExact.agda'
      - 'DASHI/Foundations/BishopRound11SignedFactorialExponentEncodingExact.agda'
      - 'DASHI/Foundations/BishopGroupedCauchyParityTelescopeExact.agda'
      - 'DASHI/Foundations/BishopRound11FiniteParityDegreeZeroExact.agda'
      - 'DASHI/Foundations/BishopUnsignedFactorialCauchyParitySplitExact.agda'
      - 'DASHI/Foundations/BishopSignTwistedFiniteCauchyCoefficientExact.agda'
      - 'DASHI/Foundations/BishopRound11SignedFactorialDegreeBinomialExact.agda'
      - 'scripts/check_k05_symbolic_grouped.py'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Unified/Everything.agda'
      - '.github/workflows/bishop-k04d-k05-native-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bishop-k04d-k05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Original pinned Bishop, DCHoTT and cubical submodules
        run: git submodule update --init vendor/bishop DCHoTT-Agda cubical

      - name: Install Nix (the repository pins the Agda-2.9 executable)
        uses: nix-community/install-nix-action@v31

      - name: Resolve repository-pinned Agda-2.9 executable
        shell: bash
        run: |
          set -euo pipefail
          AGDA_STORE="$(nix build --no-link --print-out-paths '.#agda29-parallel')"
          echo "AGDA_BIN=${AGDA_STORE}/bin/agda" >> "$GITHUB_ENV"
          "${AGDA_STORE}/bin/agda" --version

      - name: Resolve the repository-selected experimental stdlib
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch experimental https://github.com/agda/agda-stdlib.git "$GITHUB_WORKSPACE/.agda-stdlib"
          git -C "$GITHUB_WORKSPACE/.agda-stdlib" rev-parse HEAD | tee agda-stdlib-sha.txt

      - name: Independent finite exact bivariate coefficient regression
        shell: bash
        run: python3 scripts/check_k05_symbolic_grouped.py --through-degree 48 | tee bishop-k05-symbolic.log

      - name: Kernel check all focused K05 and K04d new owners
        shell: bash
        run: |
          set -uo pipefail
          status=0
          source_stdlib="$GITHUB_WORKSPACE/.agda-stdlib/src"
          flags=(
            --no-libraries --no-default-libraries --safe
            -i . -i vendor/bishop -i DCHoTT-Agda -i cubical
            -i "$source_stdlib"
            -WnoUnsupportedIndexedMatch
          )
          files=(
            DASHI/Analysis/BishopOneStepLagConvergenceExact.agda
            DASHI/Analysis/BishopSetoidSqueezeConvergenceExact.agda
            DASHI/Analysis/BishopMonotoneDoubleSubsequenceLimitExact.agda
            DASHI/Foundations/BishopFiniteEvenOddCauchyReindexExact.agda
            DASHI/Foundations/BishopRound11SignedFactorialExponentEncodingExact.agda
            DASHI/Foundations/BishopGroupedCauchyParityTelescopeExact.agda
            DASHI/Foundations/BishopRound11FiniteParityDegreeZeroExact.agda
            DASHI/Foundations/BishopUnsignedFactorialCauchyParitySplitExact.agda
            DASHI/Foundations/BishopSignTwistedFiniteCauchyCoefficientExact.agda
            DASHI/Foundations/BishopRound11SignedFactorialDegreeBinomialExact.agda
            # Terminal and same-object consumer checks: unlike static lemma
            # discovery, these force Agda to elaborate the actual endpoints.
            DASHI/Foundations/BishopNegativeLogGeometricSourceConvergenceExact.agda
            DASHI/Foundations/BishopNegativeLogExponentialReciprocalFromCancellationExact.agda
            DASHI/Analysis/BishopRound11CanonicalNegativeLogSameObjectExact.agda
            DASHI/Analysis/BishopRiemannDirichletExponentialTermExact.agda
            DASHI/Analysis/BishopRiemannDirichletBaselSameObjectExact.agda
            DASHI/Analysis/BishopRound11ImaginaryProductPythagoreanReuseExact.agda
            DASHI/Analysis/BishopMachinQuarterPhaseQuadruplicationAlgebraExact.agda
            DASHI/Foundations/BishopMachinQuarterAngleBranchExact.agda
            DASHI/Analysis/BishopMachinFirstPositiveSineZeroFromNativePhaseExact.agda
            DASHI/Analysis/BishopMachinZetaSequentialContinuityReducerExact.agda
            DASHI/Analysis/BishopRound11ConcreteAbsoluteSeriesConvergenceExact.agda
            DASHI/Analysis/BishopGenericCauchyFromAbsoluteTriangleExact.agda
            DASHI/Analysis/BishopPositiveCauchyTriangleFromAbsoluteSeriesExact.agda
            DASHI/Analysis/BishopFinitePowerSeriesSequentialContinuityExact.agda
            DASHI/Analysis/BishopUniformLimitSequentialContinuityExact.agda
            DASHI/Analysis/BishopDirichletUniformLimitContinuityCompilerExact.agda
            DASHI/Analysis/BishopOriginalCompletedZetaUniformChartContinuityExact.agda
            DASHI/Analysis/BishopRound11NativeComplexRectangleExact.agda
          )
          : > bishop-focused-kernel.log
          for file in "${files[@]}"; do
            echo "=== golden agda --safe ${file} ===" | tee -a bishop-focused-kernel.log
            timeout 600s "$AGDA_BIN" "${flags[@]}" "$file" 2>&1 | tee -a bishop-focused-kernel.log
            rc=${PIPESTATUS[0]}
            if [[ ${rc} -ne 0 ]]; then
              echo "FAIL rc=${rc} ${file}" | tee -a bishop-focused-kernel.log
              status=1
            else
              echo "PASS ${file}" | tee -a bishop-focused-kernel.log
            fi
          done
          exit "${status}"

      - name: Check three canonical TOE roots against exact branch
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          status=0
          source_stdlib="$GITHUB_WORKSPACE/.agda-stdlib/src"
          flags=(
            --no-libraries --no-default-libraries
            -i . -i vendor/bishop -i DCHoTT-Agda -i cubical
            -i "$source_stdlib"
            -WnoUnsupportedIndexedMatch
          )
          : > bishop-toe-kernel.log
          for file in             DASHI/EverythingTOESymmetryResolved369.agda             DASHI/Unifier.agda             DASHI/Unified/Everything.agda; do
            echo "=== golden TOE ${file} ===" | tee -a bishop-toe-kernel.log
            timeout 600s "$AGDA_BIN" "${flags[@]}" "$file" 2>&1 | tee -a bishop-toe-kernel.log
            rc=${PIPESTATUS[0]}
            if [[ ${rc} -ne 0 ]]; then
              echo "FAIL rc=${rc} ${file}" | tee -a bishop-toe-kernel.log
              status=1
            else
              echo "PASS ${file}" | tee -a bishop-toe-kernel.log
            fi
          done
          exit "${status}"

      - name: Preserve exact-head proof receipts and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bishop-k04d-k05-agda29-kernel-receipts
          path: |
            bishop-focused-kernel.log
            bishop-toe-kernel.log
            agda-stdlib-sha.txt
            bishop-k05-symbolic.log
