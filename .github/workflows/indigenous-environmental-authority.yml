name: Indigenous environmental authority Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Core/KnowledgeContentAuthoritySeparationExact.agda'
      - 'DASHI/Governance/IndigenousEnvironmentalJusticeSourceRegistryExact.agda'
      - 'DASHI/Governance/SteffensenCulturalFireAuthorityExact.agda'
      - 'DASHI/Governance/CulturalFireAuthorityEnvelopeBridgeExact.agda'
      - 'DASHI/Governance/NativeTitleAuthorityLayerExact.agda'
      - 'DASHI/Governance/IPCCAR6IndigenousKnowledgeIntegrationAuditExact.agda'
      - 'DASHI/Governance/CaceresAuthorityWithoutEnforcementExact.agda'
      - 'DASHI/Governance/NavdanyaSeedSovereigntyNonseparabilityExact.agda'
      - 'DASHI/Governance/IndigenousEnvironmentalAuthorityCapstoneExact.agda'
      - 'DASHI/Governance/IndigenousEnvironmentalAuthorityRegression.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Governance/Everything.agda'
      - '.github/workflows/indigenous-environmental-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Trust scan
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Core/KnowledgeContentAuthoritySeparationExact.agda
            DASHI/Governance/IndigenousEnvironmentalJusticeSourceRegistryExact.agda
            DASHI/Governance/SteffensenCulturalFireAuthorityExact.agda
            DASHI/Governance/CulturalFireAuthorityEnvelopeBridgeExact.agda
            DASHI/Governance/NativeTitleAuthorityLayerExact.agda
            DASHI/Governance/IPCCAR6IndigenousKnowledgeIntegrationAuditExact.agda
            DASHI/Governance/CaceresAuthorityWithoutEnforcementExact.agda
            DASHI/Governance/NavdanyaSeedSovereigntyNonseparabilityExact.agda
            DASHI/Governance/IndigenousEnvironmentalAuthorityCapstoneExact.agda
            DASHI/Governance/IndigenousEnvironmentalAuthorityRegression.agda
          )
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|sorry|admit)\b' "${files[@]}"; then
            echo 'Forbidden trust-boundary token found.' >&2
            exit 1
          fi
      - name: Check focused tranche with Agda 2.9
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
          export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export DASHI_NO_TMUX=1
          export AGDA_JOBS=2
          scripts/run_agda29_parallel_check.sh \
            DASHI/Governance/IndigenousEnvironmentalAuthorityRegression.agda \
            DASHI/Governance/IndigenousEnvironmentalAuthorityCapstoneExact.agda \
            DASHI/Governance/Everything.agda
