name: Yang-Mills P33 Wilson physical completion

on:
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanP33*.agda'
      - 'scripts/check_yang_mills_p33_wilson_physical_completion.sh'
      - '.github/workflows/yang-mills-p33-wilson-physical-completion.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
      - name: Check concrete Wilson, CMP109, inverse and weighted P33 mathematics
        run: nix develop --command bash scripts/check_yang_mills_p33_wilson_physical_completion.sh
