name: Kozyrev mirror claim-intake regressions

on:
  push:
    branches:
      - feat/kozyrev-mirror-claim-testing
    paths:
      - 'DASHI/Empirical/KozyrevMirrorClaimTesting.agda'
      - 'scripts/kozyrev_mirror_claim_test.py'
      - 'scripts/tests/test_kozyrev_mirror_claim_test.py'
      - '.github/workflows/kozyrev-mirror-claim-testing.yml'
  pull_request:
    paths:
      - 'DASHI/Empirical/KozyrevMirrorClaimTesting.agda'
      - 'scripts/kozyrev_mirror_claim_test.py'
      - 'scripts/tests/test_kozyrev_mirror_claim_test.py'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Unified/Everything.agda'

jobs:
  claim-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only assay regressions
        run: python -m unittest discover -s scripts/tests -p 'test_kozyrev_mirror_claim_test.py' -v
      - name: Preflight (not an Agda kernel proof)
        run: |
          python -m pip install -e tools/agda_preflight
          dashi-agda-preflight --root . DASHI/Empirical/KozyrevMirrorClaimTesting.agda
