name: Grokking circuit temporal alignment Agda

on:
  pull_request:
    paths:
      - 'DASHI/Cognition/PNF/GrokkingSparseActiveColouringRoutingExact.agda'
      - 'DASHI/Cognition/PNF/GrokkingSparseActiveColouringRoutingRegression.agda'
      - 'DASHI/Learning/GrokkingCircuitTemporalAlignmentExact.agda'
      - 'DASHI/Learning/GrokkingCircuitTemporalAlignmentRegression.agda'
      - 'DASHI/Learning/GrokkingRegression.agda'
      - 'DASHI/Programmes/GrokkingExact.agda'
      - 'Docs/learning/GrokkingOperatorFormalism.md'
      - 'scripts/mod97_checkpoint_producer.py'
      - 'scripts/mod97_circuit_intervention_producer.py'
      - 'tests/test_mod97_checkpoint_producer.py'
      - 'tests/test_mod97_circuit_intervention_producer.py'
      - '.github/workflows/grokking-circuit-temporal-alignment-agda.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  producer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run provenance-safe Mod97 producer tests
        run: |
          python -m pytest -q \
            tests/test_mod97_checkpoint_producer.py \
            tests/test_mod97_circuit_intervention_producer.py
      - name: Check producer syntax
        run: |
          python -m py_compile scripts/mod97_checkpoint_producer.py
          python -m py_compile scripts/mod97_circuit_intervention_producer.py
      - name: Exercise checkpoint plan-only manifest without PyTorch
        run: |
          python scripts/mod97_checkpoint_producer.py \
            --seed 0 \
            --split-seed 17 \
            --weight-decay-milli 600 \
            --embedding-dim 32 \
            --hidden-dim 128 \
            --checkpoint-cadence 1000 \
            --plan-only > /tmp/mod97-plan.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/mod97-plan.json'))
          assert p['provenance']['historical_receipt_same_run'] is False
          assert p['provenance']['historical_receipt_same_configuration'] is False
          assert p['provenance']['historical_checkpoint_reconstruction'] is False
          assert p['training']['checkpoint_epochs'][0] == 0
          assert p['training']['checkpoint_epochs'][-1] == 15000
          PY
      - name: Exercise intervention CLI import boundary without PyTorch
        run: python scripts/mod97_circuit_intervention_producer.py --help >/dev/null

  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Reject trust escapes in new temporal-alignment surface
        run: |
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|{!!}|\?)\b' \
            DASHI/Learning/GrokkingCircuitTemporalAlignmentExact.agda \
            DASHI/Learning/GrokkingCircuitTemporalAlignmentRegression.agda; then
            echo 'trust escape found in temporal-alignment surface'
            exit 1
          fi
      - name: Typecheck temporal-alignment regression root
        run: nix develop .# --command agda -i . DASHI/Learning/GrokkingCircuitTemporalAlignmentRegression.agda
