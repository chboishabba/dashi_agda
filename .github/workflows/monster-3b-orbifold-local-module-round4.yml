name: Monster 3B orbifold local module round 4

on:
  pull_request:
    branches:
      - 'master'
      - 'agent/monster-3b-projector-resolution-round3'
      - 'agent/monster-3b-orbifold-local-module-round4'
    paths:
      - 'DASHI/Moonshine/LeechWeightTwo196608BridgeExact.agda'
      - 'DASHI/Moonshine/MoonshineOrbifoldWeightTwoDecompositionExact.agda'
      - 'DASHI/Moonshine/MoonshineOrbifoldMasslessStateRemovalExact.agda'
      - 'DASHI/Moonshine/MoonshineZ3OrbifoldThreeLocalSiblingExact.agda'
      - 'DASHI/Moonshine/LeechWeightTwo196608AuthorityCorrectionExact.agda'
      - 'DASHI/Moonshine/Monster3BMultiplicityEvaluationExact.agda'
      - 'DASHI/Moonshine/Monster3BKernelCharacterCriterionExact.agda'
      - 'DASHI/Moonshine/Monster3BNormalizerCocycleCancellationExact.agda'
      - 'DASHI/Moonshine/Monster3BOrbifoldLocalModuleRound4Validation.agda'
      - 'DASHI/EverythingMonster3BOrbifoldLocalModuleRound4.agda'
      - 'Docs/support/reference/Monster3BOrbifoldLocalModuleRound4.md'
      - 'scripts/monster_3b_normalizer_restriction.g'
      - 'scripts/render_monster_3b_certificate.py'
      - 'scripts/check_monster_3b_orbifold_local_module_round4.sh'
      - '.github/workflows/monster-3b-orbifold-local-module-round4.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GAP, CTblLib and certificate dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
      - name: Check Monster 3B orbifold/local-module tranche
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_monster_3b_orbifold_local_module_round4.sh
      - name: Upload actual MN3B and model certificates
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: monster-3b-orbifold-local-module-round4
          path: |
            build/monster_3b_normalizer_restriction.json
            build/monster_3b_heisenberg_model_certificate.json
            build/generated/DASHI/Moonshine/Generated/Monster3BRestrictionCertificate.agda
            build/monster_3b_dashboard/elementary_abelian_two_plane_certificate.json
          if-no-files-found: error
