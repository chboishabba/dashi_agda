name: Aristotle merge experiment Agda

on:
  pull_request:
    paths:
      - 'DASHI/Reasoning/AristotleMCGSHypergraphExact.agda'
      - 'DASHI/Reasoning/AristotleMCGSIntrospectiveSpecimen.agda'
      - 'DASHI/Reasoning/AristotleMCGSRecoveredWitness.agda'
      - 'DASHI/Reasoning/AristotleBranchMergeExact.agda'
      - 'DASHI/Reasoning/AristotleMergeExperimentDesignExact.agda'
      - 'DASHI/Reasoning/AristotleMergeExperimentValidation.agda'
      - 'DASHI/Reasoning/Everything.agda'
      - 'scripts/check_aristotle_merge_experiment.sh'
      - '.github/workflows/aristotle-merge-experiment-agda.yml'
  workflow_dispatch:

concurrency:
  group: aristotle-merge-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run Aristotle merge/experiment audit
        run: nix develop .# --command bash scripts/check_aristotle_merge_experiment.sh
