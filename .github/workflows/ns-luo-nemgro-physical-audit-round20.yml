name: NS Luo NEMGRO physical audit round 20

on:
  push:
    branches:
      - 'agent/ns-luo-nemgro-physical-audit-round20'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'docs/ns-luo-nemgro-*-round20.md'
      - 'scripts/check_ns_luo_nemgro_physical_audit_round20.sh'
      - '.github/workflows/ns-luo-nemgro-physical-audit-round20.yml'
  pull_request:
    branches:
      - 'agent/ns-luo-unconditional-absorption-audit-round19'
      - 'agent/ns-luo-nemgro-physical-audit-round20'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'docs/ns-luo-nemgro-*-round20.md'
      - 'scripts/check_ns_luo_nemgro_physical_audit_round20.sh'
      - '.github/workflows/ns-luo-nemgro-physical-audit-round20.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check NEMGRO physical audit round twenty
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-round20-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_ns_luo_nemgro_physical_audit_round20.sh
          ) > ns-round20-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 500 ns-round20-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round20-logs
          path: |
            ns-round20-check.log
            ns-round20-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='NS round 20 Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='NS round 20 Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='ns-round20-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
