name: cabarlah-palestine-formalism

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/Cabarlah*'
      - 'DASHI/Physics/Foundations/SettlerEnemyAbstractionExact.agda'
      - 'DASHI/Physics/Foundations/IndigenousMilitaryIntelligenceCircuitExact.agda'
      - 'DASHI/Physics/Foundations/FrontierEnemyPersistenceExact.agda'
      - 'DASHI/Physics/Foundations/Everything.agda'
      - 'Docs/support/reference/CabarlahPalestineProvenanceFormalism.md'
      - 'scripts/check_cabarlah_palestine_formalism.sh'
      - '.github/workflows/cabarlah-palestine-formalism.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Resolve repository Agda toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-link --print-out-paths .#agda-with-dashi-deps)"
          agda_bin="$package/bin/agda"
          test -x "$agda_bin"
          "$agda_bin" --version
          printf 'AGDA_BIN=%s\n' "$agda_bin" >> "$GITHUB_ENV"
      - name: Check Cabarlah Palestine formalism
        env:
          DASHI_REPO_ROOT: ${{ github.workspace }}
          DASHI_AGDA29_EPHEMERAL: '1'
          AGDA_LOG_PATH: ${{ runner.temp }}/cabarlah-palestine-agda.log
        run: bash scripts/check_cabarlah_palestine_formalism.sh
      - name: Report kernel-check status to the active pull request
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$GITHUB_REF_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            echo "No open pull request found for $GITHUB_REF_NAME; skipping comment."
            exit 0
          fi

          gh pr comment "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Cabarlah-Palestine repository-flake Agda kernel check ${CHECK_STATUS} on ${GITHUB_SHA} (workflow run ${GITHUB_RUN_ID})."
