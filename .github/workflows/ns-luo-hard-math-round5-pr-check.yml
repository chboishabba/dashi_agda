name: NS Luo hard-math round 5 PR check

on:
  pull_request:
    branches:
      - agent/ns-luo-hard-math-round4
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNLuo*.agda'
      - 'scripts/check_ns_luo_hard_math_round5.sh'
      - '.github/workflows/ns-luo-hard-math-round5-pr-check.yml'

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ns-luo-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish focused run id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="Round-five PR validation run: ${GITHUB_RUN_ID}; head: ${{ github.event.pull_request.head.sha }}"

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Luo round-five hard math with Agda 2.9
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-luo-round5-check.log"
            export AGDA_JOBS=4
            scripts/check_ns_luo_hard_math_round5.sh
          ) > ns-luo-round5-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 240 ns-luo-round5-check.log
          exit 0

      - name: Upload exact checked source
        if: always()
        shell: bash
        run: git archive --format=tar.gz --output=dashi-round5-source.tar.gz HEAD

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-luo-round5-pr-${{ github.run_id }}
          path: |
            ns-luo-round5-check.log
            dashi-round5-source.tar.gz
          if-no-files-found: error

      - name: Fail on Agda error
        if: steps.check.outputs.status != '0'
        run: exit 1
