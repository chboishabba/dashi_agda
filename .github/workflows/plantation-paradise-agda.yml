name: Plantation to Paradise Agda

on:
  pull_request:
    paths:
      - 'DASHI/Culture/PowersPlantationParadiseSourceAtlasExact.agda'
      - 'DASHI/Culture/PowersPlantationParadiseHistoricalClaimReceiptsExact.agda'
      - 'DASHI/Culture/ColonialPerformanceStatusNonfactorabilityExact.agda'
      - 'DASHI/Culture/HistoricalArchiveAbsenceNonfactorabilityExact.agda'
      - 'DASHI/Culture/ColonialTheatreAccessAdapterExact.agda'
      - 'DASHI/Culture/PowersPlantationParadiseGovernedCrossPollinationExact.agda'
      - 'DASHI/Culture/PowersPlantationParadiseSynthesisExact.agda'
      - 'DASHI/Culture/PowersPlantationParadiseValidation.agda'
      - 'DASHI/Culture/Everything.agda'
      - 'scripts/test_plantation_paradise_maxcut.py'
      - '.github/workflows/plantation-paradise-agda.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Static max-cut contract
        run: nix develop .# --command python scripts/test_plantation_paradise_maxcut.py
      - name: Typecheck source atlas
        run: nix develop .# --command agda -i . DASHI/Culture/PowersPlantationParadiseSourceAtlasExact.agda
      - name: Typecheck historical claim receipts
        run: nix develop .# --command agda -i . DASHI/Culture/PowersPlantationParadiseHistoricalClaimReceiptsExact.agda
      - name: Typecheck governed cross-pollination
        run: nix develop .# --command agda -i . DASHI/Culture/PowersPlantationParadiseGovernedCrossPollinationExact.agda
      - name: Typecheck synthesis validation
        run: nix develop .# --command agda -i . DASHI/Culture/PowersPlantationParadiseValidation.agda
