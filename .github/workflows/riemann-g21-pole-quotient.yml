name: Riemann G21 pole-quotient exterior

on:
  pull_request:
    branches:
      - 'agent/zeta-reflection-orbit-defect-2026'
    paths:
      - 'DASHI/Analysis/PoleQuotientedExteriorDeskTestExact.agda'
      - 'DASHI/Analysis/PoleRankTwoQuotientedExteriorDeskTestExact.agda'
      - 'DASHI/Analysis/RiemannG21*.agda'
      - 'scripts/check_riemann_g21_pole_quotient.sh'
      - '.github/workflows/riemann-g21-pole-quotient.yml'
  workflow_dispatch:

concurrency:
  group: riemann-g21-pole-quotient-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check post-G20 G21 pole quotient tranche
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-agda-status"
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache"
          export AGDA_LOG_PATH="$RUNNER_TEMP/dashi-agda29-parallel-check.log"
          export DASHI_NO_TMUX=1
          bash scripts/check_riemann_g21_pole_quotient.sh
