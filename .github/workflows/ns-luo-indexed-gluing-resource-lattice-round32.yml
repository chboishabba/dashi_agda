name: NS Luo indexed gluing resource lattice round 32

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check round thirty-two
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-round32-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_ns_luo_indexed_gluing_resource_lattice_round32.sh
          ) > ns-round32-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 500 ns-round32-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round32-logs
          path: |
            ns-round32-check.log
            ns-round32-agda.log
          if-no-files-found: warn
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
