name: NS comparable localization and raw-curl Agda

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNComparableShellLocalizationRound203Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableResidualProducerBoundaryRound204Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableRawCurlPartnerMassRound205Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparablePartnerGramFrontierRound206Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableFixedOutputCarrierRound207Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableOutputL2CarrierRound208Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableOutputGramTelescopeRound209Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableOutputResidualPaymentRound211Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableFixedOutputTwoSidedCollarRound213Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableConstantBandGramNoGoRound214Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNThreeClassPositiveResidualCompilerRound215Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNRawCurlCellMassEnergyDissipationRound217Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalResonantEuclideanSquareTriangleRound218Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalRawCurlCellEDAdapterRound219Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNCoherentGramOnlyCompanionCompilerRound220Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNAuthoritativePackageAPathRound221Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCoherentGramResidualTargetRound222Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityQuadraticKernelRound223Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityFixedOutputSwapRound224Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityFixedOutputCollapseRound225Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityCompanionMassRound226Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityGlobalCompanionRound227Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicitySpacetimeFrontierRound228Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityViscousCovarianceNoGoRound229Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityForcingSwapRound230Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityDampedProductTangentRound231Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound228Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound228Validation.agda'
      - 'DASHI/Papers/NavierStokes/TheoremInterfaceRound228Exact.agda'
      - 'scripts/check_ns_triad_clay_frontier.py'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ns-triad-round203-comparable-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparable-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Reject frontier holes and postulates
        run: python3 scripts/check_ns_triad_clay_frontier.py

      - name: Type-check Round203 localization owner
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNComparableShellLocalizationRound203Exact.agda

      - name: Type-check Round209 outputwise Gram telescope
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNComparableOutputGramTelescopeRound209Exact.agda

      - name: Type-check Round215 positive three-class compiler
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNThreeClassPositiveResidualCompilerRound215Exact.agda

      - name: Type-check Round217 raw-cell ED compiler
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNRawCurlCellMassEnergyDissipationRound217Exact.agda

      - name: Type-check Round218 resonant square triangle
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNPhysicalResonantEuclideanSquareTriangleRound218Exact.agda

      - name: Type-check Round219 physical ED adapters
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNPhysicalRawCurlCellEDAdapterRound219Exact.agda

      - name: Type-check Round220 coherent-only compiler
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNCoherentGramOnlyCompanionCompilerRound220Exact.agda

      - name: Type-check Round221 authoritative path
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNAuthoritativePackageAPathRound221Exact.agda

      - name: Type-check Round223 mixed-helicity pair collapse
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityQuadraticKernelRound223Exact.agda

      - name: Type-check Round224 fixed-output swap reindexing
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityFixedOutputSwapRound224Exact.agda

      - name: Type-check Round225 fixed-output mixed-helicity collapse
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityFixedOutputCollapseRound225Exact.agda

      - name: Type-check Round226 mixed-helicity companion mass
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityCompanionMassRound226Exact.agda

      - name: Type-check Round227 global mixed-helicity companion
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityGlobalCompanionRound227Exact.agda

      - name: Type-check Round228 spacetime frontier
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicitySpacetimeFrontierRound228Exact.agda

      - name: Type-check Round229 viscous covariance no-go
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityViscousCovarianceNoGoRound229Exact.agda

      - name: Type-check Round230 mixed-helicity forcing swap
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityForcingSwapRound230Exact.agda

      - name: Type-check Round231 damped mixed-helicity tangent
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityDampedProductTangentRound231Exact.agda

      - name: Type-check Round228 frontier validation
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound228Validation.agda

      - name: Type-check Round228 paper interface
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Papers/NavierStokes/TheoremInterfaceRound228Exact.agda
