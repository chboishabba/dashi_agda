name: NS comparable localization and raw-curl Agda

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNComparableShellLocalizationRound203Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableResidualProducerBoundaryRound204Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparableRawCurlPartnerMassRound205Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNComparablePartnerGramFrontierRound206Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound203Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound203Validation.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound204Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound204Validation.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound205Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound205Validation.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound206Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNClayFrontierRound206Validation.agda'
      - 'DASHI/Papers/NavierStokes/TheoremInterfaceRound203Exact.agda'
      - 'DASHI/Papers/NavierStokes/TheoremInterfaceRound204Exact.agda'
      - 'DASHI/Papers/NavierStokes/TheoremInterfaceRound205Exact.agda'
      - 'DASHI/Papers/NavierStokes/TheoremInterfaceRound206Exact.agda'
      - 'scripts/check_ns_triad_clay_frontier.py'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ns-triad-round203-comparable-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparable-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Reject frontier holes and postulates
        run: python3 scripts/check_ns_triad_clay_frontier.py

      - name: Type-check Round203 localization owner
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNComparableShellLocalizationRound203Exact.agda

      - name: Type-check Round204 localized producer boundary
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound204Validation.agda

      - name: Type-check Round205 localized raw-curl partner owner
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNComparableRawCurlPartnerMassRound205Exact.agda

      - name: Type-check Round205 frontier validation
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound205Validation.agda

      - name: Type-check Round206 localized partner Gram owner
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNComparablePartnerGramFrontierRound206Exact.agda

      - name: Type-check Round206 frontier validation
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNClayFrontierRound206Validation.agda

      - name: Type-check Round206 paper interface
        run: >-
          nix develop .# --command
          bash scripts/run_agda29_parallel_check.sh
          DASHI/Papers/NavierStokes/TheoremInterfaceRound206Exact.agda
