name: Fanning literal-data contract Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Governance/SafeJustIndicatorSystemExact.agda'
      - 'DASHI/Governance/ProvisioningGeometryExact.agda'
      - 'DASHI/Governance/ONeill2018MethodsBoundaryExact.agda'
      - 'DASHI/Governance/Fanning2022ProjectionBoundaryExact.agda'
      - 'DASHI/Governance/Kallis2025ClaimByClaimEvidenceRealizationExact.agda'
      - 'DASHI/Governance/Kallis2025GDP15000UpstreamStudyBridgeExact.agda'
      - 'DASHI/Governance/Fanning2022SupplementaryDataAuthorityExact.agda'
      - 'DASHI/Governance/Fanning2022LiteralDataToFigureCommutationExact.agda'
      - 'DASHI/Governance/Fanning2022LiteralSituatedQualifiedUseBridgeExact.agda'
      - 'DASHI/Governance/Fanning2022LiteralSituatedQualifiedUseRegression.agda'
      - 'DASHI/Governance/Fanning2022DataRealizationExact.agda'
      - 'DASHI/Governance/Fanning2022NormalizationExact.agda'
      - 'DASHI/Governance/SafeJustSituatedClaimAuthorityBridgeExact.agda'
      - 'DASHI/Core/CompositionalComplianceExact.agda'
      - 'DASHI/Unified/FleetFormalGapTargetTOEExact.agda'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Unified/Everything.agda'
      - 'DASHI/Governance/Everything.agda'
      - '.github/workflows/fanning-literal-data-contract.yml'
  workflow_dispatch:

concurrency:
  group: fanning-literal-data-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Trust scan literal-data contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Governance/SafeJustIndicatorSystemExact.agda
            DASHI/Governance/ProvisioningGeometryExact.agda
            DASHI/Governance/ONeill2018MethodsBoundaryExact.agda
            DASHI/Governance/Fanning2022ProjectionBoundaryExact.agda
            DASHI/Governance/Kallis2025ClaimByClaimEvidenceRealizationExact.agda
            DASHI/Governance/Kallis2025GDP15000UpstreamStudyBridgeExact.agda
            DASHI/Governance/Fanning2022SupplementaryDataAuthorityExact.agda
            DASHI/Governance/Fanning2022LiteralDataToFigureCommutationExact.agda
            DASHI/Governance/Fanning2022LiteralSituatedQualifiedUseBridgeExact.agda
            DASHI/Governance/Fanning2022LiteralSituatedQualifiedUseRegression.agda
            DASHI/Core/CompositionalComplianceExact.agda
            DASHI/Unified/FleetFormalGapTargetTOEExact.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unifier.agda
          )
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|sorry|admit)\b' "${files[@]}"; then
            echo 'Forbidden trust-boundary token found in Fanning literal-data contract.' >&2
            exit 1
          fi
      - name: Check literal-data contracts with Agda 2.9
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
          export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export DASHI_NO_TMUX=1
          export AGDA_JOBS=2
          scripts/run_agda29_parallel_check.sh \
            DASHI/Governance/SafeJustIndicatorSystemExact.agda \
            DASHI/Governance/ProvisioningGeometryExact.agda \
            DASHI/Governance/ONeill2018MethodsBoundaryExact.agda \
            DASHI/Governance/Fanning2022ProjectionBoundaryExact.agda \
            DASHI/Governance/Kallis2025ClaimByClaimEvidenceRealizationExact.agda \
            DASHI/Governance/Kallis2025GDP15000UpstreamStudyBridgeExact.agda \
            DASHI/Governance/Fanning2022SupplementaryDataAuthorityExact.agda \
            DASHI/Governance/Fanning2022LiteralDataToFigureCommutationExact.agda \
            DASHI/Governance/Fanning2022LiteralSituatedQualifiedUseRegression.agda \
            DASHI/Unified/FleetFormalGapTargetTOEExact.agda \
            DASHI/EverythingTOESymmetryResolved369.agda \
            DASHI/Unifier.agda \
            DASHI/Unified/Everything.agda \
            DASHI/Governance/Everything.agda
