name: Frontier complete productive authority

on:
  push:
    branches: [master]
    paths:
      - 'DASHI/Mathematics/LinearAlgebra/RationalThreeWayHodgeCoordinateUniquenessFinalExact.agda'
      - 'DASHI/Mathematics/AlgebraicGeometry/ProjectiveSpaceHodgeBasisExact.agda'
      - 'DASHI/Mathematics/Complexity/GenericFiniteRunTableauExact.agda'
      - 'DASHI/Mathematics/Arithmetic/EllipticCurveFiniteTwoDescentSeedExact.agda'
      - 'DASHI/Moonshine/FiniteDifferentialVertexAlgebraExact.agda'
      - 'DASHI/Moonshine/SquareZeroDifferentialVertexAlgebraBridgeExact.agda'
      - 'DASHI/Moonshine/RankOneHeisenbergFockWindowExact.agda'
      - 'DASHI/Physics/Constructive/FiniteReflectionPositivityExact.agda'
      - 'DASHI/Physics/Constructive/FiniteProductClusteringDenominatorClearedExact.agda'
      - 'DASHI/Physics/Constructive/FinitePolymerKPBudgetExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsFiniteConstructiveLadderExact.agda'
      - 'DASHI/Mathematics/CrossPollination/FrontierCompleteProductiveAuthority*.agda'
      - 'DASHI/EverythingFrontierCompleteProductiveAuthority.agda'
      - 'scripts/check_frontier_complete_productive_authority.sh'
      - '.github/workflows/frontier-complete-productive-authority.yml'
  pull_request:
    branches:
      - 'agent/millennium-crosspollination-rh-hodge-bsd-pnp-poincare-voa'
    paths:
      - 'DASHI/Mathematics/LinearAlgebra/RationalThreeWayHodgeCoordinateUniquenessFinalExact.agda'
      - 'DASHI/Mathematics/AlgebraicGeometry/ProjectiveSpaceHodgeBasisExact.agda'
      - 'DASHI/Mathematics/Complexity/GenericFiniteRunTableauExact.agda'
      - 'DASHI/Mathematics/Arithmetic/EllipticCurveFiniteTwoDescentSeedExact.agda'
      - 'DASHI/Moonshine/FiniteDifferentialVertexAlgebraExact.agda'
      - 'DASHI/Moonshine/SquareZeroDifferentialVertexAlgebraBridgeExact.agda'
      - 'DASHI/Moonshine/RankOneHeisenbergFockWindowExact.agda'
      - 'DASHI/Physics/Constructive/FiniteReflectionPositivityExact.agda'
      - 'DASHI/Physics/Constructive/FiniteProductClusteringDenominatorClearedExact.agda'
      - 'DASHI/Physics/Constructive/FinitePolymerKPBudgetExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsFiniteConstructiveLadderExact.agda'
      - 'DASHI/Mathematics/CrossPollination/FrontierCompleteProductiveAuthority*.agda'
      - 'DASHI/EverythingFrontierCompleteProductiveAuthority.agda'
      - 'scripts/check_frontier_complete_productive_authority.sh'
      - '.github/workflows/frontier-complete-productive-authority.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check direct complete productive authority
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/frontier-authority-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_frontier_complete_productive_authority.sh
          ) > frontier-authority-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 1200 frontier-authority-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-authority-logs
          path: |
            frontier-authority-check.log
            frontier-authority-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='Complete productive authority Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='Complete productive authority Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='frontier-complete-productive-authority-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
