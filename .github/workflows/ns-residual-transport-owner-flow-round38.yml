name: NS Round38 residual transport owner flow

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKN*Round38Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNResidualTransportOwnerFlowRound38Validation.agda'
      - 'scripts/check_ns_residual_transport_owner_flow_round38.sh'
      - '.github/workflows/ns-residual-transport-owner-flow-round38.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  agda-round38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Round38 hard-math tranche
        run: bash scripts/check_ns_residual_transport_owner_flow_round38.sh
      - name: Upload checker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round38-checker-logs
          path: |
            .agda-check-logs
            *.log
          if-no-files-found: ignore
