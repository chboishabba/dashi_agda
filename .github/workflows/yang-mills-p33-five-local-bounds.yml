name: Yang-Mills P33 five local bounds

on:
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanP33*.agda'
      - 'scripts/check_yang_mills_p33_five_local_bounds.sh'
      - '.github/workflows/yang-mills-p33-five-local-bounds.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check concrete SU2, Wilson, CMP109, spectral and weighted P33 math
        run: nix develop --command bash scripts/check_yang_mills_p33_five_local_bounds.sh
