name: Material-effective negative-G source validation

on:
  pull_request:
    paths:
      - 'DASHI/Physics/ExoticGravity/**'
      - 'DASHI/Physics/GR/**'
      - 'scripts/check_material_effective_negative_g_source_validation.sh'
      - 'scripts/agda29_without_k_wrapper.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/material-effective-negative-g-source-validation.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check material-effective negative-G source validation
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/material-effective-negative-g-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_material_effective_negative_g_source_validation.sh
          ) > material-effective-negative-g-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 material-effective-negative-g-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-effective-negative-g-logs
          path: |
            material-effective-negative-g-check.log
            material-effective-negative-g-agda.log
          if-no-files-found: warn
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
