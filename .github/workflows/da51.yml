name: DA51

on:
  pull_request:
    paths:
      - 'DASHI/DA51/**'
      - 'DASHI/HME/Trace.agda'
      - 'fixtures/da51_v1.json'
      - '.github/workflows/da51.yml'
  workflow_dispatch:

jobs:
  agda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared fixture bytes
        run: echo 'cc67f109e5be3cfea89d7a8e0ba2b1b6279b5f012d751efbdb7e3a971e957106  fixtures/da51_v1.json' | sha256sum --check -
      - name: Install Agda and standard library
        run: |
          sudo apt-get update
          sudo apt-get install -y agda agda-stdlib
      - name: Check DA51 core
        run: agda -i . -i /usr/share/agda-stdlib DASHI/DA51/Core.agda
      - name: Check DA51 atlas codec and fixtures
        run: agda -i . -i /usr/share/agda-stdlib DASHI/DA51/Fixtures.agda
      - name: Check typed HME boundary
        run: agda -i . -i /usr/share/agda-stdlib DASHI/HME/Trace.agda
