name: Yang Mills highest alpha round 29 unified gates

on:
  pull_request:
    branches:
      - 'agent/ym-clay-alpha-round27-signed-wilson-finite-propagator'
    paths:
      - 'DASHI/Physics/Common/**'
      - 'DASHI/Physics/YangMills/**'
      - 'scripts/check_yang_mills_clay_highest_alpha_round29.sh'
      - '.github/workflows/yang-mills-clay-highest-alpha-round29.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check YM highest alpha round twenty nine
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ym-round29-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_yang_mills_clay_highest_alpha_round29.sh
          ) > ym-round29-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 400 ym-round29-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-round29-logs
          path: |
            ym-round29-check.log
            ym-round29-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='YM round 29 Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='YM round 29 Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='ym-round29-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
