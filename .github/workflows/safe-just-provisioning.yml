name: Safe-and-just provisioning Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Core/ContextualConversionNonfactorabilityExact.agda'
      - 'DASHI/Core/ThresholdResidualTrajectoryGeometryExact.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Governance/SafeJustSourceRegistryExact.agda'
      - 'DASHI/Governance/SafeJustIndicatorSystemExact.agda'
      - 'DASHI/Governance/PlanetaryBoundaryAllocationExact.agda'
      - 'DASHI/Governance/ProvisioningGeometryExact.agda'
      - 'DASHI/Governance/ONeill2018MethodsBoundaryExact.agda'
      - 'DASHI/Governance/Fanning2022TemporalIndicatorExact.agda'
      - 'DASHI/Governance/Fanning2022ProjectionBoundaryExact.agda'
      - 'DASHI/Governance/Everything.agda'
      - '.github/workflows/safe-just-provisioning.yml'
  workflow_dispatch:

concurrency:
  group: safe-just-provisioning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: safe-just-provisioning-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Trust scan safe-and-just provisioning tranche
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Core/ContextualConversionNonfactorabilityExact.agda
            DASHI/Core/ThresholdResidualTrajectoryGeometryExact.agda
            DASHI/Governance/SafeJustSourceRegistryExact.agda
            DASHI/Governance/SafeJustIndicatorSystemExact.agda
            DASHI/Governance/PlanetaryBoundaryAllocationExact.agda
            DASHI/Governance/ProvisioningGeometryExact.agda
            DASHI/Governance/ONeill2018MethodsBoundaryExact.agda
            DASHI/Governance/Fanning2022TemporalIndicatorExact.agda
            DASHI/Governance/Fanning2022ProjectionBoundaryExact.agda
          )
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|sorry|admit)\b' "${files[@]}"; then
            echo 'Forbidden trust-boundary token found in safe-and-just provisioning tranche.' >&2
            exit 1
          fi
      - name: Check focused tranche with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export DASHI_NO_TMUX=1
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-safe-just-provisioning-check.log"
            export AGDA_JOBS=2
            targets=(
              DASHI/Core/ContextualConversionNonfactorabilityExact.agda
              DASHI/Core/ThresholdResidualTrajectoryGeometryExact.agda
              DASHI/Governance/SafeJustIndicatorSystemExact.agda
              DASHI/Governance/PlanetaryBoundaryAllocationExact.agda
              DASHI/Governance/ProvisioningGeometryExact.agda
              DASHI/Governance/ONeill2018MethodsBoundaryExact.agda
              DASHI/Governance/Fanning2022TemporalIndicatorExact.agda
              DASHI/Governance/Fanning2022ProjectionBoundaryExact.agda
              DASHI/Governance/Everything.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-safe-just-provisioning-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 340 agda-safe-just-provisioning-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-just-provisioning-agda-log
          path: agda-safe-just-provisioning-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
