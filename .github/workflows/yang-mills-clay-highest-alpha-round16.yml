name: Yang-Mills Clay highest-alpha round 16

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@v27
      - name: Check inverse-dexp, SU2 geometry, Duhamel, RG and cutoff mathematics
        run: nix develop --command bash scripts/check_yang_mills_clay_highest_alpha_round16.sh
