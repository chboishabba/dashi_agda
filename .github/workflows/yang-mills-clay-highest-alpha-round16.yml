name: Yang-Mills Clay highest-alpha round 16

on:
  push:
    branches:
      - 'agent/ym-clay-alpha-round16-local-chart-engine'
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanP33BishopInverseDexpPositiveDenominatorExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33InverseDexpEndpointModulusExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33QuaternionChordalSquaredExact.agda'
      - 'DASHI/Physics/YangMills/BalabanClayHighestAlphaRound16Validation.agda'
      - 'scripts/check_yang_mills_clay_highest_alpha_round16.sh'
      - '.github/workflows/yang-mills-clay-highest-alpha-round16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@v27
      - name: Check positive denominator, endpoint modulus and SU2 chord invariance
        run: nix develop --command bash scripts/check_yang_mills_clay_highest_alpha_round16.sh
