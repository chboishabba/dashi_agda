name: JMD Monster branching information depth

on:
  workflow_dispatch:
  push:
    branches:
      - feature/j369-ogg-address-ssp15-no-go-20260925
    paths:
      - 'DASHI/Moonshine/Monster196883BabyBranchPrimeSupportExact.agda'
      - 'DASHI/Moonshine/MonsterBinaryTernaryInformationDepthExact.agda'
      - 'DASHI/Moonshine/JMDGF4096MonsterTwoLocalProvenanceExact.agda'
      - 'DASHI/Moonshine/JMDMonsterRepresentationCrossPollinationMaxCutExact.agda'
      - 'scripts/check_jmd_monster_branching_information_depth.sh'
      - '.github/workflows/jmd-monster-branching-information-depth.yml'
  pull_request:
    paths:
      - 'DASHI/Moonshine/Monster196883BabyBranchPrimeSupportExact.agda'
      - 'DASHI/Moonshine/MonsterBinaryTernaryInformationDepthExact.agda'
      - 'DASHI/Moonshine/JMDGF4096MonsterTwoLocalProvenanceExact.agda'
      - 'DASHI/Moonshine/JMDMonsterRepresentationCrossPollinationMaxCutExact.agda'
      - 'scripts/check_jmd_monster_branching_information_depth.sh'
      - '.github/workflows/jmd-monster-branching-information-depth.yml'

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check JMD Monster branching and information depth
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_jmd_monster_branching_information_depth.sh
