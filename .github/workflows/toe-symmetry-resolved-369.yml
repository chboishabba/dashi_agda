          dashi-repo diagnose DASHI/EverythingTOESymmetryResolved369.agda --root .
          dashi-repo diagnose DASHI/Unifier.agda --root .
          dashi-repo diagnose DASHI/Mathematics/CrossPollination/MillenniumLeanAssistReceiptExact.agda --root .
          dashi-repo diagnose DASHI/Mathematics/CrossPollination/MillenniumResidualDescentClassifierExact.agda --root .
          dashi-repo diagnose DASHI/Mathematics/CrossPollination/MillenniumThreeLaneContinuationValidation.agda --root .
