name: toe-symmetry-resolved-369

on:
  workflow_dispatch:
  push:
    paths:
      - 'DASHI/Core/SymmetryResolvedFibreExact.agda'
      - 'DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Unified/Everything.agda'
      - 'DASHI/Unified/GovernedLegalWorkflowTOEBridgeRegression.agda'
      - 'DASHI/Unified/GovernedLegalWorkflowTOEBridgeExact.agda'
      - 'DASHI/Interop/SLRReviewPromoteAbstainConsumerExact.agda'
      - 'DASHI/Interop/SLRRuntimeValidationHandoffExact.agda'
      - 'DASHI/Interop/SLRValidationRoadmapPromotionExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawLegalSemanticAdmissionFrontierExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSemanticExpansionSoftwareValidationExact.agda'
      - 'DASHI/Governance/FormalisationGovernanceCapstoneExact.agda'
      - 'DASHI/Core/KernelSemanticClosureBoundaryExact.agda'
      - 'DASHI/Physics/Closure/Everything.agda'
      - 'tests/test_governed_legal_workflow_toe_convergence.py'
      - '.github/workflows/toe-symmetry-resolved-369.yml'

  pull_request:
    paths:
      - 'DASHI/Core/SymmetryResolvedFibreExact.agda'
      - 'DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Unified/Everything.agda'
      - 'DASHI/Unified/GovernedLegalWorkflowTOEBridgeRegression.agda'
      - 'DASHI/Unified/GovernedLegalWorkflowTOEBridgeExact.agda'
      - 'DASHI/Interop/SLRReviewPromoteAbstainConsumerExact.agda'
      - 'DASHI/Interop/SLRRuntimeValidationHandoffExact.agda'
      - 'DASHI/Interop/SLRValidationRoadmapPromotionExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawLegalSemanticAdmissionFrontierExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSemanticExpansionSoftwareValidationExact.agda'
      - 'DASHI/Governance/FormalisationGovernanceCapstoneExact.agda'
      - 'DASHI/Core/KernelSemanticClosureBoundaryExact.agda'
      - 'DASHI/Physics/Closure/Everything.agda'
      - 'tests/test_governed_legal_workflow_toe_convergence.py'
      - '.github/workflows/toe-symmetry-resolved-369.yml'

concurrency:
  group: toe-symmetry-resolved-369-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Agda and standard library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.3'
          agda-stdlib-version: '2.1'

      - name: Install DASHI repository intelligence
        run: python -m pip install -e tools/agda_preflight

      - name: Search related symbols and lineage
        run: |
          dashi-repo index --root .
          dashi-repo related canonicalGovernedLegalWorkflowTOEBoundary --root .
          dashi-repo related canonicalGovernedLegalWorkflowTOEInvariantHandoff --root .
          dashi-repo related canonicalGovernedLegalWorkflowZKPReceipt --root .
          dashi-repo related canonicalGovernedLegalWorkflowIntrospectiveZKPFrame --root .
          dashi-repo related toeCaseySelectionDoesNotCreateWorldTruth --root .
          dashi-repo related toeKnowledgeDoesNotCreateExecutionAuthority --root .
          dashi-repo related canonicalGovernedLegalWorkflowPromotionBoundary --root .
          dashi-repo related toeReviewEligibilityDoesNotCreatePromotion --root .
          dashi-repo related toeRuntimeParityDoesNotCreateWorldTruth --root .
          dashi-repo related toeParserCandidateDoesNotAuthorizeAdmission --root .
          dashi-repo related toeSoftwareValidationDoesNotAuthorizePublication --root .
          dashi-repo discover 'SensibLaw governance legal workflow non promotion TOE' --root .
          dashi-repo discover 'canonical governance invariant handoff same object TOE Unifier' --root .
          dashi-repo discover 'IntrospectiveProofLoop ZKPFrame governed legal workflow TOE Unified Everything' --root .
          dashi-repo discover 'Actionstep matter workflow review admission legal applicability' --root .
          dashi-repo discover 'review eligibility promotion runtime validation claim truth admission authority software publication' --root .
          dashi-repo lineage --prefix DASHI.Cognition.PNF.SensibLaw --root .
          dashi-repo lineage --prefix DASHI.Unified.GovernedLegalWorkflowTOE --root .
          dashi-repo lineage --prefix DASHI.Interop.ITIRFederatedTypedWorldProjection --root .
          dashi-repo lineage --prefix DASHI.Interop.SLRReviewPromoteAbstainConsumer --root .
          dashi-repo lineage --prefix DASHI.Interop.SLRValidationRoadmapPromotion --root .
          dashi-repo lineage --prefix DASHI.Cognition.PNF.SensibLawLegalSemanticAdmissionFrontier --root .

      - name: Run deterministic static contract
        run: python -m pytest -q tests/test_governed_legal_workflow_toe_convergence.py

      - name: Run structural preflight
        run: |
          dashi-agda-preflight --root . --closure --agda-auto-refine=typecheck \
            --agda-extra-args='-i . -l standard-library' \
            DASHI/Unified/GovernedLegalWorkflowTOEBridgeExact.agda
          dashi-agda-preflight --root . --agda-auto-refine=typecheck \
            --agda-extra-args='-i . -l standard-library' \
            DASHI/Unified/GovernedLegalWorkflowTOEBridgeRegression.agda
          dashi-agda-preflight --root . --agda-auto-refine=typecheck \
            --agda-extra-args='-i . -l standard-library' \
            DASHI/EverythingTOESymmetryResolved369.agda
          dashi-agda-preflight --root . --agda-auto-refine=typecheck \
            --agda-extra-args='-i . -l standard-library' \
            DASHI/Unified/Everything.agda
          dashi-agda-preflight --root . --agda-auto-refine=typecheck \
            --agda-extra-args='-i . -l standard-library' \
            DASHI/Unifier.agda

      - name: Reject trust escapes
        run: |
          sources=(
            DASHI/Core/SymmetryResolvedFibreExact.agda
            DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda
            DASHI/Unified/GovernedLegalWorkflowTOEBridgeExact.agda
            DASHI/Unified/GovernedLegalWorkflowTOEBridgeRegression.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unifier.agda
          )
          for source in "${sources[@]}"; do
            if grep -nE '(^|[[:space:]])postulate([[:space:]]|$)|allow-unsolved-metas|TERMINATING|NO_POSITIVITY_CHECK' "$source"; then
              echo "forbidden trust escape in $source" >&2
              exit 1
            fi
          done
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -Ei '(^|/)(dashi_digital_esd|[^/]*digital_esd[^/]*|[^/]*ESD[^/]*)'; then
            echo "ESD surface changed" >&2
            exit 1
          fi

      - name: Kernel-check TOE symmetry-resolved aggregate
        run: |
          agda --version
          agda -i . -l standard-library DASHI/Unified/GovernedLegalWorkflowTOEBridgeExact.agda
          agda -i . -l standard-library DASHI/Unified/GovernedLegalWorkflowTOEBridgeRegression.agda
          agda -i . -l standard-library DASHI/EverythingTOESymmetryResolved369.agda
          agda -i . -l standard-library DASHI/Unified/Everything.agda
          agda -i . -l standard-library DASHI/Unifier.agda
