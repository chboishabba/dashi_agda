            DASHI/Physics/Dynamics/YanchukStableManifoldCrossingTargetExact.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unifier.agda
            DASHI/Unified/Everything.agda
          )
          for file in "${files[@]}"; do
            dashi-agda-preflight --root . "$file"
          done

      - name: Install Agda and standard library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.3'
          agda-stdlib-version: '2.1'

      - name: Install DASHI Agda preflight
        run: python -m pip install -e tools/agda_preflight

      - name: Run DASHI Agda preflight
        run: |
          sources=(
            DASHI/Core/SymmetryResolvedFibreExact.agda
            DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda
            DASHI/Unified/BalabanRGTOERegression.agda
            DASHI/Unified/YMGoal1TOECompatibilityExact.agda
            DASHI/Unified/YMGoal1TOECompatibilityValidation.agda
            DASHI/Unified/BalabanRGTOEMaxCutValidation.agda
            DASHI/Unified/BalabanR559TOEMaxCutExact.agda
            DASHI/Unified/BalabanR559TOEMaxCutValidation.agda
            DASHI/Unified/BalabanR559TOEUnifiedEverythingValidation.agda
            DASHI/Unified/YMImplementAToDTOEMaxCutExact.agda
            DASHI/Unified/YMImplementAToDTOEMaxCutValidation.agda
            DASHI/Physics/YangMills/BalabanClayGate4PhysicalClosureRound6ExactCutset.agda
            DASHI/Physics/YangMills/BalabanClayGate4PhysicalClosureRound6Ledger.agda
            DASHI/Physics/YangMills/YangMillsSubmissionObligationCardinalityExact.agda
            DASHI/Physics/Closure/BalabanRGScaleTransferFrontierReceipt.agda
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Exact.agda
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda
            DASHI/Unified/Physics.agda
            DASHI/Unifier.agda
          )
          for module in "${modules[@]}"; do
            dashi-agda-preflight --root . "$module"
          done


      - name: Run repository discovery referee
        run: |
          dashi-repo index --root .
          dashi-repo status --root .
          dashi-repo discover "Balaban Goal1 RG scale density regular-E Casimir stress continuum non-promotion" --root . --limit 30
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayIrreducibleSourceFamiliesRound546Exact.familyLevel --root . --limit 20
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayIrreducibleSourceFamiliesRound546Exact.round546IrreducibleSourceFamilyCutCompilerLevel --root . --limit 20
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayCriticalPathRound558Exact.criticalLevel --root . --limit 20
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayCriticalPathRound558Exact.round558CriticalPathCompilerLevel --root . --limit 20
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayGoal1 --root .

          symbols=(
            DASHI.Physics.YangMills.Balaban1989BetaDrivenCompleteDensityFlowExact.sourceCouplingIsBetaHistoryCoupling
            DASHI.Physics.YangMills.BalabanCMP119RegularELocalizationSourceRound244Exact.selectedRegularEIsLocalizedCompositeSum
