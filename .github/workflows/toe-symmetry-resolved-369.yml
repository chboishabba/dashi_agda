      - 'DASHI/Physics/YangMills/YangMillsCMP119PeterWeylWilsonSquareRound444Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayGoal1MaximumCutRound485Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayIrreducibleSourceFamiliesRound546Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayCriticalPathRound558Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda'
      - 'Docs/diagrams/ym_toe_r559_current_master_convergence.puml'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Geo/EarthEmbedding*.agda'
      - 'DASHI/Unified/**'
      - 'DASHI/Unified/FleetFormalGapTargetTOEExact.agda'
      - 'DASHI/Unified/FleetFormalGapTargetTOEValidation.agda'
      - 'DASHI/Unified/BalabanRGTOEMaxCutValidation.agda'
      - 'DASHI/Unifier.agda'
      - '.github/workflows/toe-symmetry-resolved-369.yml'
  push:
    paths:
      - 'DASHI/Core/SymmetryResolvedFibreExact.agda'
      - 'DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPeriodicTwoInequalityMaxCutRound650Exact.agda'
      - 'DASHI/Unified/Physics.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unified/ResidualWidthNonPromotionTOEExact.agda'
      - 'DASHI/Unified/ResidualWidthNonPromotionTOERegression.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Physics/Closure/Everything.agda'
      - '.github/workflows/toe-symmetry-resolved-369.yml'

concurrency:
  group: toe-symmetry-resolved-369-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DASHI repository referee
        run: python -m pip install -e './tools/agda_preflight[test,mcp]'

      - name: Referee TOE reuse and lineage
        run: |
          dashi-repo index --root .
          dashi-repo diagnose DASHI/Unified/BalabanRGTOERegression.agda --root .
          dashi-repo diagnose DASHI/Unified/YMGoal1TOECompatibilityExact.agda --root .
          dashi-repo diagnose DASHI/Unified/YMGoal1TOECompatibilityValidation.agda --root .
          dashi-repo diagnose DASHI/Unified/Physics.agda --root .
          dashi-repo diagnose DASHI/Unified/NavierStokesClayFrontierTOEConvergenceExact.agda --root .
          dashi-repo diagnose DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingDefectR44020261007Exact.agda --root .
          dashi-repo diagnose DASHI/Unified/NavierStokesClayFrontierTOEConvergenceValidation.agda --root .
          dashi-repo related b4ResearchLeafNowOnlyPhysicalR440Payment --root . --limit 20
          dashi-repo related historicalNestedInnerPureCommutatorExposed --root . --limit 20
          dashi-repo discover 'Navier Stokes current physical R440 noncore core payment historical signed external commutator non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Physics.Closure.NSTriadKNR650 --root .
          dashi-repo lineage --prefix DASHI.Physics.Closure.NSTriadKNExternal --root .
          dashi-repo related literalRound440VariableDomainCMP116SourceLevel --root . --limit 20
          dashi-repo related literalRound443FiniteWilsonActionInvarianceLevel --root . --limit 20
          dashi-repo related literalRound444PeterWeylWilsonIdentificationLevel --root . --limit 20
          dashi-repo discover 'Yang Mills Goal1 TOE variable domain Peter Weyl compactness stress non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayGoal1 --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.BalabanCMP116 --root .
          dashi-repo diagnose DASHI/EverythingTOESymmetryResolved369.agda --root .
          dashi-repo diagnose DASHI/Unifier.agda --root .
          dashi-repo diagnose DASHI/Unified/FleetFormalGapTargetTOEExact.agda --root .
          dashi-repo diagnose DASHI/Unified/FleetFormalGapTargetTOEValidation.agda --root .
          dashi-repo related fleetFormalGapOrdinalCount --root . --limit 20
          dashi-repo related fleetSharedCardinalityDoesNotCreateIdentity --root . --limit 20
          dashi-repo discover 'Fleet 58 formal gap target ordinal non-promotion spectral identity firewall' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Unified.Fleet --root .
          dashi-repo related BalabanRGTOEReceipt --root .
          dashi-repo related BalabanScaleTransferPromotion --root . --limit 20
          dashi-repo related balabanScaleTransferPromotionImpossible --root . --limit 20
          dashi-repo related fleetRecordedUnformalisedGapCountIs58 --root . --limit 20
          dashi-repo discover 'Balaban scale transfer promotion continuum non-promotion Fleet 58 canonical owner' --root . --limit 40
          dashi-repo related balabanStressCauchyModulusCompilerLevel --root . --limit 20
          dashi-repo related balabanSameFamilyRecoveryCompilerLevel --root . --limit 20
          dashi-repo related balabanGoal1CSourceCutCompilerLevel --root . --limit 20
          dashi-repo related r129ExportsLiteralSchwingerMembership --root . --limit 20
          dashi-repo related balabanStressHilbertBoundCompilerLevel --root . --limit 20
          dashi-repo related balabanGeneratedActionStressScaleCompilerLevel --root . --limit 20
          dashi-repo related balabanPublishedRGPhysicalSameObjectLevel --root . --limit 20
          dashi-repo related balabanContinuumRouteMassGapPromotionStillOpen --root . --limit 20
          dashi-repo related balabanScaleDensityFiniteMeasureWeldLevel --root . --limit 20
          dashi-repo related balabanRegularELocalizationCarrierLevel --root . --limit 20
          dashi-repo related balabanCasimirLowerBoundTransportLevel --root . --limit 20
          dashi-repo related balabanDensityAnchoredStressLaneCompilerLevel --root . --limit 20
          dashi-repo discover 'Balaban scale density regular-E localization Casimir stress Cauchy telescope Schwinger same-family RG continuum non-promotion' --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.Balaban --root .
          dashi-repo related canonicalEarthEmbeddingTOEReceipt --root . --limit 20
          dashi-repo related learnedCoordinateDoesNotCreatePhysicalIdentity --root . --limit 20
          dashi-repo related gradientDoesNotCreateCausalEnvironmentalEffect --root . --limit 20
          dashi-repo discover 'Earth embedding TESSERA AlphaEarth learned coordinates gradients physical interpretation Woogaroo non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Geo.EarthEmbedding --root .
          dashi-repo diagnose DASHI/Geo/EarthEmbeddingAcquisitionExact.agda --root .
          dashi-repo diagnose DASHI/Unified/BalabanRGTOEMaxCutValidation.agda --root .
          dashi-repo diagnose DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Exact.agda --root .
          dashi-repo diagnose DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda --root .
          dashi-repo related round485MaximumCutCompilerLevel --root . --limit 20
          dashi-repo related round546IrreducibleSourceFamilyCutCompilerLevel --root . --limit 20
          dashi-repo related round558CriticalPathCompilerLevel --root . --limit 20
          dashi-repo related toeCriticalFullCLayerRetainedForConservativeClayExistence --root . --limit 20
          dashi-repo related toeGoal1MaximumCutCompilerLevel --root . --limit 20
          dashi-repo discover 'Yang Mills Goal1 R485 R546 R558 maximum cut irreducible critical path R559 TOE' --root . --limit 50
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayGoal1 --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayIrreducibleSourceFamilies --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayCriticalPath --root .
          dashi-repo diagnose DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda --root .
          dashi-repo diagnose DASHI/ComputerScience/TriadicFin27Byte256ABIExact.agda --root .
          dashi-repo diagnose DASHI/ComputerScience/TriadicU8RuntimeOracleCrossRepoExact.agda --root .
          dashi-repo diagnose DASHI/ComputerScience/TriadicCompiledScalarU8RuntimeExact.agda --root .
          dashi-repo related stateDecode-stateCode --root . --limit 20
          dashi-repo related compilerSuccessDoesNotCreateKernelSuccess --root . --limit 20
          dashi-repo diagnose DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda --root .
          dashi-repo related toe27RotationOrderThree --root . --limit 20
          dashi-repo related toe27OriginFixed --root . --limit 20
          dashi-repo related toe27MonsterPhaseConjugationIntertwiner --root . --limit 20
          dashi-repo related toe27MonsterRepresentationNotPromoted --root . --limit 20
          dashi-repo related toe27MonsterEmbeddingNotPromoted --root . --limit 20
          dashi-repo related toeKernelCharacterIsotypyDoesNotConstructActionIntertwiner --root . --limit 20
          dashi-repo discover '369 max cut kernel bidi ternary 27 Monster representation embedding non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Reasoning.Trialectic369Selected3B --root .
          dashi-repo lineage --prefix DASHI.Moonshine.Base369Ternary27 --root .
          dashi-repo diagnose DASHI/Unified/FleetFormalGapTargetTOEExact.agda --root .
          dashi-repo diagnose DASHI/Unified/FleetFormalGapTargetTOEValidation.agda --root .
          dashi-repo diagnose DASHI/Unified/Fleet58ManifestAcquisitionExact.agda --root .
          dashi-repo related named58ManifestAcquired --root . --limit 20
          dashi-repo related perGapDispatchEnabled --root . --limit 20
          dashi-repo related countIdentifiesNamedRows --root . --limit 20
          dashi-repo discover 'Fleet 58 named manifest acquisition per-gap dispatch boundary' --root . --limit 40
          dashi-repo related fleetCoordinateRebuildabilityReceipt --root . --limit 20
          dashi-repo related fleetNumericABIReceipt --root . --limit 20
          dashi-repo related fleetResidualInvariantReceipt --root . --limit 20
          dashi-repo related fleetPromotionObligationIndex --root . --limit 20
          dashi-repo related fleetVectorCoordinateDoesNotCreateTruth --root . --limit 20
          dashi-repo related fleetExternalCountDoesNotCreateFormalDischarge --root . --limit 20
          dashi-repo discover 'fleet 584 discharged 58 unformalised formal gaps eigen priority non-promotion' --root . --limit 40

      - name: Reject ESD surface changes
        shell: bash
        run: |
          git fetch origin master --depth=1
          changed="$(git diff --name-only origin/master...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)([^/]*digital_esd[^/]*|[^/]*ESD[^/]*)($|/)' ; then
            echo "ESD surface change detected" >&2
            exit 1
          fi

      - name: Fast Agda preflight on converged TOE graph
        run: |
          files=(
            DASHI/Unified/Fleet58ManifestAcquisitionExact.agda
            DASHI/ComputerScience/TriadicFin27Byte256ABIExact.agda
            DASHI/ComputerScience/TriadicU8RuntimeOracleCrossRepoExact.agda
            DASHI/ComputerScience/TriadicCompiledScalarU8RuntimeExact.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda
            DASHI/Unified/FleetFormalGapTargetTOEExact.agda
            DASHI/Unified/FleetFormalGapTargetTOEValidation.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unifier.agda
            DASHI/Unified/Everything.agda
          )
          for file in "${files[@]}"; do
            dashi-agda-preflight --root . "$file"
          done

      - name: Install Agda and standard library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.3'
          agda-stdlib-version: '2.1'

      - name: Install DASHI Agda preflight
        run: python -m pip install -e tools/agda_preflight

      - name: Run DASHI Agda preflight
        run: |
          modules=(
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Exact.agda
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda
            DASHI/Physics/Foundations/CMP119AntigravityCanonicalS4PhysicalMinCutExact.agda
            DASHI/Physics/Foundations/CMP119AntigravityP3GPhysicalProducerMinCutExact.agda
            DASHI/Unified/Physics.agda
            DASHI/Unified/YMBlockDMaxCutTOEExact.agda
            DASHI/Unified/YMBlockDMaxCutTOEValidation.agda
            DASHI/Unified/Everything.agda
            DASHI/Unifier.agda
            DASHI/Physics/YangMills/BalabanCMP119RegularEReflectionSupportCutExact.agda
            DASHI/Physics/YangMills/BalabanCMP119LiteralResidualWeldMaxCut20261002Exact.agda
            DASHI/Unified/YMCMP119ResidualWeldTOEExact.agda
          )
          for module in "${modules[@]}"; do
            dashi-agda-preflight --root . "$module"
          done

      - name: Reject trust escapes
        run: |
          sources=(
            DASHI/Unified/Fleet58ManifestAcquisitionExact.agda
            DASHI/Core/SymmetryResolvedFibreExact.agda
            DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda
            DASHI/Unified/Physics.agda
            DASHI/Unifier.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unified/ResidualWidthNonPromotionTOEExact.agda
            DASHI/Unified/ResidualWidthNonPromotionTOERegression.agda
            DASHI/Unifier.agda
          )
          for source in "${sources[@]}"; do
            if grep -nE '(^|[[:space:]])postulate([[:space:]]|$)|allow-unsolved-metas|NON_TERMINATING|TERMINATING|NO_POSITIVITY_CHECK' "$source"; then
              echo "forbidden trust escape in $source" >&2
              exit 1
            fi
          done

      - name: Install semantic preflight
        run: python -m pip install -e tools/agda_preflight

      - name: Semantic preflight normalized NS TOE surfaces
        run: |
          dashi-agda-preflight --root . DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda
          dashi-agda-preflight --root . DASHI/Unified/Physics.agda
          dashi-agda-preflight --root . DASHI/Unifier.agda
          dashi-agda-preflight --root . DASHI/EverythingTOESymmetryResolved369.agda

      - name: Kernel-check TOE symmetry-resolved aggregate
        run: |
          agda --version
          agda -i . -l standard-library DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda
          agda -i . -l standard-library DASHI/Unified/Physics.agda
          agda -i . -l standard-library DASHI/Unifier.agda
          agda -i . -l standard-library DASHI/EverythingTOESymmetryResolved369.agda
