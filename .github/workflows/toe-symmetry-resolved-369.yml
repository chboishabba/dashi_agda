name: toe-symmetry-resolved-369

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'DASHI/Core/SymmetryResolvedFibreExact.agda'
      - 'DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda'
      - 'DASHI/Physics/Dynamics/SingularBasin*.agda'
      - 'DASHI/Physics/Dynamics/BasinResolutionRobustnessExact.agda'
      - 'DASHI/Physics/Dynamics/BasinSeparatingStableManifoldExact.agda'
      - 'DASHI/Physics/Dynamics/YanchukStableManifoldCrossingTargetExact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116CanonicalSelectedBSourceRound435Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayPinnedCMP119CanonicalASourceRound436Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayGoal1CanonicalCSourceRound437Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116CanonicalLiteralRateSourceRound438Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayGoal1SameHNontrivialityRound439Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116VariableDomainPreferredR415Round440Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116R429RootedTraceCountingRound441Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116R429TraceEntropyBudgetRound442Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsCMP119WilsonGibbsHaarActionRound443Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsCMP119PeterWeylWilsonSquareRound444Exact.agda'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unified/**'
      - 'DASHI/Unified/BalabanRGTOEMaxCutValidation.agda'
      - 'DASHI/Unified/BalabanIbrahimParetoSnowballTOEValidation.agda'
      - 'DASHI/Unified/BalabanIbrahimParetoSnowballTOEExact.agda'
      - 'DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda'
      - 'DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda'
      - 'DASHI/Unified/SingularBasinCoarseRGTOEExact.agda'
      - 'DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda'
      - 'DASHI/Unifier.agda'
      - '.github/workflows/toe-symmetry-resolved-369.yml'
  push:
    paths:
      - 'DASHI/Core/SymmetryResolvedFibreExact.agda'
      - 'DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda'
      - 'DASHI/EverythingTOESymmetryResolved369.agda'
      - 'DASHI/Unified/BalabanRGTOERegression.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116CanonicalSelectedBSourceRound435Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayPinnedCMP119CanonicalASourceRound436Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayGoal1CanonicalCSourceRound437Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116CanonicalLiteralRateSourceRound438Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayGoal1SameHNontrivialityRound439Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116VariableDomainPreferredR415Round440Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116R429RootedTraceCountingRound441Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP116R429TraceEntropyBudgetRound442Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsCMP119WilsonGibbsHaarActionRound443Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsCMP119PeterWeylWilsonSquareRound444Exact.agda'
      - 'DASHI/Unified/YMGoal1TOECompatibilityExact.agda'
      - 'DASHI/Unified/YMGoal1TOECompatibilityValidation.agda'
      - 'DASHI/Unified/BalabanRGTOEMaxCutValidation.agda'
      - 'DASHI/Unified/Physics.agda'
      - 'DASHI/Unified/Everything.agda'
      - 'DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda'
      - 'DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda'
      - 'DASHI/Unified/SingularBasinCoarseRGTOEExact.agda'
      - 'DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda'
      - 'DASHI/Unifier.agda'
      - 'DASHI/Physics/Closure/Everything.agda'
      - '.github/workflows/toe-symmetry-resolved-369.yml'

concurrency:
  group: toe-symmetry-resolved-369-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DASHI repository referee
        run: python -m pip install -e './tools/agda_preflight[test,mcp]'

      - name: Referee TOE reuse and lineage
        run: |
          dashi-repo index --root .
          dashi-repo diagnose DASHI/Unified/BalabanRGTOERegression.agda --root .
          dashi-repo diagnose DASHI/Unified/YMGoal1TOECompatibilityExact.agda --root .
          dashi-repo diagnose DASHI/Unified/YMGoal1TOECompatibilityValidation.agda --root .
          dashi-repo diagnose DASHI/Unified/Physics.agda --root .
          dashi-repo related literalRound440VariableDomainCMP116SourceLevel --root . --limit 20
          dashi-repo related literalRound443FiniteWilsonActionInvarianceLevel --root . --limit 20
          dashi-repo related literalRound444PeterWeylWilsonIdentificationLevel --root . --limit 20
          dashi-repo discover 'Yang Mills Goal1 TOE variable domain Peter Weyl compactness stress non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayGoal1 --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.BalabanCMP116 --root .
          dashi-repo diagnose DASHI/EverythingTOESymmetryResolved369.agda --root .
          dashi-repo diagnose DASHI/Unifier.agda --root .
          dashi-repo related BalabanRGTOEReceipt --root .
          dashi-repo related balabanStressCauchyModulusCompilerLevel --root . --limit 20
          dashi-repo related balabanStressHilbertBoundCompilerLevel --root . --limit 20
          dashi-repo related balabanGeneratedActionStressScaleCompilerLevel --root . --limit 20
          dashi-repo related balabanPublishedRGPhysicalSameObjectLevel --root . --limit 20
          dashi-repo related balabanContinuumRouteMassGapPromotionStillOpen --root . --limit 20
          dashi-repo related balabanScaleDensityFiniteMeasureWeldLevel --root . --limit 20
          dashi-repo related balabanRegularELocalizationCarrierLevel --root . --limit 20
          dashi-repo related balabanCasimirLowerBoundTransportLevel --root . --limit 20
          dashi-repo related balabanDensityAnchoredStressLaneCompilerLevel --root . --limit 20
          dashi-repo discover 'Balaban scale density regular-E localization Casimir stress RG continuum non-promotion' --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.Balaban --root .
          dashi-repo diagnose DASHI/Unified/BalabanRGTOEMaxCutValidation.agda --root .
          dashi-repo diagnose DASHI/Unified/BalabanIbrahimParetoSnowballTOEExact.agda --root .
          dashi-repo diagnose DASHI/Unified/BalabanIbrahimParetoSnowballTOEValidation.agda --root .
          dashi-repo diagnose DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda --root .
          dashi-repo diagnose DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda --root .
          dashi-repo diagnose DASHI/Unified/SingularBasinCoarseRGTOEExact.agda --root .
          dashi-repo diagnose DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda --root .
          dashi-repo related finiteReductionNotBasinPreserving --root . --limit 20
          dashi-repo related selectedProjectionNotResolutionAdequate --root . --limit 20
          dashi-repo discover 'singular basin coarse RG projection basin preservation resolution robustness non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Physics.Dynamics.SingularBasin --root .
          dashi-repo related monsterAxisReflectionIntertwines --root . --limit 20
          dashi-repo related dimensionDoesNotCreateFaithfulness --root . --limit 20
          dashi-repo related dimensionDoesNotCreateProjectedAction --root . --limit 20
          dashi-repo related canonicalActual3BKernelSameElementBoundary --root . --limit 20
          dashi-repo related phasePreservingReductionEqualsFullGlobalInversionIsFalse --root . --limit 20
          dashi-repo discover 'ternary 27 selected 3B max cut kernel BIDI phase intertwiner non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Moonshine.Base369Ternary27 --root .
          dashi-repo lineage --prefix DASHI.Reasoning.Trialectic369Selected3B --root .
          dashi-repo related balabanRGScaleTransferPromotionImpossibleHere --root . --limit 20
          dashi-repo related canonicalRecognitionRouteParetoBoundary --root . --limit 20
          dashi-repo related currentMonster3BCharacterExecutionFrontier --root . --limit 20
          dashi-repo related canonicalTrialectic369SchrodingerHZetaRecognitionMaxCutBoundary --root . --limit 20
          dashi-repo discover 'Balaban RG scale transfer non-promotion Ibrahim Pareto snowball Monster 3B H-zeta recognition' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Wikimedia.IbrahimMonster3B --root .

      - name: Reject ESD surface changes
      - name: Fast Agda preflight on connected TOE graph
        run: |
          files=(
            DASHI/Unified/BalabanRGTOERegression.agda
            DASHI/Unified/BalabanRGTOEMaxCutValidation.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEExact.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEValidation.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda
            DASHI/Unified/SingularBasinCoarseRGTOEExact.agda
            DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda
            DASHI/Physics/Dynamics/SingularBasinReductionExact.agda
            DASHI/Physics/Dynamics/SingularBasinFiniteWitnessExact.agda
            DASHI/Physics/Dynamics/BasinResolutionRobustnessExact.agda
            DASHI/Physics/Dynamics/SingularBasinResolutionWitnessExact.agda
            DASHI/Physics/Dynamics/YanchukStableManifoldCrossingTargetExact.agda
            DASHI/Unified/SingularBasinCoarseRGTOEExact.agda
            DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unifier.agda
          )
          for file in "${files[@]}"; do
            dashi-agda-preflight --root . "$file"
          done

        shell: bash
        run: |
          git fetch origin master --depth=1
          changed="$(git diff --name-only origin/master...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)([^/]*digital_esd[^/]*|[^/]*ESD[^/]*)($|/)' ; then
            echo "ESD surface change detected" >&2
            exit 1
          fi

      - name: Install Agda and standard library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.3'
          agda-stdlib-version: '2.1'

      - name: Reject trust escapes
        run: |
          sources=(
            DASHI/Core/SymmetryResolvedFibreExact.agda
            DASHI/Physics/Closure/TOESymmetryResolved369BridgeExact.agda
            DASHI/Unified/BalabanRGTOERegression.agda
            DASHI/Unified/YMGoal1TOECompatibilityExact.agda
            DASHI/Unified/YMGoal1TOECompatibilityValidation.agda
            DASHI/Unified/BalabanRGTOEMaxCutValidation.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEExact.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEValidation.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda
            DASHI/Unified/SingularBasinCoarseRGTOEExact.agda
            DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda
            DASHI/Physics/Dynamics/SingularBasinReductionExact.agda
            DASHI/Physics/Dynamics/SingularBasinFiniteWitnessExact.agda
            DASHI/Physics/Dynamics/BasinResolutionRobustnessExact.agda
            DASHI/Physics/Dynamics/SingularBasinResolutionWitnessExact.agda
            DASHI/Physics/Dynamics/SingularBasinValidatedNumericsArtifactExact.agda
            DASHI/Physics/Dynamics/BasinSeparatingStableManifoldExact.agda
            DASHI/Physics/Dynamics/StableManifoldCrossingValidatedArtifactExact.agda
            DASHI/Physics/Dynamics/YanchukStableManifoldCrossingTargetExact.agda
            DASHI/Unified/Physics.agda
            DASHI/Unified/Everything.agda
            DASHI/Unifier.agda
            DASHI/EverythingTOESymmetryResolved369.agda
          )
          for source in "${sources[@]}"; do
            if grep -nE '(^|[[:space:]])postulate([[:space:]]|$)|allow-unsolved-metas|TERMINATING|NO_POSITIVITY_CHECK' "$source"; then
              echo "forbidden trust escape in $source" >&2
              exit 1
            fi
          done

      - name: Kernel-check connected TOE graph
        run: |
          agda --version
          modules=(
            DASHI/Unified/BalabanRGTOERegression.agda
            DASHI/Unified/BalabanRGTOEMaxCutValidation.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEExact.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEValidation.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda
            DASHI/Unified/SingularBasinCoarseRGTOEExact.agda
            DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda
            DASHI/Unified/YMGoal1TOECompatibilityExact.agda
            DASHI/Unified/Physics.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unifier.agda
            DASHI/Unified/Everything.agda
            DASHI/Unified/YMGoal1TOECompatibilityValidation.agda
          )
          for module in "${modules[@]}"; do
            agda -i . -l standard-library "$module"
          done
