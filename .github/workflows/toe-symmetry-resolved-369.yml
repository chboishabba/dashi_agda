          dashi-repo diagnose DASHI/Unified/R559IbrahimFleetHyperfabricTOEExact.agda --root .
          dashi-repo diagnose DASHI/Unified/R559IbrahimFleetHyperfabricTOEValidation.agda --root .
          dashi-repo related currentGate4FrontierLedgerLevel --root . --limit 30
          dashi-repo related historicalGate4CountSelectedAsFleetTarget --root . --limit 30
