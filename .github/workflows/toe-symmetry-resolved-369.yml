          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsProjectiveCylinder --root .
          dashi-repo diagnose DASHI/Physics/YangMills/BalabanClayGate4PhysicalClosureRound6ExactCutset.agda --root .
          dashi-repo diagnose DASHI/Physics/YangMills/BalabanClayGate4PhysicalClosureRound6Ledger.agda --root .
          dashi-repo related physicalClosureRound6LedgerLevel --root . --limit 20
          dashi-repo diagnose DASHI/Physics/YangMills/YangMillsSubmissionObligationCardinalityExact.agda --root .
          dashi-repo related physicalClosureRound6CutsetInhabitantsLevel --root . --limit 20
          dashi-repo related gate4ObligationCount --root . --limit 20
          dashi-repo discover 'Yang Mills Gate 4 58 unresolved cutset CMP109 Bishop Federbush background gauge Hessian polymer' --root . --limit 50
          dashi-repo related scaleTransferPromotionEliminator --root . --limit 20
          dashi-repo related balabanRGScaleTransferPromotionImpossibleHere --root . --limit 20
          dashi-repo discover 'Balaban R559 same owner direct scale transfer non-promotion TOE max cut' --root . --limit 50
          dashi-repo lineage --prefix DASHI.Unified.BalabanR559 --root .

      - name: Reject ESD surface changes
        shell: bash
        run: |
          git fetch origin master --depth=1
          changed="$(git diff --name-only origin/master...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)([^/]*digital_esd[^/]*|[^/]*ESD[^/]*)($|/)' ; then
            echo "ESD surface change detected" >&2
            exit 1
          fi

      - name: Fast Agda preflight on connected TOE graph
        run: |
          files=(
            DASHI/Unified/BalabanRGTOERegression.agda
            DASHI/Unified/BalabanRGTOEMaxCutValidation.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEExact.agda
            DASHI/Unified/BalabanIbrahimParetoSnowballTOEValidation.agda
            DASHI/Unified/FleetFormalGapTargetTOEExact.agda
            DASHI/Unified/FleetFormalGapTargetTOEValidation.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryExact.agda
            DASHI/Unified/TOE369MaxCutKernelBidiTernaryValidation.agda
            DASHI/Unified/SingularBasinCoarseRGTOEExact.agda
            DASHI/Unified/SingularBasinCoarseRGTOEValidation.agda
            DASHI/Physics/Dynamics/SingularBasinReductionExact.agda
            DASHI/Physics/Dynamics/SingularBasinFiniteWitnessExact.agda
