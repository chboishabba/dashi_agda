name: NS Luo Clay contract round 23

on:
  push:
    branches:
      - 'agent/ns-luo-clay-contract-round23'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'DASHI/Papers/NavierStokes/**'
      - 'docs/ns-clay-contract/**'
      - 'scripts/check_ns_luo_clay_contract_round23.sh'
      - '.github/workflows/ns-luo-clay-contract-round23.yml'
  pull_request:
    branches:
      - 'agent/ns-luo-galerkin-defect-diffusion-round22'
      - 'agent/ns-luo-clay-contract-round23'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'DASHI/Papers/NavierStokes/**'
      - 'docs/ns-clay-contract/**'
      - 'scripts/check_ns_luo_clay_contract_round23.sh'
      - '.github/workflows/ns-luo-clay-contract-round23.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Clay contract round twenty-three
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-round23-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_ns_luo_clay_contract_round23.sh
          ) > ns-round23-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 700 ns-round23-check.log
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round23-logs
          path: |
            ns-round23-check.log
            ns-round23-agda.log
          if-no-files-found: warn

      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='NS round 23 Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='NS round 23 Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='ns-round23-agda' \
            -f description="$description"

      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
