name: Regulatory assay experiment proof search Agda

on:
  pull_request:
    paths:
      - 'DASHI/Chemistry/RegulatoryAssayExperimentProofSearchExact.agda'
      - 'DASHI/Chemistry/Everything.agda'
      - 'DASHI/RegulatoryAssayExperimentProofSearchValidation.agda'
      - 'scripts/check_regulatory_assay_experiment_proof_search.sh'
      - '.github/workflows/regulatory-assay-experiment-proof-search.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run assay experiment/proof-search audit
        run: nix develop .# --command bash scripts/check_regulatory_assay_experiment_proof_search.sh
