name: Biology history future quotient

on:
  pull_request:
    paths:
      - 'DASHI/Biology/Physical/BiologicalHistoryFutureQuotientExact.agda'
      - 'DASHI/Biology/Physical/BiologicalEvidenceFeedbackFiniteExact.agda'
      - 'DASHI/Biology/Physical/SourceIndexedBiologicalCarrierExact.agda'
      - 'DASHI/Biology/Physical/BiologicalFuturePartitionCompilerExact.agda'
      - 'DASHI/Biology/Physical/BiologicalStochasticFutureLumpingExact.agda'
      - 'DASHI/Biology/Physical/BiologicalCoupledTissueCubeExact.agda'
      - 'DASHI/EverythingBiologicalHistoryFutureRound23.agda'
      - 'scripts/check_biological_history_future_quotient.py'
      - 'scripts/biological_gocam_sbml_receipt_intake.py'
      - 'scripts/check_biological_spatial_stochastic.py'
      - 'scripts/biological_si_kinetic_calibration.py'
      - 'scripts/biological_measured_genotype_holdout.py'
      - 'scripts/prepare_shine_dalgarno_measured.py'
      - 'scripts/validate_biological_source_models.py'
      - 'scripts/check_original_dmsc_holdout.py'
      - 'scripts/check_original_dmsc_neutral_components.py'
      - 'scripts/check_biological_history_future_round23.sh'
      - '.github/workflows/biology-history-future.yml'
  workflow_dispatch:

concurrency:
  group: dashi-biology-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda and standard library
        run: |
          sudo apt-get update
          sudo apt-get install -y agda agda-stdlib
      - name: Prepare writable standard library
        id: stdlib
        shell: bash
        run: |
          file="$(dpkg -L agda-stdlib | grep '/Data/Product.agda$' | head -n 1)"
          test -n "$file"
          source_path="${file%/Data/Product.agda}"
          target_path="$RUNNER_TEMP/agda-stdlib"
          cp -a "$source_path" "$target_path"
          echo "path=$target_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy scipy scikit-learn
      - name: Finite biological and spatial regressions
        run: |
          python3 scripts/check_biological_history_future_quotient.py
          python3 scripts/check_biological_spatial_stochastic.py
          python3 scripts/biological_si_kinetic_calibration.py --self-test
          python3 scripts/biological_measured_genotype_holdout.py --self-test
          python3 scripts/prepare_shine_dalgarno_measured.py --self-test
          python3 scripts/check_original_dmsc_holdout.py --self-test
          python3 scripts/check_original_dmsc_neutral_components.py --self-test
      - name: GO-CAM/SBML fail-closed intake regression
        run: python3 scripts/biological_gocam_sbml_receipt_intake.py --self-test
      - name: Golden Agda check
        shell: bash
        run: |
          set -o pipefail
          agda --safe --no-libraries --no-default-libraries \
            -i . -i '${{ steps.stdlib.outputs.path }}' \
            DASHI/EverythingBiologicalHistoryFutureRound23.agda \
            2>&1 | tee biological-history-agda.log
      - name: Upload kernel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biology-history-agda-typecheck-log
          path: biological-history-agda.log
          if-no-files-found: ignore
