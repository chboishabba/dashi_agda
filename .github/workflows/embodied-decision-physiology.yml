name: Embodied decision physiology Agda check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'DASHI/Biology/EmbodiedInteroceptionSourceRegistry.agda'
      - 'DASHI/Biology/EmbodiedHyperformalismSourceRegistry.agda'
      - 'DASHI/Biology/EmbodiedOptionConeInteroceptionExact.agda'
      - 'DASHI/Biology/MultiscaleAllostaticBodyHyperformalismExact.agda'
      - 'DASHI/Biology/StressPhysiologyCascadeExact.agda'
      - 'DASHI/Biology/ObserverRelativeReachableSubfabricExact.agda'
      - 'DASHI/Biology/BranchStatusAlgebraExact.agda'
      - 'DASHI/Biology/TwoBoundaryHyperformalismExact.agda'
      - 'DASHI/Biology/TwoBoundaryRepairModesExact.agda'
      - 'DASHI/Biology/EmbodiedBranchingHyperformalismExact.agda'
      - 'DASHI/Biology/EmbodiedHistoryActionFunctionalExact.agda'
      - 'DASHI/Biology/FeltStateSupervoxelExact.agda'
      - 'DASHI/Biology/BodyModulatedEffectiveTopologyExact.agda'
      - 'DASHI/Biology/BodyModulatedDecisionCoordinatesExact.agda'
      - 'DASHI/Biology/EmbodiedCausalConeFeedbackExact.agda'
      - 'DASHI/Biology/RelationalEmbodiedCoregulationExact.agda'
      - 'DASHI/Biology/IntrospectiveEmbodiedHyperformalismObservationExact.agda'
      - 'DASHI/Biology/IntrospectiveHyperformalismIncidenceExact.agda'
      - 'DASHI/Biology/SymmetryResolvedEmbodiedWaveControlExact.agda'
      - 'DASHI/Biology/QuaternionOrbitEmbodiedReachNonfactorabilityExact.agda'
      - 'DASHI/Biology/TranslationInvariantCompletionAccessibilityNonfactorabilityExact.agda'
      - 'DASHI/Biology/EmbodiedWaveCubieHolonomyExact.agda'
      - 'DASHI/Biology/TwoBoundarySymmetryResolvedModeSectionExact.agda'
      - 'DASHI/Biology/BodyIndexedHarmonicWreathActionExact.agda'
      - 'DASHI/Biology/IntrospectiveSymmetryResolvedHyperformalismExact.agda'
      - 'DASHI/Biology/EmbodiedWaveCrossPollinationRegression.agda'
      - 'DASHI/Biology/EmbodiedDecisionPhysiologyRegression.agda'
      - 'DASHI/Biology/EmbodiedHyperformalismRegression.agda'
      - 'DASHI/Biology/EmbodiedHyperformalismEverything.agda'
      - 'DASHI/Core/CubieFaceOrderHolonomyAnalogueExact.agda'
      - 'DASHI/Core/IntersectionalNonFactorability.agda'
      - 'DASHI/Biology/DomainEverything.agda'
      - 'DASHI/Cognition/PNF/NeuromodulatedCommitmentThresholdExact.agda'
      - 'DASHI/Cognition/PNF/DecisionConfidenceNoncollapseExact.agda'
      - 'DASHI/Governance/OptionConeCoercionExact.agda'
      - 'artifacts/introspective-embodied-hyperfabric-opencv-v1.json'
      - 'artifacts/introspective-embodied-hyperfabric-opencv-v2.json'
      - 'artifacts/introspective-embodied-hyperfabric-opencv-v3.json'
      - 'scripts/introspective_embodied_hyperfabric.py'
      - 'scripts/introspective_embodied_hyperfabric_v2.py'
      - 'scripts/introspective_embodied_hyperfabric_v3.py'
      - '.github/workflows/embodied-decision-physiology.yml'
  workflow_dispatch:

concurrency:
  group: embodied-decision-physiology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reproduce symmetry-aware introspection from pixels
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless
          python3 scripts/introspective_embodied_hyperfabric_v3.py > introspective-v3.log
          python3 - <<'PY'
          import json
          committed=json.load(open('artifacts/introspective-embodied-hyperfabric-opencv-v3.json'))
          recovered=json.load(open('artifacts/introspective-embodied-hyperfabric-v3/opencv_symmetry_observations.json'))
          exact_keys=['observed_supervoxel_count','observed_fibres_per_supervoxel','observed_edges',
                      'source_like_route_recovered','rotational_route_recovered',
                      'biology_inferred_from_pixels','phenomenal_consciousness_inferred_from_pixels']
          for key in exact_keys:
              assert recovered[key] == committed[key], (key,recovered[key],committed[key])
          assert len(recovered['mode_observations']) == len(committed['mode_observations']) == 2
          for got,want in zip(recovered['mode_observations'],committed['mode_observations']):
              for key in ['box','recovered_vector_count','chirality','gate_class']:
                  assert got[key] == want[key], (key,got[key],want[key])
              for key in ['divergence_proxy','curl_proxy','orientation_angle_deg','gate_fill_ratio']:
                  assert abs(got[key]-want[key]) <= 0.01, (key,got[key],want[key])
          PY
      - name: Check embodied hyperformalism roots
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export DASHI_NO_TMUX=1
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-embodied-hyperformalism.log"
            export AGDA_JOBS=2
            scripts/run_agda29_parallel_check.sh \
              DASHI/Biology/EmbodiedDecisionPhysiologyRegression.agda \
              DASHI/Biology/EmbodiedHyperformalismRegression.agda \
              DASHI/Biology/EmbodiedWaveCrossPollinationRegression.agda \
              DASHI/Biology/EmbodiedHyperformalismEverything.agda
          ) > embodied-hyperformalism-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 360 embodied-hyperformalism-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-hyperformalism-agda-log
          path: |
            embodied-hyperformalism-check.log
            introspective-v3.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
