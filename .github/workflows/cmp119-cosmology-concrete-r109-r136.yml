name: CMP119 concrete R109 completion to R136

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyConcreteR109RealCompletionToR136Exact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyConcreteR109RealCompletionToR136Test.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologySelectedR109RealTailSignCompilerExact.agda'
      - '.github/workflows/cmp119-cosmology-concrete-r109-r136.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-concrete-r109-r136-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck concrete R109 completion to R136
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library \
              DASHI/Physics/Foundations/CMP119CosmologySelectedR109RealTailSignCompilerExact.agda
            agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library \
              DASHI/Physics/Foundations/CMP119CosmologyConcreteR109RealCompletionToR136Exact.agda
            agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library \
              DASHI/Physics/Foundations/CMP119CosmologyConcreteR109RealCompletionToR136Test.agda
          '
