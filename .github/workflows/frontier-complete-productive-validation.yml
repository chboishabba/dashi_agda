name: Frontier complete productive validation

on:
  push:
    branches:
      - 'agent/frontier-hodge-automorphic-spectral-crosspollination'
    paths:
      - 'DASHI/Mathematics/Arithmetic/EllipticCurveFiniteTwoDescentSeedExact.agda'
      - 'DASHI/Mathematics/CrossPollination/FrontierCompleteProductive*.agda'
      - 'DASHI/EverythingFrontierCompleteProductiveValidation.agda'
      - 'scripts/check_frontier_complete_productive_validation.sh'
      - '.github/workflows/frontier-complete-productive-validation.yml'
  pull_request:
    branches:
      - 'agent/millennium-crosspollination-rh-hodge-bsd-pnp-poincare-voa'
    paths:
      - 'DASHI/Mathematics/Arithmetic/EllipticCurveFiniteTwoDescentSeedExact.agda'
      - 'DASHI/Mathematics/CrossPollination/FrontierCompleteProductive*.agda'
      - 'DASHI/EverythingFrontierCompleteProductiveValidation.agda'
      - 'scripts/check_frontier_complete_productive_validation.sh'
      - '.github/workflows/frontier-complete-productive-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check complete productive frontier
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/frontier-complete-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_frontier_complete_productive_validation.sh
          ) > frontier-complete-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 1000 frontier-complete-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-complete-logs
          path: |
            frontier-complete-check.log
            frontier-complete-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='Complete productive frontier Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='Complete productive frontier Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='frontier-complete-productive-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
