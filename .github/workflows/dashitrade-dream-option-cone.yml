name: dashiTRADE dream option-cone Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Trading/**.agda'
      - 'DASHI/Core/IntersectionalNonFactorability.agda'
      - 'Docs/support/reference/DashiTradeDreamOptionConeRoadmap.md'
      - '.github/workflows/dashitrade-dream-option-cone.yml'
  workflow_dispatch:

concurrency:
  group: dashitrade-dream-option-cone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trust scan trading dream tranche
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Trading/DashiTradeDreamOptionConeExact.agda
            DASHI/Trading/DashiTradeDreamRegression.agda
            DASHI/Trading/Everything.agda
          )
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|sorry|admit)\b' "${files[@]}"; then
            echo 'Forbidden trust-boundary token found in trading dream tranche.' >&2
            exit 1
          fi
      - name: Check focused trading dream roots with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export DASHI_NO_TMUX=1
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-dashitrade-dream-check.log"
            export AGDA_JOBS=2
            scripts/run_agda29_parallel_check.sh \
              DASHI/Trading/DashiTradeDreamOptionConeExact.agda \
              DASHI/Trading/DashiTradeDreamRegression.agda \
              DASHI/Trading/Everything.agda
          ) > agda-dashitrade-dream-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 agda-dashitrade-dream-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashitrade-dream-agda-log
          path: agda-dashitrade-dream-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
