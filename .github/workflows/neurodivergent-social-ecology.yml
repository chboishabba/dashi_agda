name: Neurodivergent social-ecology Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Biology/AutisticInformationProcessingLandscapeExact.agda'
      - 'DASHI/Biology/NeurotypeProcessingGeometryExact.agda'
      - 'DASHI/Biology/AuDHDInteractionGeometryExact.agda'
      - 'DASHI/Biology/PsilautNetworkResponseGeometryExact.agda'
      - 'DASHI/Biology/NeurodivergentSocialEcologySourceRegistryExact.agda'
      - 'DASHI/Biology/SocialEcologicalAffordanceConeExact.agda'
      - 'DASHI/Biology/TrustedFriendRelationalScaffoldingExact.agda'
      - 'DASHI/Biology/TrustedFriendRelationalGateExact.agda'
      - 'DASHI/Biology/TrustedFriendEcologyInteractionExact.agda'
      - 'DASHI/Biology/NeuroqueerRelationshipEcologyExact.agda'
      - 'DASHI/Biology/SolisProjectProvenanceExact.agda'
      - 'DASHI/Biology/SolisSystemSensitivityBoundaryExact.agda'
      - 'DASHI/Biology/NeurodivergentSocialEcologyCrossPollinationExact.agda'
      - 'DASHI/Core/ContrastiveInterventionResponseExact.agda'
      - 'DASHI/Biology/DomainEverything.agda'
      - '.github/workflows/neurodivergent-social-ecology.yml'
  workflow_dispatch:

concurrency:
  group: neurodivergent-social-ecology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: neurodivergent-social-ecology-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Trust scan neurodivergent social-ecology tranche
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Biology/AutisticInformationProcessingLandscapeExact.agda
            DASHI/Biology/NeurotypeProcessingGeometryExact.agda
            DASHI/Biology/AuDHDInteractionGeometryExact.agda
            DASHI/Biology/PsilautNetworkResponseGeometryExact.agda
            DASHI/Biology/NeurodivergentSocialEcologySourceRegistryExact.agda
            DASHI/Biology/SocialEcologicalAffordanceConeExact.agda
            DASHI/Biology/TrustedFriendRelationalScaffoldingExact.agda
            DASHI/Biology/TrustedFriendRelationalGateExact.agda
            DASHI/Biology/TrustedFriendEcologyInteractionExact.agda
            DASHI/Biology/NeuroqueerRelationshipEcologyExact.agda
            DASHI/Biology/SolisProjectProvenanceExact.agda
            DASHI/Biology/SolisSystemSensitivityBoundaryExact.agda
            DASHI/Biology/NeurodivergentSocialEcologyCrossPollinationExact.agda
            DASHI/Core/ContrastiveInterventionResponseExact.agda
          )
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|sorry|admit)\b' "${files[@]}"; then
            echo 'Forbidden trust-boundary token found in neurodivergent social-ecology tranche.' >&2
            exit 1
          fi
      - name: Check focused tranche with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export DASHI_NO_TMUX=1
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-neurodivergent-social-ecology-check.log"
            export AGDA_JOBS=2
            targets=(
              DASHI/Biology/AuDHDInteractionGeometryExact.agda
              DASHI/Biology/TrustedFriendRelationalGateExact.agda
              DASHI/Biology/TrustedFriendEcologyInteractionExact.agda
              DASHI/Biology/NeurodivergentSocialEcologyCrossPollinationExact.agda
              DASHI/Biology/DomainEverything.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-neurodivergent-social-ecology-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 340 agda-neurodivergent-social-ecology-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurodivergent-social-ecology-agda-log
          path: agda-neurodivergent-social-ecology-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
