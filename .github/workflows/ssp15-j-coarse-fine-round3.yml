name: SSP15 j-coarse j-fine round 3

on:
  pull_request:
    branches:
      - 'master'
      - 'agent/stage-euler-tree-complement-round2'
      - 'agent/ssp15-j-coarse-fine-round3'
    paths:
      - 'DASHI/Biology/NonaryCompletionPhaseQuotientExact.agda'
      - 'DASHI/Biology/SSP15ComplementPhaseProjectorExact.agda'
      - 'DASHI/Biology/OggPrimeNonaryAddressExact.agda'
      - 'DASHI/Biology/JCoarseFineEvaluationFibreExact.agda'
      - 'DASHI/Biology/SSP15NineObserverAtlasExact.agda'
      - 'DASHI/Biology/StageSymmetrySSP15BridgeExact.agda'
      - 'DASHI/Biology/StageSymmetrySSP15SpectrumExact.agda'
      - 'DASHI/Biology/SSP15JCoarseFineIntegratedExact.agda'
      - 'DASHI/Biology/SSP15PrimeValuedStateExact.agda'
      - 'DASHI/Biology/SSP15JCoarseFineRound3Validation.agda'
      - 'DASHI/Biology/PointedBulkSporadicTarotEverything.agda'
      - 'DASHI/EverythingSSP15JCoarseFineRound3.agda'
      - 'Docs/support/reference/SSP15JCoarseFineRound3.md'
      - 'scripts/check_ssp15_j_coarse_fine_round3.sh'
      - '.github/workflows/ssp15-j-coarse-fine-round3.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check SSP15 j-coarse/j-fine tranche
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_ssp15_j_coarse_fine_round3.sh
