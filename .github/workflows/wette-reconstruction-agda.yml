name: Wette reconstruction Agda

on:
  pull_request:
    paths:
      - 'DASHI/Core/FormalClaimTransportGeometryExact.agda'
      - 'DASHI/Core/FormalizationRecoverySourceRegistryExact.agda'
      - 'DASHI/Core/FormalizationRecoveryGeometryExact.agda'
      - 'DASHI/Core/SourceAcquisitionGeometryExact.agda'
      - 'DASHI/Core/DeductionIndexedInterpretationExact.agda'
      - 'DASHI/Core/FormalSystemRevisionGeometryExact.agda'
      - 'DASHI/Core/RulePremiseDependencyGeometryExact.agda'
      - 'DASHI/Core/OrderedSubstitutionGeometryExact.agda'
      - 'DASHI/Core/RulePremiseTypingGeometryExact.agda'
      - 'DASHI/Core/ProofCarryingRuleApplicationExact.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Foundations/Wette*.agda'
      - 'DASHI/Foundations/Wette/**'
      - 'DASHI/Foundations/Everything.agda'
      - 'scripts/check_wette_reconstruction.sh'
      - 'scripts/check_wette_source_acquisition.sh'
      - 'scripts/check_wette_critical_rules.sh'
      - 'scripts/check_wette_substitution_order.sh'
      - 'scripts/check_wette_premise_typing.sh'
      - 'scripts/check_wette_proof_carrying_application.sh'
      - 'scripts/check_wette_derivation_closure_and_substitution.sh'
      - 'scripts/check_wette_rule915_cutset.sh'
      - 'scripts/check_wette_rule915_premise18_resolution.sh'
      - 'scripts/check_wette_rule915_major_trace_join.sh'
      - '.github/workflows/wette-reconstruction-agda.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
      AGDA_LOG_PATH: ${{ github.workspace }}/.cache/wette-reconstruction-agda.log
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install DASHI repository referee
        run: python -m pip install -e './tools/agda_preflight[test,mcp]'
      - name: Referee Wette reuse, discovery, and lineage
        run: |
          dashi-repo index --root .
          dashi-repo diagnose DASHI/Foundations/Wette1969Rule915MajorDerivationProblemExact.agda --root .
          dashi-repo related CanonicalRule915CurrentProblem --root . --limit 20
          dashi-repo related CanonicalRule915SelectedRouteResidual --root . --limit 20
          dashi-repo related matchedRule9323ClosesPremise18 --root . --limit 20
          dashi-repo related closeCanonicalPremise27 --root . --limit 20
          dashi-repo discover 'Wette 1969 rule 9.1.5 premise 18 premise 27 proof carrying cutset' --root . --limit 50
          dashi-repo lineage --prefix DASHI.Foundations.Wette1969Rule915 --root .
          dashi-repo diagnose DASHI/EverythingTOESymmetryResolved369.agda --root .
          dashi-repo diagnose DASHI/Unifier.agda --root .
          dashi-repo diagnose DASHI/Unified/Everything.agda --root .
      - name: Reject ESD surface changes
        shell: bash
        run: |
          git fetch origin master --depth=1
          changed="$(git diff --name-only origin/master...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)([^/]*digital_esd[^/]*|[^/]*ESD[^/]*)($|/)' ; then
            echo "ESD surface change detected" >&2
            exit 1
          fi
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run focused Wette source and typecheck audit
        run: |
          nix develop .# --command bash scripts/check_wette_source_acquisition.sh
          nix develop .# --command bash scripts/check_wette_critical_rules.sh
          nix develop .# --command bash scripts/check_wette_substitution_order.sh
          nix develop .# --command bash scripts/check_wette_premise_typing.sh
          nix develop .# --command bash scripts/check_wette_proof_carrying_application.sh
          nix develop .# --command bash scripts/check_wette_derivation_closure_and_substitution.sh
          nix develop .# --command bash scripts/check_wette_rule915_cutset.sh
          nix develop .# --command bash scripts/check_wette_rule915_premise18_resolution.sh
          nix develop .# --command bash scripts/check_wette_rule915_major_trace_join.sh
          nix develop .# --command bash scripts/check_wette_reconstruction.sh
