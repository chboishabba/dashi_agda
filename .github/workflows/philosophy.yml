name: Philosophy formalism

on:
  pull_request:
    paths:
      - "DASHI/Philosophy/**"
      - "DASHI/Economics/Wealth*20261027Exact.agda"
      - "DASHI/Economics/Everything.agda"
      - "DASHI/Economics/WealthTaxDashiTradeMarketMaterialBidiExact.agda"
      - "DASHI/Unified/WealthTaxEvidenceNonPromotionTOEExact.agda"
      - "DASHI/Everything.agda"
      - "Docs/economics/WealthInheritanceVacancyTaxMaxCut20261027.md"
      - "scripts/check_wealth_tax_maxcut.py"
      - "Docs/economics/WealthTaxOriginalConversationsFullCoverage20261027.md"
      - "scripts/check_wealth_tax_requested_topics.py"
      - "DASHI/EverythingPhilosophy.agda"
      - "DASHI/EverythingPhilosophyClosure.agda"
      - "Docs/PhilosophyReflexiveRelationalFormalism.md"
      - "Docs/PhilosophyClosureLawsAndInstances.md"
      - ".github/workflows/philosophy.yml"


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_FLAGS: "--no-libraries --no-default-libraries -i . -i .agda-stdlib"
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda and writable standard library
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq agda-bin agda-stdlib >/dev/null
          cp -a /usr/share/agda-stdlib .agda-stdlib
          agda --version
      - name: Run fiscal power and care bounded regression
        run: python3 scripts/check_wealth_tax_maxcut.py
      - name: Audit all 42 requested wealth and philosophy subjects
        run: python3 scripts/check_wealth_tax_requested_topics.py
      - name: Install canonical Agda semantic preflight
        run: python3 -m pip install -e tools/agda_preflight
      - name: Check existing economics owners and TOE bridge without synthetic receipts
        run: |
          dashi-agda-preflight --root . DASHI/Economics/WealthInheritanceVacancyTaxMaxCut20261027Exact.agda
          dashi-agda-preflight --root . DASHI/Economics/WealthTaxPowerCareSociologyBidi20261027Exact.agda
          dashi-agda-preflight --root . DASHI/Economics/WealthTaxFiscalTransmissionControlBidi20261027Exact.agda
          dashi-agda-preflight --root . DASHI/Economics/WealthTaxDashiTradeMarketMaterialBidiExact.agda
          dashi-agda-preflight --root . DASHI/Unified/WealthTaxEvidenceNonPromotionTOEExact.agda
      - name: Typecheck fiscal transmission tax max-cut
        run: |
          agda $AGDA_FLAGS DASHI/Economics/WealthInheritanceVacancyTaxMaxCut20261027Exact.agda
          agda $AGDA_FLAGS DASHI/Economics/WealthTaxPowerCareSociologyBidi20261027Exact.agda
          agda $AGDA_FLAGS DASHI/Economics/WealthTaxFiscalTransmissionControlBidi20261027Exact.agda
          agda $AGDA_FLAGS DASHI/Economics/WealthTaxDashiTradeMarketMaterialBidiExact.agda
          agda $AGDA_FLAGS DASHI/Unified/WealthTaxEvidenceNonPromotionTOEExact.agda
      - name: Typecheck original philosophy regression
        run: agda $AGDA_FLAGS DASHI/Philosophy/PhilosophyRegression.agda
      - name: Typecheck closure-law regression
        run: agda $AGDA_FLAGS DASHI/Philosophy/CompletionRegression.agda
      - name: Typecheck hard-closure regression
        run: agda $AGDA_FLAGS DASHI/Philosophy/HardClosureRegression.agda
      - name: Typecheck stable philosophy core
        run: agda $AGDA_FLAGS DASHI/Philosophy/StableCore.agda
      - name: Typecheck gated applications
        run: agda $AGDA_FLAGS DASHI/Philosophy/Applications.agda
      - name: Typecheck philosophy aggregate
        run: agda $AGDA_FLAGS DASHI/Philosophy/Everything.agda
      - name: Typecheck repository plus philosophy aggregate
        run: agda $AGDA_FLAGS DASHI/EverythingPhilosophy.agda
      - name: Typecheck repository plus closure aggregate
        run: agda $AGDA_FLAGS DASHI/EverythingPhilosophyClosure.agda
