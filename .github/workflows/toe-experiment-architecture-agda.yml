name: TOE experiment architecture Agda

on:
  pull_request:
    paths:
      - 'DASHI/Core/PredictionEnvelopeExact.agda'
      - 'DASHI/Core/CalibratedExperimentInferenceExact.agda'
      - 'DASHI/Core/RobustExperimentInferenceFrontierExact.agda'
      - 'DASHI/Core/TOEExperimentArchitectureValidation.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Physics/Foundations/PhysicalTheoryExperimentDiscriminationExact.agda'
      - 'DASHI/Physics/Foundations/SameCandidateQFTGRRecoveryExact.agda'
      - 'DASHI/Physics/Foundations/SameCandidateQFTGRRecoveryValidation.agda'
      - 'DASHI/Physics/Foundations/SharedEffectiveSourceRecoveryExact.agda'
      - 'DASHI/Physics/Foundations/SharedEffectiveSourceRecoveryValidation.agda'
      - 'DASHI/Physics/Foundations/CommonEffectiveActionVariationExact.agda'
      - 'DASHI/Physics/Foundations/CommonEffectiveActionVariationValidation.agda'
      - 'DASHI/Physics/Foundations/BalabanCommonActionVariationFrontierExact.agda'
      - 'DASHI/Physics/Foundations/BalabanCommonActionVariationValidation.agda'
      - 'DASHI/Physics/Foundations/EinsteinCommonActionVariationFrontierExact.agda'
      - 'DASHI/Physics/Foundations/EinsteinCommonActionVariationValidation.agda'
      - 'DASHI/Physics/Foundations/CommonActionQFTGRVariationCompilerExact.agda'
      - 'DASHI/Physics/Foundations/Everything.agda'
      - 'scripts/check_toe_experiment_architecture.sh'
      - 'scripts/check_shared_effective_source_recovery.sh'
      - '.github/workflows/toe-experiment-architecture-agda.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run focused TOE experiment architecture audit
        run: nix develop .# --command bash scripts/check_toe_experiment_architecture.sh
      - name: Run shared effective-source QFT/GR audit
        run: nix develop .# --command bash scripts/check_shared_effective_source_recovery.sh


  ym-goal1-r474-toe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DASHI repository referee
        run: python -m pip install -e './tools/agda_preflight[test,mcp]'

      - name: Referee R485 to R559 normalization
        shell: bash
        run: |
          set -euo pipefail
          dashi-repo index --root .
          dashi-repo diagnose DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Exact.agda --root .
          dashi-repo diagnose DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda --root .
          dashi-repo diagnose DASHI/EverythingTOESymmetryResolved369.agda --root .
          dashi-repo diagnose DASHI/Unified/Physics.agda --root .
          dashi-repo diagnose DASHI/Unifier.agda --root .
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayGoal1MaximumCutRound485Exact.a1CurrentStepBetaSourceLevel --root . --limit 20
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayGoal1MaximumCutRound485Exact.bLiteralPublishedSelectedLocalizationLevel --root . --limit 20
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayGoal1MaximumCutRound485Exact.cExactSameFamilySourceCutLevel --root . --limit 20
          dashi-repo related DASHI.Physics.YangMills.YangMillsClayGoal1MaximumCutRound485Exact.g2SameSystemClayNontrivialitySemanticsLevel --root . --limit 20
          dashi-repo discover 'Yang Mills Goal1 R485 R559 TOE maximum cut non-promotion' --root . --limit 40
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsClayGoal1 --root .
          dashi-repo lineage --prefix DASHI.Physics.YangMills.YangMillsTOEConvergence --root .

      - name: Reject ESD surface changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/ym-toe-convergence-r517-20261027 --depth=1
          changed="$(git diff --name-only origin/agent/ym-toe-convergence-r517-20261027...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)([^/]*digital_esd[^/]*|[^/]*ESD[^/]*)($|/)'; then
            echo "ESD surface change detected" >&2
            exit 1
          fi

      - name: Install Agda and standard library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.3'
          agda-stdlib-version: '2.1'

      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Exact.agda
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unified/Physics.agda
            DASHI/Unifier.agda
          )
          for source in "${sources[@]}"; do
            if grep -nE '(^|[[:space:]])postulate([[:space:]]|$)|allow-unsolved-metas|TERMINATING|NO_POSITIVITY_CHECK' "$source"; then
              echo "forbidden trust escape in $source" >&2
              exit 1
            fi
          done

      - name: Kernel-check R485 Goal-1 TOE graph
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            DASHI/Physics/YangMills/YangMillsTOEConvergenceRound559Validation.agda
            DASHI/EverythingTOESymmetryResolved369.agda
            DASHI/Unified/Physics.agda
            DASHI/Unifier.agda
          )
          for module in "${modules[@]}"; do
            agda -i . -l standard-library "$module"
          done
