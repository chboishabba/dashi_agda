name: TOE experiment architecture Agda

on:
  pull_request:
    paths:
      - 'DASHI/Core/PredictionEnvelopeExact.agda'
      - 'DASHI/Core/CalibratedExperimentInferenceExact.agda'
      - 'DASHI/Core/RobustExperimentInferenceFrontierExact.agda'
      - 'DASHI/Core/TOEExperimentArchitectureValidation.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Physics/Foundations/PhysicalTheoryExperimentDiscriminationExact.agda'
      - 'DASHI/Physics/Foundations/SameCandidateQFTGRRecoveryExact.agda'
      - 'DASHI/Physics/Foundations/SameCandidateQFTGRRecoveryValidation.agda'
      - 'DASHI/Physics/Foundations/SharedEffectiveSourceRecoveryExact.agda'
      - 'DASHI/Physics/Foundations/SharedEffectiveSourceRecoveryValidation.agda'
      - 'DASHI/Physics/Foundations/CommonEffectiveActionVariationExact.agda'
      - 'DASHI/Physics/Foundations/CommonEffectiveActionVariationValidation.agda'
      - 'DASHI/Physics/Foundations/BalabanCommonActionVariationFrontierExact.agda'
      - 'DASHI/Physics/Foundations/BalabanCommonActionVariationValidation.agda'
      - 'DASHI/Physics/Foundations/BalabanAllSectorContinuumProducerExact.agda'
      - 'DASHI/Physics/Foundations/BalabanNativeSectorRecoveryTransportExact.agda'
      - 'DASHI/Physics/Foundations/BalabanContinuumProducerValidation.agda'
      - 'DASHI/Physics/Foundations/EinsteinCommonActionVariationFrontierExact.agda'
      - 'DASHI/Physics/Foundations/EinsteinCommonActionVariationValidation.agda'
      - 'DASHI/Physics/Foundations/CommonActionQFTGRVariationCompilerExact.agda'
      - 'DASHI/Physics/Foundations/CommonActionQFTGRContinuumProducerCompilerExact.agda'
      - 'DASHI/Physics/Foundations/Everything.agda'
      - 'scripts/check_toe_experiment_architecture.sh'
      - 'scripts/check_shared_effective_source_recovery.sh'
      - '.github/workflows/toe-experiment-architecture-agda.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run focused TOE experiment architecture audit
        run: nix develop .# --command bash scripts/check_toe_experiment_architecture.sh
      - name: Run shared effective-source QFT/GR audit
        run: nix develop .# --command bash scripts/check_shared_effective_source_recovery.sh
