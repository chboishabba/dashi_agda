      - 'DASHI/Physics/Foundations/CMP119CosmologyR144R109DirectTailAnchorExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyUnnormalizedSourceTailMarginExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyDirectTailFromSourceNumeratorExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyDirectSourceNumeratorTailToExpansionExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyDirectSourceNumeratorTailToExpansionTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223ERBMetricVariationUnderdeterminationExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223VacuumMetricSignUnderdeterminationExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailThresholdToExpansionExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223ConcreteVacuumThresholdToExpansionExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CanonicalSourceOrderedHaarTraceClosureExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CanonicalSourceOrderedHaarTraceClosureTest.agda'
      - '.github/workflows/cmp119-cosmology-preferred-a1a2b1b2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-cosmology-preferred-a1a2b1b2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck final source-native preferred max-cut and terminal route
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for f in \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredA1CanonicalReceiptAdapterExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredA2SelectedReceiptAdapterExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyE1SourceNaturalityToR144MarkedExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyE1SourceNaturalityToR144MarkedTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyR144R109DirectTailAnchorExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyUnnormalizedSourceTailMarginExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyDirectTailFromSourceNumeratorExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyDirectSourceNumeratorTailToExpansionExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyDirectSourceNumeratorTailToExpansionTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyConnectedResponseDoesNotPayPartitionB2Exact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyConnectedResponseDoesNotPayPartitionB2Test.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPartitionDerivativeTailMarginExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPartitionDerivativeTailMarginTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPartitionDerivativeTailToExpansionExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPartitionDerivativeTailToExpansionTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003HExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003HTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003IExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003ITest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003I1Exact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003I1Test.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003JExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261003JTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004KExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004KTest.agda \
              DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerExact.agda \
              DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerTest.agda \
              DASHI/Physics/Foundations/CMP119CanonicalSourceOrderedHaarTraceClosureExact.agda \
              DASHI/Physics/Foundations/CMP119CanonicalSourceOrderedHaarTraceClosureTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredA1A2B1B2TypedReceiptTest.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$f"
            done
          '
