name: CMP119 cosmology preferred A1 A2 B1 B2

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredA1A2B1B2RouteExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredA1A2B1B2TypedReceiptTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyE1R144CanonicalB4ReadoutExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR109FunctionalStressCylinderPresentationExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR109WilsonAdmissibleStressCylinderExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR144R109DirectTailAnchorExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223VacuumTailThresholdExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailThresholdToExpansionExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerTest.agda'
      - '.github/workflows/cmp119-cosmology-preferred-a1a2b1b2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-cosmology-preferred-a1a2b1b2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck preferred A1/A2/B1/B2 route and exact receipt regression
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for f in \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredA1A2B1B2RouteExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailThresholdToExpansionExact.agda \
              DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerExact.agda \
              DASHI/Physics/Foundations/CMP119CanonicalWilsonGibbsMetricFamilyWeldCompilerTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredA1A2B1B2TypedReceiptTest.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$f"
            done
          '
