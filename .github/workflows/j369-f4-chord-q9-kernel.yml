name: J369 F4 chord group and Q9 action kernel

on:
  push:
    branches:
      - feature/j369-ogg-address-ssp15-no-go-20260925
    paths:
      - 'DASHI/Moonshine/OggSSPP2F4ZetaCurvePointEnumerationExact.agda'
      - 'DASHI/Moonshine/OggSSPP2F4CurveShearReflectionExact.agda'
      - 'DASHI/Moonshine/OggSSPP2F4CurveExactChordGroup.agda'
      - 'DASHI/Moonshine/OggSSPP2F4CurveQ9GroupActionBidiExact.agda'
      - 'DASHI/Foundations/PhaseQuotientNonaryGroupSeparationExact.agda'
      - '.github/workflows/j369-f4-chord-q9-kernel.yml'
  pull_request:
    paths:
      - 'DASHI/Moonshine/OggSSPP2F4CurveExactChordGroup.agda'
      - 'DASHI/Moonshine/OggSSPP2F4CurveQ9GroupActionBidiExact.agda'
      - '.github/workflows/j369-f4-chord-q9-kernel.yml'
  workflow_dispatch:

concurrency:
  group: j369-f4-chord-q9-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
      AGDA_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Kernel-check curve arithmetic, S3, and original Q9 group law
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/run_agda29_parallel_check.sh \
            DASHI/Moonshine/OggSSPP2F4CurveShearReflectionExact.agda \
            DASHI/Moonshine/OggSSPP2F4CurveExactChordGroup.agda \
            DASHI/Moonshine/OggSSPP2F4CurveQ9GroupActionBidiExact.agda
