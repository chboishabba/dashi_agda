name: Frontier Hodge automorphic spectral cross-pollination

on:
  pull_request:
    branches:
      - 'agent/millennium-crosspollination-rh-hodge-bsd-pnp-poincare-voa'
    paths:
      - 'DASHI/Mathematics/Topology/FiniteCochainComplexExact.agda'
      - 'DASHI/Mathematics/LinearAlgebra/**'
      - 'DASHI/Mathematics/NumberTheory/Finite*.agda'
      - 'DASHI/Mathematics/Automorphic/**'
      - 'DASHI/Mathematics/Arithmetic/EllipticCurveSmallPrimeFrobeniusExact.agda'
      - 'DASHI/Mathematics/Arithmetic/SmallPrimeTruncatedEulerProductExact.agda'
      - 'DASHI/Mathematics/Arithmetic/EllipticCurveTwoTorsionAndBadPrimeExact.agda'
      - 'DASHI/Mathematics/AlgebraicGeometry/ProjectiveLineProductHodgeExact.agda'
      - 'DASHI/Mathematics/Complexity/PSubsetNPTrivialCertificateExact.agda'
      - 'DASHI/Mathematics/Complexity/MachineRunCertificateExact.agda'
      - 'DASHI/Mathematics/Complexity/FiniteCookLevinTableauExact.agda'
      - 'DASHI/Moonshine/SquareZeroDifferentialVertexAlgebraExact.agda'
      - 'DASHI/Moonshine/RankOneFock*.agda'
      - 'DASHI/Analysis/SharedFiniteSpectralCertificationExact.agda'
      - 'DASHI/Physics/YangMills/FiniteAbelianGaugeHodgeExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsHodgeCoercivityFrontierExact.agda'
      - 'DASHI/Physics/Closure/FiniteHodgePhysicsCrossPollinationExact.agda'
      - 'DASHI/Physics/Closure/NavierStokesFiniteVorticityDepletionExact.agda'
      - 'DASHI/Mathematics/CrossPollination/Frontier*.agda'
      - 'DASHI/EverythingFrontierHodgeAutomorphicSpectralCrossPollination.agda'
      - 'scripts/check_frontier_hodge_automorphic_spectral_crosspollination.sh'
      - '.github/workflows/frontier-hodge-automorphic-spectral-crosspollination.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check frontier Hodge automorphic spectral tranche
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/frontier-hodge-automorphic-spectral-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_frontier_hodge_automorphic_spectral_crosspollination.sh
          ) > frontier-hodge-automorphic-spectral-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 700 frontier-hodge-automorphic-spectral-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-hodge-automorphic-spectral-logs
          path: |
            frontier-hodge-automorphic-spectral-check.log
            frontier-hodge-automorphic-spectral-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='Frontier cross-pollination Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='Frontier cross-pollination Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='frontier-hodge-automorphic-spectral-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
