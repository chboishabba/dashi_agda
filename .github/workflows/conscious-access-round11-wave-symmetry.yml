name: Conscious access round 11 wave symmetry

on:
  pull_request:
    branches:
      - master
    paths:
      - 'DASHI/Biology/**'
      - 'DASHI/Mathematics/NumberTheory/RiemannReflectionOrbitDefectExact.agda'
      - 'Docs/support/reference/ConsciousAccessRound11WaveSymmetryFormalism.md'
      - 'scripts/check_conscious_access_round11_wave_symmetry.sh'
      - '.github/workflows/conscious-access-round11-wave-symmetry.yml'
  workflow_dispatch:

concurrency:
  group: conscious-round11-wave-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check wave symmetry round eleven
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/conscious-access-round11-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_conscious_access_round11_wave_symmetry.sh
          ) > conscious-access-round11-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 400 conscious-access-round11-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conscious-access-round11-logs
          path: |
            conscious-access-round11-check.log
            conscious-access-round11-agda.log
          if-no-files-found: warn
      - name: Publish checker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          state=success
          description='Round 11 wave symmetry checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='Round 11 wave symmetry checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='conscious-round11-wave-agda' \
            -f description="$description"
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
