name: Legal decision cross-pollination Agda check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'DASHI/Core/NonFactorabilityCompositionExact.agda'
      - 'DASHI/Core/FibreOrderNonfactorabilityExact.agda'
      - 'DASHI/Governance/LegalDecisionDoubleProjectionExact.agda'
      - 'DASHI/Governance/LegalDecisionFibreDynamicsExact.agda'
      - 'DASHI/Governance/DecisionPotentialAuthorityOrthogonalityExact.agda'
      - 'DASHI/Governance/LegalDecisionCrossPollinationRegression.agda'
      - '.github/workflows/legal-decision-cross-pollination.yml'
  workflow_dispatch:

concurrency:
  group: legal-decision-cross-pollination-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: legal-decision-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Check legal-decision cross-pollination root with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export XDG_CACHE_HOME="$RUNNER_TEMP/dashi-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export DASHI_NO_TMUX=1
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-legal-decision-cross-pollination.log"
            export AGDA_JOBS=2
            scripts/run_agda29_parallel_check.sh \
              DASHI/Governance/LegalDecisionCrossPollinationRegression.agda
          ) > legal-decision-cross-pollination-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 320 legal-decision-cross-pollination-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-decision-cross-pollination-agda-log
          path: legal-decision-cross-pollination-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
