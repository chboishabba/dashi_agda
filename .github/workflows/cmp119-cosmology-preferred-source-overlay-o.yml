name: CMP119 cosmology preferred source overlay O

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyDirectDGammaR109CompletionExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyDirectDGammaR109CompletionTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyLocalCSelectedCylinderDirectExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyLocalCSelectedCylinderDirectTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR136LocalCTraceAnomalyExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR136LocalCTraceAnomalyTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR136TraceFrameCalibrationExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR136TraceFrameCalibrationTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004OExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004OTest.agda'
      - '.github/workflows/cmp119-cosmology-preferred-source-overlay-o.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-cosmology-preferred-source-overlay-o-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck overlay O max-cut
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for f in \
              DASHI/Physics/Foundations/CMP119CosmologyDirectDGammaR109CompletionExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyDirectDGammaR109CompletionTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyLocalCSelectedCylinderDirectExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyLocalCSelectedCylinderDirectTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyR136LocalCTraceAnomalyExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyR136LocalCTraceAnomalyTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyR136TraceFrameCalibrationExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyR136TraceFrameCalibrationTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004OExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004OTest.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$f"
            done
          '
