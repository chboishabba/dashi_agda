name: Base369 process hyperfabric round 6

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - 'agent/monster-3b-orbifold-local-module-round4'
      - 'agent/monster-3b-central-character-inertia-round5'
    paths:
      - 'DASHI/Foundations/Base369SignedMembershipExact.agda'
      - 'DASHI/Foundations/Base369LayeredAttractorAndCoarseFineExact.agda'
      - 'DASHI/Foundations/Base369AddressSymmetryAndBranchGeometryExact.agda'
      - 'DASHI/Foundations/Base369ProcessBranchAttractorExact.agda'
      - 'DASHI/Foundations/Base369ProcessHyperfabricRound6Validation.agda'
      - 'DASHI/EverythingBase369ProcessHyperfabricRound6.agda'
      - 'DASHI/EverythingMonster3BCentralCharacterInertiaRound5.agda'
      - 'Docs/support/reference/Base369ProcessHyperfabricRound6.md'
      - 'scripts/check_base369_process_hyperfabric_round6.sh'
      - '.github/workflows/base369-process-hyperfabric-round6.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check Base369 process hyperfabric round 6
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_base369_process_hyperfabric_round6.sh
