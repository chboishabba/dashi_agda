name: NS A-B-C Round58 smoke typecheck

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ym-round52-source-dictionary-physical-leaves

permissions:
  contents: read

concurrency:
  group: ns-abc-round58-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check A-B-C Round58 surfaces
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-ns-abc-round58.log"
          export AGDA_JOBS=4
          scripts/run_agda29_parallel_check.sh \
            DASHI/Physics/Closure/NSTriadKNHHBadDyadicThreeMechanismRecurrenceRound48Exact.agda \
            DASHI/Physics/Closure/NSTriadKNComSameAdjacentActiveRound47Exact.agda \
            DASHI/Physics/Closure/NSTriadKNFixedShiftCorrectionHeadroomRound54Exact.agda \
            DASHI/Physics/Closure/NSTriadKNABCConjecturalSourceRound58Exact.agda

      - name: Upload Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-abc-round58-agda-log
          path: agda-ns-abc-round58.log
          if-no-files-found: warn
