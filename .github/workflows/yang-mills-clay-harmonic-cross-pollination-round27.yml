name: Yang-Mills harmonic cross-pollination round 27

on:
  push:
    branches:
      - 'agent/ym-clay-harmonic-cross-pollination-round27'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check round twenty seven
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ym-round27-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_yang_mills_clay_harmonic_cross_pollination_round27.sh
          ) > ym-round27-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 400 ym-round27-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-round27-logs
          path: |
            ym-round27-check.log
            ym-round27-agda.log
          if-no-files-found: warn
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
