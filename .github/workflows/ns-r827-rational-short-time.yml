name: NS R827 rational short-time diagnostic
on:
  push:
    branches:
      - 'agent/ns-r655-remote-collar-transport'
    paths:
      - 'scripts/check_ns_r823_exact_sparse_reserve_witness.py'
      - 'scripts/check_ns_r827_rational_short_time_bound.py'
      - 'scripts/check_ns_r828_rational_345_fourier_witness.py'
      - 'scripts/check_ns_r829_rational_345_component_certificate.py'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345VectorWorkRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345EnergyRowsRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ReserveDecisionRound831Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ComponentScalarRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345SnapshotNormalizationRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ShortTimeRound830Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345RepositoryVectorBoundaryRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345DecisionMaxCutRound832Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ForcingRowsRound844Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345OrderedCellEvaluationRound843Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345OrderedCellsRound843Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345GeometryCalibrationRound842Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345DirectPhysicalSnapshotRound841Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650ProjectedNonlinearitySparseMaxCutRound840Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingAMaxCut20261002Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPostReserveMaxCut20261002Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingCDMaxCut20261002Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingABCDProofStatusExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345RealODEMaxCutRound833Exact.agda'
      - 'DASHI/Physics/Closure/NSABCDMaxCut20261002Exact.agda'
      - '.github/workflows/ns-r827-rational-short-time.yml'
  pull_request:
    paths:
      - 'scripts/check_ns_r823_exact_sparse_reserve_witness.py'
      - 'scripts/check_ns_r827_rational_short_time_bound.py'
      - 'scripts/check_ns_r828_rational_345_fourier_witness.py'
      - 'scripts/check_ns_r829_rational_345_component_certificate.py'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345VectorWorkRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345EnergyRowsRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ReserveDecisionRound831Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ComponentScalarRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345SnapshotNormalizationRound829Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650Rational345ShortTimeRound830Exact.agda'
      - '.github/workflows/ns-r827-rational-short-time.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rational-enclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact rational short-time arithmetic
        run: python scripts/check_ns_r827_rational_short_time_bound.py
      - name: Check independently evaluated Fourier seed
        run: |
          python -m pip install sympy
          python scripts/check_ns_r823_exact_sparse_reserve_witness.py

      - name: Check exact rational Pythagorean R828 seed and short-time enclosure
        run: python scripts/check_ns_r828_rational_345_fourier_witness.py
      - name: Check exact R829 component certificate
        run: python scripts/check_ns_r829_rational_345_component_certificate.py

  agda-r829-r830:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Kernel-check R829-R830 exact arithmetic owners
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-ns-r829-r830.log"
          export AGDA_JOBS=1
          scripts/run_agda29_parallel_check.sh \
            DASHI/Physics/Closure/NSTriadKNR650Rational345VectorWorkRound829Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345EnergyRowsRound829Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345RepositoryVectorBoundaryRound829Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345ComponentScalarRound829Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345SnapshotNormalizationRound829Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345ShortTimeRound830Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345ReserveDecisionRound831Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345RealODEMaxCutRound833Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345DecisionMaxCutRound832Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650ProjectedNonlinearitySparseMaxCutRound840Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345DirectPhysicalSnapshotRound841Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345GeometryCalibrationRound842Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345OrderedCellsRound843Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345OrderedCellEvaluationRound843Exact.agda \
            DASHI/Physics/Closure/NSTriadKNR650Rational345ForcingRowsRound844Exact.agda \
            DASHI/Physics/Closure/NSClayFacingAMaxCut20261002Exact.agda \
            DASHI/Physics/Closure/NSClayFacingBPostReserveMaxCut20261002Exact.agda \
            DASHI/Physics/Closure/NSClayFacingCDMaxCut20261002Exact.agda \
            DASHI/Physics/Closure/NSClayFacingABCDProofStatusExact.agda \
            DASHI/Physics/Closure/NSABCDMaxCut20261002Exact.agda
