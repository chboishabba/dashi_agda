name: One-shot repository history Manim render

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/repo-history-render-once.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out visualization branch
        uses: actions/checkout@v4
        with:
          ref: agent/temporal-repo-graph-visualization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config

      - name: Install Python renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "tree-sitter>=0.22,<0.23" \
            "tree-sitter-agda==1.3.3" \
            "networkx>=3.2" \
            "manim==0.21.0"
          python -m pip install -e tools/visualization/repo_history --no-deps
          python - <<'PY'
          import manim, tree_sitter, tree_sitter_agda
          print("manim", manim.__version__)
          print("tree_sitter", tree_sitter.__version__ if hasattr(tree_sitter, "__version__") else "ok")
          print("tree_sitter_agda", tree_sitter_agda.__file__)
          PY

      - name: Extract real branch/date history
        run: |
          dashi-repo-history extract . \
            --ref HEAD \
            --max-commits 120 \
            --history-only \
            -o /tmp/dashi-history.json

      - name: Render MP4 with Manim
        run: |
          dashi-repo-history render /tmp/dashi-history.json \
            --scene history \
            --quality -ql
          find tools/visualization/repo_history/media -type f -name '*.mp4' -print
          mkdir -p /tmp/rendered
          cp $(find tools/visualization/repo_history/media -type f -name '*.mp4' | head -1) \
            /tmp/rendered/dashi-repository-history-manim.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 /tmp/rendered/dashi-repository-history-manim.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: dashi-repository-history-manim
          path: /tmp/rendered/dashi-repository-history-manim.mp4
          if-no-files-found: error
