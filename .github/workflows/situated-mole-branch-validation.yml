name: Situated mole branch validation

on:
  push:
    branches:
      - agent/situated-mole-preservation-attribution

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run fail-closed projection audits
        id: static
        continue-on-error: true
        run: |
          python3 scripts/check_situated_mole_preservation.py
          python3 scripts/build_public_projection.py --self-test

      - uses: cachix/install-nix-action@v31
        id: nix
        continue-on-error: true
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Agda 2.9 shadow cache
        if: steps.nix.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: situated-mole-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
          restore-keys: |
            culinary-qualitative-agda29-${{ runner.os }}-86a1179-
            agda29-${{ runner.os }}-86a1179-

      - name: Check focused cuisine aggregate
        id: agda
        if: steps.nix.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-situated-mole.log"
          export AGDA_JOBS=1
          scripts/run_agda29_parallel_check.sh \
            DASHI/Culture/Cuisine/Everything.agda

      - name: Upload Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: situated-mole-agda-log
          path: agda-situated-mole*.log
          if-no-files-found: warn

      - name: Report validation result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          NIX_OUTCOME: ${{ steps.nix.outcome }}
          AGDA_OUTCOME: ${{ steps.agda.outcome }}
          VALIDATED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          body=$(cat <<EOF
          <!-- situated-mole-branch-validation -->
          ## Situated mole branch validation

          Validated commit: \`$VALIDATED_SHA\`

          - Static attribution/disclosure audit: **$STATIC_OUTCOME**
          - Nix toolchain setup: **$NIX_OUTCOME**
          - Pinned Agda 2.9 cuisine aggregate: **$AGDA_OUTCOME**

          This comment is generated by the temporary branch-only validation workflow. The workflow file will be removed after a conclusive result.
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/356/comments" -f body="$body"

      - name: Fail when validation is incomplete
        if: >-
          steps.static.outcome != 'success' ||
          steps.nix.outcome != 'success' ||
          steps.agda.outcome != 'success'
        run: exit 1
