name: Base369 symmetry wave round 9

on:
  push:
    branches: ['agent/monster-3b-central-character-inertia-round5']
  pull_request:
    branches:
      - 'master'
      - 'agent/monster-3b-orbifold-local-module-round4'
      - 'agent/monster-3b-central-character-inertia-round5'
    paths:
      - 'DASHI/Foundations/Base369SignedMembershipExact.agda'
      - 'DASHI/Foundations/Base369LayeredAttractorAndCoarseFineExact.agda'
      - 'DASHI/Foundations/Base369AddressSymmetryAndBranchGeometryExact.agda'
      - 'DASHI/Foundations/Base369ProcessBranchAttractorExact.agda'
      - 'DASHI/Foundations/Base369StepStateSymmetryQuotientExact.agda'
      - 'DASHI/Foundations/Base369WaveContinuousSymbolicCodingExact.agda'
      - 'DASHI/Foundations/Base369SymmetryWaveRound9Validation.agda'
      - 'DASHI/EverythingBase369SymmetryWaveRound9.agda'
      - 'DASHI/EverythingMonster3BCentralCharacterInertiaRound5.agda'
      - 'scripts/check_base369_symmetry_wave_round9.sh'
      - '.github/workflows/base369-symmetry-wave-round9.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check Base369 symmetry and wave tranche
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_base369_symmetry_wave_round9.sh
