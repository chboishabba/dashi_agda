name: SSP15 indexed weave modular round 4

on:
  push:
    branches: ['agent/ssp15-indexed-weave-modular-fibration-round4']
  pull_request:
    branches:
      - 'agent/ssp15-j-coarse-fine-round3'
      - 'master'
    paths:
      - 'DASHI/Core/IndexedWeaveHyperfabricExact.agda'
      - 'DASHI/Biology/SSPIndexedWeaveHyperfabricExact.agda'
      - 'DASHI/Biology/SSPHyperfibreLawfulUpgradeExact.agda'
      - 'DASHI/Biology/ModularCoarseFineAddressFibrationExact.agda'
      - 'DASHI/Biology/SSPIndexedWeaveModularIntegrationExact.agda'
      - 'DASHI/Biology/LayeredBindingSystemExact.agda'
      - 'DASHI/Computation/JacquardOperationalSemanticsExact.agda'
      - 'DASHI/Computation/JacquardHelicalWeaveBridgeExact.agda'
      - 'DASHI/Topology/HelicalWeaveMappingTorusExact.agda'
      - 'DASHI/Reasoning/DistributedBraidGluingExact.agda'
      - 'DASHI/Unified/ThreePhaseCrossPollinationExact.agda'
      - 'DASHI/Dynamics/KAMHypothesisCoreExact.agda'
      - 'DASHI/Physics/Moonshine/MoonshineTraceIndexedWeaveExact.agda'
      - 'DASHI/Physics/Moonshine/SSPMoonshineTraceFibreIntegrationExact.agda'
      - 'DASHI/Physics/Closure/KleinQuarticGenerationSymmetryExact.agda'
      - 'DASHI/Biology/SSP15IndexedWeaveModularRound4Validation.agda'
      - 'DASHI/EverythingSSP15IndexedWeaveModularRound4.agda'
      - 'scripts/classify_agda_substance.py'
      - 'scripts/check_ssp15_indexed_weave_modular_round4.sh'
      - 'Docs/support/reference/SSP15IndexedWeaveModularRound4.md'
      - '.github/workflows/ssp15-indexed-weave-modular-round4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check SSP15 indexed weave and modular fibration
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_ssp15_indexed_weave_modular_round4.sh
      - name: Upload substance audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssp15-indexed-weave-substance
          path: |
            artifacts/ssp15-indexed-weave-substance.json
            artifacts/cross-pollination-substance.json
          if-no-files-found: ignore
