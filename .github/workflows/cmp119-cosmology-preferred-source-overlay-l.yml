name: CMP119 cosmology preferred source overlay L

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyPartitionTailSourceScalarMarginExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPartitionTailSourceScalarMarginTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004LExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004LTest.agda'
      - '.github/workflows/cmp119-cosmology-preferred-source-overlay-l.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck normalization-free B2 and final source frontier
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for f in \
              DASHI/Physics/Foundations/CMP119CosmologyPartitionTailSourceScalarMarginExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPartitionTailSourceScalarMarginTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004LExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261004LTest.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$f"
            done
          '
