name: SSP15 modular character projection round 5

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - 'agent/ssp15-modular-character-projection-round5'
      - 'agent/ssp15-indexed-weave-modular-fibration-round4'
      - 'master'
    paths:
      - 'DASHI/Biology/CoarseFineTenSectorProjectionExact.agda'
      - 'DASHI/Biology/D4NineCellOrbitCompressionExact.agda'
      - 'DASHI/Biology/RelationalAppraisalPointedPhaseExact.agda'
      - 'DASHI/Moonshine/C3CoarseFineRatioTypingExact.agda'
      - 'DASHI/Moonshine/ModularCurveJFrickeInterfaceExact.agda'
      - 'DASHI/Moonshine/Monster3BC3RepresentationRingEvaluationExact.agda'
      - 'DASHI/Moonshine/MonsterOrderExponentCorrectionExact.agda'
      - 'DASHI/Moonshine/SSPModularCharacterProjectionRound5Validation.agda'
      - 'DASHI/EverythingSSPModularCharacterProjectionRound5.agda'
      - 'scripts/check_ssp15_modular_character_projection_round5.sh'
      - 'Docs/support/reference/SSP15ModularCharacterProjectionRound5.md'
      - '.github/workflows/ssp15-modular-character-projection-round5.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check modular character and coarse-fine projection
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_ssp15_modular_character_projection_round5.sh
      - name: Upload substance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssp15-modular-character-projection-round5
          path: artifacts/ssp15-modular-character-projection-round5.json
          if-no-files-found: ignore
