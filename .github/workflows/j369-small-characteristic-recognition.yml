      - 'DASHI/Core/ProvenancePreservingRecognitionFunctorExact.agda'
      - 'DASHI/JInvariantBase369CrossPollinationEverything.agda'
      - '.github/workflows/j369-small-characteristic-recognition.yml'

jobs:
  agda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck small-characteristic recognition frontier
        run: |
          nix develop --command agda -i . DASHI/Moonshine/OggSSPArithmeticIndependent369FrontierExact.agda
          nix develop --command agda -i . DASHI/JInvariantBase369CrossPollinationEverything.agda
