      - 'DASHI/JInvariantBase369CrossPollinationEverything.agda'
      - '.github/workflows/j369-small-characteristic-recognition.yml'
  pull_request:
    paths:
      - 'DASHI/Moonshine/OggSSPMonstrousExponent369GluingExact.agda'
      - 'DASHI/Moonshine/OggSSPSmallCharacteristicResidualGroupoidExact.agda'
      - 'DASHI/Moonshine/OggSSPSmallCharacteristicResidualCodecExact.agda'
      - 'DASHI/Moonshine/OggSSPP3F9FrobeniusCandidateNoGoExact.agda'
      - 'DASHI/Moonshine/OggSSPP2F4FrobeniusCandidateNoGoExact.agda'
      - 'DASHI/Moonshine/OggSSPP3F9ExtensionQuotientCandidateExact.agda'
