      - 'DASHI/Moonshine/OggSSPSmallCharacteristicResidualCodecExact.agda'
      - 'DASHI/Moonshine/OggSSPP3F9FrobeniusCandidateNoGoExact.agda'
      - 'DASHI/Moonshine/OggSSPP2F4FrobeniusCandidateNoGoExact.agda'
      - 'DASHI/Moonshine/OggSSPP3F9ExtensionQuotientCandidateExact.agda'
      - 'DASHI/Moonshine/OggSSPSmallCharacteristicArithmeticSourceSocketExact.agda'
      - 'DASHI/Moonshine/OggSSPArithmeticTo369RecognitionExact.agda'
      - 'DASHI/Moonshine/OggSSPP3Base369RecognitionExact.agda'
      - 'DASHI/Moonshine/OggSSPP2Base369RecognitionForkExact.agda'
      - 'DASHI/Moonshine/OggSSPP2ConsumerRelativeQuotientExact.agda'
      - 'DASHI/Moonshine/OggSSPArithmeticToIndependent369RecognitionExact.agda'
      - 'DASHI/Moonshine/OggSSPArithmeticIndependent369FrontierExact.agda'
      - 'DASHI/Moonshine/Base369P3ConstantTernaryActionGroupoidExact.agda'
      - 'DASHI/Moonshine/Base369P2FiveOrbitOrientationGroupoidsExact.agda'
