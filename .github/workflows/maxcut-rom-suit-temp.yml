name: ROM-to-suit maxcut temporary Agda verification

on:
  push:
    branches:
      - maxcut-rom-suit-closure
    paths:
      - 'DASHI/Interop/SeaMeInItPhysicalSuitClosure.agda'
      - 'DASHI/Interop/Everything.agda'
      - '.github/workflows/maxcut-rom-suit-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Type-check physical closure owner
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Interop/SeaMeInItPhysicalSuitClosure.agda
      - name: Type-check Interop aggregate
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Interop/Everything.agda
