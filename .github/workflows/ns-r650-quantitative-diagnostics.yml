name: NS R650 quantitative diagnostics

on:
  push:
    branches:
      - 'agent/ns-canonical-leaves-20260922'
      - 'agent/ns-r655-remote-collar-transport'
    paths:
      - 'scripts/ns_r650_quantitative_stress_scan.py'
      - 'scripts/check_ns_r650_quantitative_stress_scan.py'
      - 'scripts/ns_r406_physical_real_eval.py'
      - 'scripts/ns_r650_c2_physical_real_scan.py'
      - 'scripts/ns_r650_c1_physical_real_scan.py'
      - 'scripts/check_ns_r406_r650_physical_real.py'
      - 'scripts/tests/test_ns_r650_quantitative_stress_scan.py'
      - 'scripts/tests/test_ns_r406_physical_real_eval.py'
      - 'DASHI/Physics/Closure/NSTriadKNR650QuantitativeResearchStrategyRound651Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650C1R406DiagonalCouplingRound652Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650C2CoupledForcingSandwichRound653Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650C2CollarRemoteCoerciveFrontierRound654Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650LowCollarRemoteCrossReductionRound655Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650EuclideanCollarRefinementRound656Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarSpectralSignNoGoRound657Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarFixedOutputCarrierRound658Exact.agda'
      - '.github/workflows/ns-r650-quantitative-diagnostics.yml'
  pull_request:
    paths:
      - 'scripts/ns_r650_quantitative_stress_scan.py'
      - 'scripts/check_ns_r650_quantitative_stress_scan.py'
      - 'scripts/ns_r406_physical_real_eval.py'
      - 'scripts/ns_r650_c2_physical_real_scan.py'
      - 'scripts/ns_r650_c1_physical_real_scan.py'
      - 'scripts/check_ns_r406_r650_physical_real.py'
      - 'scripts/tests/test_ns_r650_quantitative_stress_scan.py'
      - 'scripts/tests/test_ns_r406_physical_real_eval.py'
      - 'DASHI/Physics/Closure/NSTriadKNR650QuantitativeResearchStrategyRound651Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650C1R406DiagonalCouplingRound652Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650C2CoupledForcingSandwichRound653Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650C2CollarRemoteCoerciveFrontierRound654Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650LowCollarRemoteCrossReductionRound655Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650EuclideanCollarRefinementRound656Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarSpectralSignNoGoRound657Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarFixedOutputCarrierRound658Exact.agda'
      - '.github/workflows/ns-r650-quantitative-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mode-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Compile quantitative scripts
        run: |
          python -m py_compile             scripts/ns_r650_quantitative_stress_scan.py             scripts/check_ns_r650_quantitative_stress_scan.py             scripts/ns_r406_physical_real_eval.py             scripts/ns_r650_c2_physical_real_scan.py             scripts/ns_r650_c1_physical_real_scan.py             scripts/check_ns_r406_r650_physical_real.py

      - name: Run deterministic R650 diagnostics
        run: |
          python -m pytest -q             scripts/tests/test_ns_r650_quantitative_stress_scan.py             scripts/tests/test_ns_r406_physical_real_eval.py

      - name: Install Agda semantic preflight
        run: python -m pip install -e tools/agda_preflight

      - name: Preflight R655-R658 analytic frontier
        run: |
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650LowCollarRemoteCrossReductionRound655Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650EuclideanCollarRefinementRound656Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarSpectralSignNoGoRound657Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarFixedOutputCarrierRound658Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPeriodicTwoInequalityMaxCutRound650Exact.agda
