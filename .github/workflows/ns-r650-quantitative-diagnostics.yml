      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarDivisionFreePairDifferenceRound660Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarSpacetimePairDifferenceRound661Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarPairDifferenceM2PaymentRound662Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarLiveM2PaymentRound663Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarRateWeightedWorkRound664Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarRateWeightedKernelRound665Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarExternalResidualFullSquareRound668Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarCanonicalExternalFullSquareRound669Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650WeightedExternalProductRuleCommutatorRound670Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650ExternalTotalizationNonzeroWeldRound671Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650ExternalTotalizationZeroBranchRound672Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650ExternalZeroBranchEliminationRound673Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarA3ComplementRound666Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarCauchyCouplingRound666Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNR650BadCollarMismatchNetworkSplitRound667Exact.agda'
      - '.github/workflows/ns-r650-quantitative-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mode-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Compile quantitative scripts
        run: |
          python -m py_compile             scripts/ns_r650_quantitative_stress_scan.py             scripts/check_ns_r650_quantitative_stress_scan.py             scripts/ns_r406_physical_real_eval.py             scripts/ns_r650_c2_physical_real_scan.py             scripts/ns_r650_c1_physical_real_scan.py             scripts/check_ns_r406_r650_physical_real.py

      - name: Run deterministic R650 diagnostics
        run: |
          python -m pytest -q             scripts/tests/test_ns_r650_quantitative_stress_scan.py             scripts/tests/test_ns_r406_physical_real_eval.py

      - name: Install Agda semantic preflight
        run: python -m pip install -e tools/agda_preflight

      - name: Preflight R655-R673 analytic frontier
        run: |
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650LowCollarRemoteCrossReductionRound655Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650EuclideanCollarRefinementRound656Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarSpectralSignNoGoRound657Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarFixedOutputCarrierRound658Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650C2CriticalEnergyGrowthNormalFormRound659Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarDivisionFreePairDifferenceRound660Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarSpacetimePairDifferenceRound661Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarPairDifferenceM2PaymentRound662Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarLiveM2PaymentRound663Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarRateWeightedWorkRound664Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarRateWeightedKernelRound665Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarExternalResidualFullSquareRound668Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarCanonicalExternalFullSquareRound669Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650WeightedExternalProductRuleCommutatorRound670Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650ExternalTotalizationNonzeroWeldRound671Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650ExternalTotalizationZeroBranchRound672Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650ExternalZeroBranchEliminationRound673Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarA3ComplementRound666Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarCauchyCouplingRound666Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNR650BadCollarMismatchNetworkSplitRound667Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPeriodicTwoInequalityMaxCutRound650Exact.agda
