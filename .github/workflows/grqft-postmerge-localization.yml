jobs:
  replay-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agda semantic preflight
        run: python3 -m pip install -e tools/agda_preflight
      - name: Replay diagnostics and run semantic preflight
        run: bash scripts/check_grqft_postmerge_localization.sh
