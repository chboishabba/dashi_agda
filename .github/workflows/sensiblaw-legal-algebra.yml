name: SensibLaw legal algebra

on:
  pull_request:
    paths:
      - 'DASHI/Core/BoundAcquisitionDemandExact.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Cognition/PNF/SensibLawAttributedSourcePNFCandidateWeldExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSourceRealisedLegalRuleExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawAtomicLegalTestBalancedTernaryExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSourceConditionedAtomicLegalImplicationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSourceConditionedApplicabilityViolationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSourceConditionedTypedLiabilityExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawSourceRuleDialectic369CrossPollinationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawConsumerSourceAcquisitionPriorityExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawConsumerSourcePrioritySchedulerBridgeExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawWrongTypeDownstreamPrimarySourceDisciplineExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawNSWCivilLiabilityActAtomicSourceAtlasExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawNSWVicariousLiabilityActAtomicSourceAtlasExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawNSWVicariousLiabilitySourceRealisationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawNSWVicariousLiabilityTypedProfilesExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenConsumerCollisionMissingCoordinateExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenQueryIndexedFactorisationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenSourceCorrectDutyRoutesExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenEdelman64WrongTypeSourceRealisationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenDownstreamElementSourceAtlasExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenAtomicSourceConditionedDutyBreachExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenNSWCLAAtomicApplicationExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenS43ASpecialStatutoryPowerAtomicExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenVicariousLiabilityFamilyAtomicExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenAtomic369AuditExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenConsumerRelativeSourceAcquisitionExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenEdelman64SemanticStateCompilerExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawCullenResidualAdmissionBidiExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawDutyPublicAuthoritySourceLineageGraphExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawDutySourceLineageRefinementCutRerunExact.agda'
      - 'DASHI/Cognition/PNF/SensibLawUniversalLegalAlgebraEverything.agda'
      - 'DASHI/Cognition/Everything.agda'
      - 'DASHI/Law/SensibLawParetoBoundSourceDemandExact.agda'
      - 'DASHI/Law/SensibLawParetoBoundProofDirectedCorpusSearchEverything.agda'
      - 'DASHI/Law/SensibLawPabaiDefeaterRefinementRerunExact.agda'
      - 'DASHI/Law/Everything.agda'
      - '.github/workflows/sensiblaw-legal-algebra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensiblaw-legal-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Type-check generic bound acquisition carrier
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Core/BoundAcquisitionDemandExact.agda

      - name: Type-check atomic source-conditioned legal spine
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Cognition/PNF/SensibLawAttributedSourcePNFCandidateWeldExact.agda
          DASHI/Cognition/PNF/SensibLawSourceRealisedLegalRuleExact.agda
          DASHI/Cognition/PNF/SensibLawAtomicLegalTestBalancedTernaryExact.agda
          DASHI/Cognition/PNF/SensibLawSourceConditionedAtomicLegalImplicationExact.agda
          DASHI/Cognition/PNF/SensibLawSourceConditionedApplicabilityViolationExact.agda
          DASHI/Cognition/PNF/SensibLawSourceConditionedTypedLiabilityExact.agda
          DASHI/Cognition/PNF/SensibLawSourceRuleDialectic369CrossPollinationExact.agda
          DASHI/Cognition/PNF/SensibLawConsumerSourceAcquisitionPriorityExact.agda
          DASHI/Cognition/PNF/SensibLawConsumerSourcePrioritySchedulerBridgeExact.agda
          DASHI/Cognition/PNF/SensibLawWrongTypeDownstreamPrimarySourceDisciplineExact.agda
          DASHI/Cognition/PNF/SensibLawNSWCivilLiabilityActAtomicSourceAtlasExact.agda
          DASHI/Cognition/PNF/SensibLawNSWVicariousLiabilityActAtomicSourceAtlasExact.agda
          DASHI/Cognition/PNF/SensibLawNSWVicariousLiabilitySourceRealisationExact.agda
          DASHI/Cognition/PNF/SensibLawNSWVicariousLiabilityTypedProfilesExact.agda

      - name: Type-check Cullen introspective and atomic source-conditioned spine
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Cognition/PNF/SensibLawCullenConsumerCollisionMissingCoordinateExact.agda
          DASHI/Cognition/PNF/SensibLawCullenQueryIndexedFactorisationExact.agda
          DASHI/Cognition/PNF/SensibLawCullenSourceCorrectDutyRoutesExact.agda
          DASHI/Cognition/PNF/SensibLawCullenEdelman64WrongTypeSourceRealisationExact.agda
          DASHI/Cognition/PNF/SensibLawCullenDownstreamElementSourceAtlasExact.agda
          DASHI/Cognition/PNF/SensibLawCullenAtomicSourceConditionedDutyBreachExact.agda
          DASHI/Cognition/PNF/SensibLawCullenNSWCLAAtomicApplicationExact.agda
          DASHI/Cognition/PNF/SensibLawCullenS43ASpecialStatutoryPowerAtomicExact.agda
          DASHI/Cognition/PNF/SensibLawCullenVicariousLiabilityFamilyAtomicExact.agda
          DASHI/Cognition/PNF/SensibLawCullenAtomic369AuditExact.agda
          DASHI/Cognition/PNF/SensibLawCullenConsumerRelativeSourceAcquisitionExact.agda
          DASHI/Cognition/PNF/SensibLawCullenEdelman64SemanticStateCompilerExact.agda
          DASHI/Cognition/PNF/SensibLawCullenResidualAdmissionBidiExact.agda

      - name: Type-check source-owned duty lineage
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Cognition/PNF/SensibLawDutyPublicAuthoritySourceLineageGraphExact.agda
          DASHI/Cognition/PNF/SensibLawDutySourceLineageRefinementCutRerunExact.agda

      - name: Type-check bound proof-directed source demand
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Law/SensibLawParetoBoundSourceDemandExact.agda
          DASHI/Law/SensibLawParetoBoundProofDirectedCorpusSearchEverything.agda

      - name: Type-check universal legal algebra aggregate
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Cognition/PNF/SensibLawUniversalLegalAlgebraEverything.agda

      - name: Type-check Law aggregate
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Law/Everything.agda
