name: Admissible consumer MDL hyperfabric Agda

on:
  pull_request:
    paths:
      - 'DASHI/Core/AdmissibleTransitionHyperfabricExact.agda'
      - 'DASHI/Core/AdmissibleConsumerMDLHyperfabricExact.agda'
      - 'DASHI/Core/AdmissibleMDLTransitionValidation.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Chemistry/AdmissibleReactionTransitionBridgeExact.agda'
      - 'DASHI/Chemistry/Everything.agda'
      - 'DASHI/Dynamics/LogisticAdmissibleTransitionBridgeExact.agda'
      - 'DASHI/Planning/PlanningAdmissibleTransitionBridgeExact.agda'
      - 'DASHI/Programmes/RTXAdmissibleConsumerMDLBridgeExact.agda'
      - 'DASHI/Programmes/Everything.agda'
      - 'DASHI/Environment/LESAdmissibleTransitionMDLCrossPollinationExact.agda'
      - 'DASHI/Environment/LESSituatedSocioEcologicalHyperfabricValidation.agda'
      - 'scripts/check_admissible_consumer_mdl_hyperfabric.sh'
      - '.github/workflows/admissible-consumer-mdl-hyperfabric-agda.yml'
  workflow_dispatch:

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      AGDA_BIN: agda
      DASHI_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Materialize Agda source dependencies
        run: git submodule update --init --depth 1 DCHoTT-Agda cubical
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run admissible consumer MDL audit
        run: nix develop .# --command bash scripts/check_admissible_consumer_mdl_hyperfabric.sh
