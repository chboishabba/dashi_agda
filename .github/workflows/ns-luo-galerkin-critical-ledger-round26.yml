name: NS Luo Galerkin critical ledger round 26

on:
  push:
    branches:
      - 'agent/ns-luo-galerkin-critical-ledger-round26'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'DASHI/Papers/NavierStokes/**'
      - 'docs/ns-clay-contract/**'
      - 'scripts/ns_round26_finite_tax_adversarial.py'
      - 'scripts/check_ns_luo_galerkin_critical_ledger_round26.sh'
      - 'scripts/check_ns_luo_physical_carrier_support_round25.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/ns-luo-galerkin-critical-ledger-round26.yml'
  pull_request:
    branches:
      - 'agent/ns-luo-physical-carrier-support-round25'
      - 'agent/ns-luo-galerkin-critical-ledger-round26'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'DASHI/Papers/NavierStokes/**'
      - 'docs/ns-clay-contract/**'
      - 'scripts/ns_round26_finite_tax_adversarial.py'
      - 'scripts/check_ns_luo_galerkin_critical_ledger_round26.sh'
      - 'scripts/check_ns_luo_physical_carrier_support_round25.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/ns-luo-galerkin-critical-ledger-round26.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Galerkin critical ledger and tax ownership
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-round26-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_ns_luo_galerkin_critical_ledger_round26.sh
          ) > ns-round26-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 900 ns-round26-check.log
          exit 0

      - name: Upload logs and regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round26-logs
          path: |
            ns-round26-check.log
            ns-round26-agda.log
            ns-round26-finite-regression.json
          if-no-files-found: warn

      - name: Publish checker status
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          state=success
          description='NS round 26 Agda and finite regressions passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='NS round 26 Agda or finite regressions failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='ns-round26-critical-ledger-agda' \
            -f description="$description" \
            || echo "status publication skipped" >&2

      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
