name: Kant Lacan Zizek Pathologic PNF formalism

on:
  pull_request:
    paths:
      - 'DASHI/Core/TypedDependencyCore.agda'
      - 'DASHI/Foundations/CantorDiagonalCore.agda'
      - 'DASHI/Foundations/StageAtlasZeroToTwelve.agda'
      - 'DASHI/Foundations/StageZeroToTwelveTransitionCore.agda'
      - 'DASHI/Foundations/JPlusOneScaleBridge.agda'
      - 'DASHI/Foundations/JPlusOneMarkedUnitExtension.agda'
      - 'DASHI/Foundations/MarkedUnitExtensionCore.agda'
      - 'DASHI/Foundations/StageCantorScaleRecursion.agda'
      - 'DASHI/Combinatorics/MemeDiagonal.agda'
      - 'DASHI/Geometry/TwistedCycleOrientationCover.agda'
      - 'DASHI/Dynamics/LogisticDecimalPNFBridge.agda'
      - 'DASHI/Cognition/PNF/KantApperceptionLearningBridge.agda'
      - 'DASHI/Reasoning/**'
      - 'DASHI/EverythingZizekPNFExtension.agda'
      - 'DASHI/EverythingKantLacanPNFExtension.agda'
      - 'DASHI/EverythingPathologicTypedDependencyExtension.agda'
      - 'docs/pathologic_typed_dependency_formalism.md'
      - 'scripts/check_zizek_pnf_formalism.sh'
      - 'scripts/check_kant_lacan_extension.sh'
      - 'scripts/check_pathologic_typed_dependency.sh'
      - '.github/workflows/zizek-pnf-formalism.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check constructive, critical, discourse, stage, dependency and authority boundaries
        run: nix develop --command bash scripts/check_pathologic_typed_dependency.sh
