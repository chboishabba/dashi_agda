name: NS Luo physical carrier support round 25

on:
  push:
    branches:
      - 'agent/ns-luo-physical-carrier-support-round25'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'DASHI/Papers/NavierStokes/**'
      - 'docs/ns-clay-contract/**'
      - 'scripts/check_ns_luo_physical_carrier_support_round25.sh'
      - 'scripts/check_ns_luo_claim_corpus_highest_alpha_round24.sh'
      - 'scripts/check_ns_luo_clay_contract_round23.sh'
      - 'scripts/check_ns_luo_galerkin_defect_diffusion_round22.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/ns-luo-physical-carrier-support-round25.yml'
  pull_request:
    branches:
      - 'agent/ns-luo-claim-corpus-highest-alpha-round24'
      - 'agent/ns-luo-physical-carrier-support-round25'
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'DASHI/Papers/NavierStokes/**'
      - 'docs/ns-clay-contract/**'
      - 'scripts/check_ns_luo_physical_carrier_support_round25.sh'
      - 'scripts/check_ns_luo_claim_corpus_highest_alpha_round24.sh'
      - 'scripts/check_ns_luo_clay_contract_round23.sh'
      - 'scripts/check_ns_luo_galerkin_defect_diffusion_round22.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/ns-luo-physical-carrier-support-round25.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check physical carrier and five-class support
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-round25-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_ns_luo_physical_carrier_support_round25.sh
          ) > ns-round25-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 700 ns-round25-check.log
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-round25-logs
          path: |
            ns-round25-check.log
            ns-round25-agda.log
          if-no-files-found: warn

      - name: Publish checker status
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ steps.check.outputs.status }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          state=success
          description='NS round 25 Agda checker passed'
          if [[ "$CHECK_STATUS" != '0' ]]; then
            state=failure
            description='NS round 25 Agda checker failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='ns-round25-physical-carrier-agda' \
            -f description="$description" \
            || echo "status publication skipped" >&2

      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
