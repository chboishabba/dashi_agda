name: unification-round5

on:
  push:
    branches:
      - 'agent/unification-round5-constants-dimension-matter-cosmology'
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/**'
      - 'Docs/support/reference/UnificationRound5ConstantsDimensionMatterCosmology.md'
      - 'scripts/check_unification_round5.sh'
      - '.github/workflows/unification-round5.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check unification round five
        run: bash scripts/check_unification_round5.sh
      - name: Report successful kernel check
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 401 --repo chboishabba/dashi_agda --body
          'Round 5 Agda 2.9 kernel check passed on ${{ github.sha }} (workflow run ${{ github.run_id }}).'
      - name: Report failed kernel check
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 401 --repo chboishabba/dashi_agda --body
          'Round 5 Agda 2.9 kernel check failed on ${{ github.sha }} (workflow run ${{ github.run_id }}).'
