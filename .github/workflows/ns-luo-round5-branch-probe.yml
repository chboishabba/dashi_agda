name: NS Luo round 5 branch probe

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ns-luo-round5-branch-probe.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe-round5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ns-luo-hard-math-round5

      - name: Publish run id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/376/comments" \
            -f body="Round-five branch probe: ${GITHUB_RUN_ID}; checked head: $(git rev-parse HEAD)"

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check round-five root with pinned Agda 2.9
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-luo-round5-check.log"
            export AGDA_JOBS=4
            scripts/check_ns_luo_hard_math_round5.sh
          ) > ns-luo-round5-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 260 ns-luo-round5-check.log
          exit 0

      - name: Package exact checked source
        if: always()
        shell: bash
        run: git archive --format=tar.gz --output=dashi-round5-source.tar.gz HEAD

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-luo-round5-probe-${{ github.run_id }}
          path: |
            ns-luo-round5-check.log
            dashi-round5-source.tar.gz
          if-no-files-found: error

      - name: Fail on Agda error
        if: steps.check.outputs.status != '0'
        run: exit 1
