name: JCoarse/JFine criticality and recharting Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Core/DecimalResidualRefinementExact.agda'
      - 'DASHI/Core/FiniteBranchingCriticalityExact.agda'
      - 'DASHI/Core/LogisticFoldCriticalityExact.agda'
      - 'DASHI/Core/NumberRoleProvenanceAtlasExact.agda'
      - 'DASHI/Core/IntersectionalNonFactorability.agda'
      - 'DASHI/Core/IntersectionalConstraintGeometryExact.agda'
      - 'DASHI/Core/FeministRechartingSourceBridgeExact.agda'
      - 'DASHI/Core/DialecticalStageSpectrumExact.agda'
      - 'DASHI/Core/ContextualDialecticRoleExact.agda'
      - 'DASHI/Core/EpistemicSuspensionExact.agda'
      - 'DASHI/Core/StageTransitionBarrierExact.agda'
      - 'DASHI/Core/DialecticStageMotifBridgeExact.agda'
      - 'DASHI/Core/DialecticOriginSourceAtlasExact.agda'
      - 'DASHI/Core/ExceptionalSignalLatticeExact.agda'
      - 'DASHI/Core/Base369DialecticRoleBoundaryExact.agda'
      - 'DASHI/Core/ContradictionPreservingReasoningPipelineExact.agda'
      - 'DASHI/Core/RelationalEpistemicProcessSourceBridgeExact.agda'
      - 'DASHI/Core/DeclaredRealizedIntegrityResidualExact.agda'
      - 'DASHI/Core/SolisSituatedIntegrityBridgeExact.agda'
      - 'DASHI/Biology/JCoarseFineBranchingCriticalityExact.agda'
      - 'DASHI/Core/Everything.agda'
      - 'DASHI/Biology/DomainEverything.agda'
      - '.github/workflows/jcoarse-fine-criticality.yml'

concurrency:
  group: jcoarse-fine-criticality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: jcoarse-fine-criticality-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Trust scan new theorem tranche
        shell: bash
        run: |
          set -euo pipefail
          files=(
            DASHI/Core/DecimalResidualRefinementExact.agda
            DASHI/Core/FiniteBranchingCriticalityExact.agda
            DASHI/Core/LogisticFoldCriticalityExact.agda
            DASHI/Core/NumberRoleProvenanceAtlasExact.agda
            DASHI/Core/IntersectionalConstraintGeometryExact.agda
            DASHI/Core/FeministRechartingSourceBridgeExact.agda
            DASHI/Core/DialecticalStageSpectrumExact.agda
            DASHI/Core/ContextualDialecticRoleExact.agda
            DASHI/Core/EpistemicSuspensionExact.agda
            DASHI/Core/StageTransitionBarrierExact.agda
            DASHI/Core/DialecticStageMotifBridgeExact.agda
            DASHI/Core/DialecticOriginSourceAtlasExact.agda
            DASHI/Core/ExceptionalSignalLatticeExact.agda
            DASHI/Core/Base369DialecticRoleBoundaryExact.agda
            DASHI/Core/ContradictionPreservingReasoningPipelineExact.agda
            DASHI/Core/RelationalEpistemicProcessSourceBridgeExact.agda
            DASHI/Core/DeclaredRealizedIntegrityResidualExact.agda
            DASHI/Core/SolisSituatedIntegrityBridgeExact.agda
            DASHI/Biology/JCoarseFineBranchingCriticalityExact.agda
          )
          if grep -nE '\b(postulate|{-# OPTIONS --allow-unsolved-metas #-}|sorry|admit)\b' "${files[@]}"; then
            echo 'Forbidden trust-boundary token found in new tranche.' >&2
            exit 1
          fi
      - name: Check focused tranche with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-jcoarse-fine-criticality-check.log"
            export AGDA_JOBS=2
            targets=(
              DASHI/Core/DecimalResidualRefinementExact.agda
              DASHI/Core/FiniteBranchingCriticalityExact.agda
              DASHI/Core/LogisticFoldCriticalityExact.agda
              DASHI/Core/IntersectionalNonFactorability.agda
              DASHI/Core/IntersectionalConstraintGeometryExact.agda
              DASHI/Core/FeministRechartingSourceBridgeExact.agda
              DASHI/Core/NumberRoleProvenanceAtlasExact.agda
              DASHI/Core/DialecticalStageSpectrumExact.agda
              DASHI/Core/ContextualDialecticRoleExact.agda
              DASHI/Core/EpistemicSuspensionExact.agda
              DASHI/Core/StageTransitionBarrierExact.agda
              DASHI/Core/DialecticStageMotifBridgeExact.agda
              DASHI/Core/DialecticOriginSourceAtlasExact.agda
              DASHI/Core/ExceptionalSignalLatticeExact.agda
              DASHI/Core/Base369DialecticRoleBoundaryExact.agda
              DASHI/Core/ContradictionPreservingReasoningPipelineExact.agda
              DASHI/Core/RelationalEpistemicProcessSourceBridgeExact.agda
              DASHI/Core/DeclaredRealizedIntegrityResidualExact.agda
              DASHI/Core/SolisSituatedIntegrityBridgeExact.agda
              DASHI/Biology/JCoarseFineBranchingCriticalityExact.agda
              DASHI/Core/Everything.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-jcoarse-fine-criticality-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 340 agda-jcoarse-fine-criticality-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcoarse-fine-criticality-agda-log
          path: agda-jcoarse-fine-criticality-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
