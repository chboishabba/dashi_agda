name: CMP119 cosmology preferred source overlay U

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3DistinctF2MarkedSourceSameCarrierExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3DistinctF2MarkedSourceSameCarrierTest.agda'
      - 'DASHI/Physics/YangMills/YangMillsSourceFirstCurvatureChoiceRound523Exact.agda'
      - 'DASHI/Physics/YangMills/YangMillsSourceFirstCurvatureChoiceRound523Test.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3SourceFirstF2Exact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3SourceFirstF2Test.agda'
      - 'DASHI/Physics/YangMills/BalabanCompactHaarExactMassQuadratureExact.agda'
      - 'DASHI/Physics/YangMills/BalabanCompactHaarExactMassQuadratureTest.agda'
      - 'DASHI/Physics/YangMills/BalabanCompactHaarMassWeightedOscillationExact.agda'
      - 'DASHI/Physics/YangMills/BalabanCompactHaarMassWeightedOscillationTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3MassWeightedPhysicalHaarCompilerExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3MassWeightedPhysicalHaarCompilerTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3ExactMassOscillationOnlyExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3ExactMassOscillationOnlyTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3SelectedStateMassWeightedHaarExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyP3SelectedStateMassWeightedHaarTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005TExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005TTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005UExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005UTest.agda'
      - '.github/workflows/cmp119-cosmology-preferred-source-overlay-t.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-cosmology-preferred-source-overlay-u-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck overlay U source-construction frontier
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for f in \
              DASHI/Physics/Foundations/CMP119CosmologyP3DistinctF2MarkedSourceSameCarrierExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3DistinctF2MarkedSourceSameCarrierTest.agda \
              DASHI/Physics/YangMills/YangMillsSourceFirstCurvatureChoiceRound523Exact.agda \
              DASHI/Physics/YangMills/YangMillsSourceFirstCurvatureChoiceRound523Test.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3SourceFirstF2Exact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3SourceFirstF2Test.agda \
              DASHI/Physics/YangMills/BalabanCompactHaarExactMassQuadratureExact.agda \
              DASHI/Physics/YangMills/BalabanCompactHaarExactMassQuadratureTest.agda \
              DASHI/Physics/YangMills/BalabanCompactHaarMassWeightedOscillationExact.agda \
              DASHI/Physics/YangMills/BalabanCompactHaarMassWeightedOscillationTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3MassWeightedPhysicalHaarCompilerExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3MassWeightedPhysicalHaarCompilerTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3ExactMassOscillationOnlyExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3ExactMassOscillationOnlyTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3SelectedStateMassWeightedHaarExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyP3SelectedStateMassWeightedHaarTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005TExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005TTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005UExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyPreferredSourcePhysicsMaxCut20261005UTest.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$f"
            done
          '
