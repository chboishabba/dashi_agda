name: Stage Euler tree complement round 2

on:
  pull_request:
    branches:
      - 'agent/sporadic-stage-symmetry-euler-totalisation'
      - 'agent/stage-euler-tree-complement-round2'
    paths:
      - 'DASHI/Foundations/BalancedTernaryResidualTreeExact.agda'
      - 'DASHI/Foundations/StageProfile369SignedDistanceExact.agda'
      - 'DASHI/Foundations/ConstrainedFrameEulerSelectorExact.agda'
      - 'DASHI/Moonshine/DepthTwoNonaryStageTenComplementExact.agda'
      - 'DASHI/Biology/StageEulerTreeComplementRound2Validation.agda'
      - 'Docs/support/reference/StageEulerTreeComplementRound2.md'
      - 'scripts/check_stage_euler_tree_complement_round2.sh'
      - '.github/workflows/stage-euler-tree-complement-round2.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check retained stage tree and Euler selector
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE='github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin'
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_stage_euler_tree_complement_round2.sh
