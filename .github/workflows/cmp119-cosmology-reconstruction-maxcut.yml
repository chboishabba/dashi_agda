name: CMP119 cosmology reconstruction max-cut

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyR109SelectedStressCylinderPresentationExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyR109SelectedStressCylinderPresentationTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologySelectedR109FiniteExpectationFromSelectedPresentationExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologySelectedR109FiniteExpectationFromSelectedPresentationTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyE1LinearityDoesNotForceB4CovarianceExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyE1LinearityDoesNotForceB4CovarianceTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsEvidenceLevelsExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsEvidenceLevelsTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsReceiptResolutionExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsReceiptResolutionTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003EExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003ETest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyLatestParetoFrontierExact.agda'
      - '.github/workflows/cmp119-cosmology-reconstruction-maxcut.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-cosmology-reconstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck reconstruction max-cut
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for source in \
              DASHI/Physics/Foundations/CMP119CosmologyR109SelectedStressCylinderPresentationExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyR109SelectedStressCylinderPresentationTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologySelectedR109FiniteExpectationFromSelectedPresentationExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologySelectedR109FiniteExpectationFromSelectedPresentationTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyE1LinearityDoesNotForceB4CovarianceExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyE1LinearityDoesNotForceB4CovarianceTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsTypedReceiptsTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsEvidenceLevelsExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsEvidenceLevelsTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsReceiptResolutionExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyFiveSourcePhysicsReceiptResolutionTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003EExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003ETest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyLatestParetoFrontierExact.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$source"
            done
          '
