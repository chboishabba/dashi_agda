name: monster-c3-ssp42

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'DASHI/Biology/BalancedTernaryHarmonicCarrierExact.agda'
      - 'DASHI/Moonshine/C3FourierConjugationExact.agda'
      - 'DASHI/Moonshine/C3CyclotomicRealDescentExact.agda'
      - 'DASHI/Moonshine/C3CyclotomicAmplitudeAlgebraExact.agda'
      - 'DASHI/Moonshine/C3RiemannConjugationBridgeExact.agda'
      - 'DASHI/Moonshine/SSP15AffineC3TranslationExact.agda'
      - 'DASHI/Moonshine/SSP15CMModSevenExact.agda'
      - 'DASHI/Moonshine/SSP15PhaseClosure54Exact.agda'
      - 'DASHI/Moonshine/MonsterReducedNonaryBoundaryExact.agda'
      - 'DASHI/Moonshine/MonsterC3SSP42HighestAlphaValidation.agda'
      - 'DASHI/Moonshine/Monster3BHighestAlphaValidation.agda'
      - 'DASHI/Moonshine/Monster3BNormalizerBridge.agda'
      - 'DASHI/Moonshine/Monster3BFiniteHeisenbergGeneratorsExact.agda'
      - 'DASHI/Moonshine/Monster3BFiniteStoneVonNeumannFrontierExact.agda'
      - 'DASHI/Moonshine/Base369AppraisalFibreHeisenbergCarrierBidiExact.agda'
      - 'DASHI/Moonshine/Base369PeriodicHeisenbergFibreEquivarianceExact.agda'
      - 'DASHI/Moonshine/Base369ZetaHeisenbergFiftyFourCarrierExact.agda'
      - 'DASHI/Moonshine/Base369MonsterTwoComponentCompletionBidiExact.agda'
      - 'DASHI/Moonshine/Base369Monster3BRepresentationBidiSearchExact.agda'
      - 'DASHI/Base369ZetaHeisenbergFiftyFourValidation.agda'
      - 'DASHI/Base369MonsterTwoComponentCompletionValidation.agda'
      - 'DASHI/Base369Ternary27StratifiedFibreEverything.agda'
      - 'scripts/check_monster_3b_normalizer_dashboard.sh'
      - 'scripts/monster_3b_normalizer_restriction.g'
      - 'scripts/render_monster_3b_certificate.py'
      - '.github/workflows/monster-c3-ssp42.yml'

concurrency:
  group: monster-c3-ssp42-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Agda and standard library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.3'
          agda-stdlib-version: '2.1'

      - name: Install GAP CTblLib
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
          gap -q -c 'if LoadPackage("ctbllib") <> true then Error("CTblLib unavailable"); fi; Print("CTblLib loaded\n"); QUIT_GAP(0);'

      - name: Reject trust escapes in tranche
        run: |
          sources=(
            DASHI/Biology/BalancedTernaryHarmonicCarrierExact.agda
            DASHI/Moonshine/C3FourierConjugationExact.agda
            DASHI/Moonshine/C3CyclotomicRealDescentExact.agda
            DASHI/Moonshine/C3CyclotomicAmplitudeAlgebraExact.agda
            DASHI/Moonshine/C3RiemannConjugationBridgeExact.agda
            DASHI/Moonshine/SSP15AffineC3TranslationExact.agda
            DASHI/Moonshine/SSP15CMModSevenExact.agda
            DASHI/Moonshine/SSP15PhaseClosure54Exact.agda
            DASHI/Moonshine/MonsterReducedNonaryBoundaryExact.agda
            DASHI/Moonshine/MonsterC3SSP42HighestAlphaValidation.agda
            DASHI/Moonshine/Monster3BHighestAlphaValidation.agda
            DASHI/Moonshine/Monster3BFiniteStoneVonNeumannFrontierExact.agda
            DASHI/Moonshine/Base369Monster3BRepresentationBidiSearchExact.agda
            DASHI/Moonshine/Base369ZetaHeisenbergFiftyFourCarrierExact.agda
          )
          for source in "${sources[@]}"; do
            if grep -nE '(^|[[:space:]])postulate([[:space:]]|$)|allow-unsolved-metas|TERMINATING|NO_POSITIVITY_CHECK' "$source"; then
              echo "forbidden trust escape in $source" >&2
              exit 1
            fi
          done

      - name: Replay fail-closed Monster to MN3B restriction certificate
        run: |
          bash scripts/check_monster_3b_normalizer_dashboard.sh
          test -s build/monster_3b_normalizer_restriction.json
          test -s build/generated/DASHI/Moonshine/Generated/Monster3BRestrictionCertificate.agda

      - name: Kernel-check generated restriction certificate
        run: |
          agda -i . -i build/generated -l standard-library \
            build/generated/DASHI/Moonshine/Generated/Monster3BRestrictionCertificate.agda

      - name: Kernel-check focused C3 SSP42 root
        run: |
          agda --version
          agda -i . -l standard-library \
            DASHI/Moonshine/MonsterC3SSP42HighestAlphaValidation.agda

      - name: Kernel-check cumulative Monster 3B root
        run: |
          agda -i . -l standard-library \
            DASHI/Moonshine/Monster3BHighestAlphaValidation.agda

      - name: Kernel-check Base369 Monster frontier aggregate
        run: |
          agda -i . -l standard-library \
            DASHI/Base369Ternary27StratifiedFibreEverything.agda
