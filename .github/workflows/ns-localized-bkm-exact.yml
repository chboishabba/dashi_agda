name: NS exact localized BKM tranche

on:
  workflow_dispatch:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNPeriodicLittlewoodPaleyBonyExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNProfileDepthGeometryCutoffIndexedExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNResidueScaleOperatorGapExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLuoExplicitCutoffLocalizedCriterionExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLittlewoodPaleyInfrastructureInventory.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLocalizedBKMSourceAndTargetAudit.agda'
      - 'DASHI/Physics/Closure/NSTriadKNBlockerToLocalizedBKMCompatibility.agda'
      - 'DASHI/Physics/Closure/NSTriadKNAnalyticBlockerAuthorityAudit.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLocalizedBKMRouteIntegration.agda'
      - 'scripts/check_ns_localized_bkm_route.py'
      - 'scripts/check_ns_localized_bkm_exact.sh'
      - '.github/workflows/ns-localized-bkm-exact.yml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches:
      - master
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNPeriodicLittlewoodPaleyBonyExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNProfileDepthGeometryCutoffIndexedExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNResidueScaleOperatorGapExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLuoExplicitCutoffLocalizedCriterionExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLittlewoodPaleyInfrastructureInventory.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLocalizedBKMSourceAndTargetAudit.agda'
      - 'DASHI/Physics/Closure/NSTriadKNBlockerToLocalizedBKMCompatibility.agda'
      - 'DASHI/Physics/Closure/NSTriadKNAnalyticBlockerAuthorityAudit.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLocalizedBKMRouteIntegration.agda'
      - 'scripts/check_ns_localized_bkm_route.py'
      - 'scripts/check_ns_localized_bkm_exact.sh'
      - '.github/workflows/ns-localized-bkm-exact.yml'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run focused exact localized-BKM checker
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            export AGDA_BIN="$(command -v agda)"
            export AGDA_ARGS="-i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library"
            bash scripts/check_ns_localized_bkm_exact.sh
          '
