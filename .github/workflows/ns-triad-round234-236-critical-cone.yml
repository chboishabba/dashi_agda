name: NS Round234-247 critical cone profiles trajectory extraction and bidi weld

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNDeepFarLowCriticalShoulderRound234Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNDeepHHNullCriticalShoulderRound235Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNParabolicCriticalFrequencyConeRound236Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNMixedHelicityScaleNormalizedDefectRound237Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNProfileExtractionCircularityRound238Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNOrthogonalProfileMixedDefectRound239Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalNSGalerkinTrajectoryRound240Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNDefectFailureForcesCriticalBarrierRound241Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNCriticalFirstHitExtractionRound242Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFirstHitBidiPhysicalWeldRound243Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNHelicitySignHOneIsometryRound244Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNCanonicalG2NumericDissipationRound245Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalNormalizedCurlHOneModeIsometryRound246Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalNormalizedCurlHOneFiniteSumRound247Exact.agda'
      - 'scripts/audit_opposite_helicity_symbol_round232.py'
      - 'scripts/audit_mixed_helicity_forcing_work_round233.py'
      - '.github/workflows/ns-triad-round234-236-critical-cone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-cone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Audit Round232 opposite-helicity symbol regimes
        run: python3 scripts/audit_opposite_helicity_symbol_round232.py

      - name: Audit Round233 physical forcing-work sign and homogeneity
        run: python3 scripts/audit_mixed_helicity_forcing_work_round233.py

      - name: Type-check Round234 deep far-low threshold
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNDeepFarLowCriticalShoulderRound234Exact.agda

      - name: Type-check Round235 deep HH null threshold
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNDeepHHNullCriticalShoulderRound235Exact.agda

      - name: Type-check Round236 parabolic critical cone
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNParabolicCriticalFrequencyConeRound236Exact.agda

      - name: Type-check Round237 scale-normalized defect
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNMixedHelicityScaleNormalizedDefectRound237Exact.agda

      - name: Type-check Round238 cutoff-family extraction boundary
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNProfileExtractionCircularityRound238Exact.agda

      - name: Type-check Round239 orthogonal profile defect reduction
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNOrthogonalProfileMixedDefectRound239Exact.agda

      - name: Type-check Round240 physical NS Galerkin trajectory authority
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNPhysicalNSGalerkinTrajectoryRound240Exact.agda

      - name: Type-check Round241 defect to critical-barrier compiler
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNDefectFailureForcesCriticalBarrierRound241Exact.agda

      - name: Type-check Round242 first-hit extraction compiler
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNCriticalFirstHitExtractionRound242Exact.agda

      - name: Type-check Round243 same-trajectory bidi physical weld
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNFirstHitBidiPhysicalWeldRound243Exact.agda

      - name: Type-check Round244 helicity-sign H1 isometry reduction
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNHelicitySignHOneIsometryRound244Exact.agda

      - name: Type-check Round245 canonical G2 numeric dissipation projection
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNCanonicalG2NumericDissipationRound245Exact.agda

      - name: Type-check Round246 literal normalized-curl H1 mode isometry
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNPhysicalNormalizedCurlHOneModeIsometryRound246Exact.agda

      - name: Type-check Round247 literal Galerkin finite-sum H1 isometry
        run: >-
          nix develop .# --command bash scripts/run_agda29_parallel_check.sh
          DASHI/Physics/Closure/NSTriadKNPhysicalNormalizedCurlHOneFiniteSumRound247Exact.agda
