name: conscious-access-round5

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'DASHI/Biology/**'
      - 'DASHI/Physics/Foundations/**'
      - 'DASHI/Physics/DarkSector/**'
      - 'DASHI/Unified/Everything.agda'
      - 'Docs/support/reference/ConsciousAccessRound5DASHIYijingMoonshine.md'
      - 'Docs/support/reference/DASHIYijingRelationalOperators.md'
      - 'Docs/support/reference/ConsciousAccessRound5SSPWeaveCompletion.md'
      - 'Docs/support/reference/UnificationRound5ConstantsDimensionMatterCosmology.md'
      - 'Docs/support/reference/DarkSectorColliderFormalism.md'
      - 'scripts/check_conscious_access_round5.sh'
      - 'scripts/check_unification_round5.sh'
      - '.github/workflows/conscious-access-round5.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Resolve repository Agda toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-link --print-out-paths .#agda-with-dashi-deps)"
          agda_bin="$package/bin/agda"
          test -x "$agda_bin"
          "$agda_bin" --version
          printf 'AGDA_BIN=%s\n' "$agda_bin" >> "$GITHUB_ENV"
      - name: Check complete stacked round five
        env:
          DASHI_REPO_ROOT: ${{ github.workspace }}
          DASHI_AGDA29_EPHEMERAL: '1'
          AGDA_LOG_PATH: ${{ runner.temp }}/unification-round5-agda.log
        run: bash scripts/check_unification_round5.sh
      - name: Report kernel-check status to the active pull request
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$GITHUB_REF_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            echo "No open pull request found for $GITHUB_REF_NAME; skipping comment."
            exit 0
          fi

          gh pr comment "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Combined Round 5 repository-flake Agda kernel check ${CHECK_STATUS} on ${GITHUB_SHA} (workflow run ${GITHUB_RUN_ID})."
