name: conscious-access-round5

on:
  push:
    branches:
      - 'agent/conscious-access-round5-dashi-yijing-moonshine'
  pull_request:
    paths:
      - 'DASHI/Biology/DASHIYijingTernaryDivinationExact.agda'
      - 'DASHI/Biology/DASHIYijingRelationalOperatorsExact.agda'
      - 'DASHI/Biology/OrientedZeroWaveTransitionExact.agda'
      - 'DASHI/Biology/DialecticalSheetSpiralExact.agda'
      - 'DASHI/Biology/TriadicBraidDialecticExact.agda'
      - 'DASHI/Biology/TernaryHypercubeHyperfabricExact.agda'
      - 'DASHI/Biology/TernaryCubeStrataExact.agda'
      - 'DASHI/Biology/TernaryCantorWheelDiffusionExact.agda'
      - 'DASHI/Biology/TernaryMonsterSymmetryCandidateExact.agda'
      - 'DASHI/Biology/FRACTRANSSPTransitionExact.agda'
      - 'DASHI/Biology/SpectralGrokkingLatticeExact.agda'
      - 'DASHI/Biology/ClassicalQuantumLikeCoarseGrainingExact.agda'
      - 'DASHI/Biology/AssociativeDivinationPNFExact.agda'
      - 'DASHI/Biology/NaturalSystemsHyperfabricExact.agda'
      - 'DASHI/Biology/NeuralRepresentationLaplacianExact.agda'
      - 'DASHI/Biology/NSYMDialecticalFieldBridgeExact.agda'
      - 'DASHI/Biology/DASHIQuantumLikeEntropyOscillatorExact.agda'
      - 'DASHI/Biology/ConsciousAccessRound5SourceAtlas.agda'
      - 'DASHI/Biology/ConsciousAccessRound5ExtendedSourceAtlas.agda'
      - 'DASHI/Biology/ConsciousAccessRound5FullBoundary.agda'
      - 'DASHI/Biology/ConsciousAccessRound5Regression.agda'
      - 'DASHI/Biology/Everything.agda'
      - 'Docs/support/reference/ConsciousAccessRound5DASHIYijingMoonshine.md'
      - 'Docs/support/reference/DASHIYijingRelationalOperators.md'
      - 'scripts/check_conscious_access_round5.sh'
      - '.github/workflows/conscious-access-round5.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Resolve repository Agda toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-link --print-out-paths .#agda-with-dashi-deps)"
          agda_bin="$package/bin/agda"
          test -x "$agda_bin"
          "$agda_bin" --version
          printf 'AGDA_BIN=%s\n' "$agda_bin" >> "$GITHUB_ENV"
      - name: Check conscious-access round five
        env:
          DASHI_REPO_ROOT: ${{ github.workspace }}
          DASHI_AGDA29_EPHEMERAL: '1'
          AGDA_LOG_PATH: ${{ runner.temp }}/conscious-access-round5-agda.log
        run: bash scripts/check_conscious_access_round5.sh
      - name: Report successful kernel check
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 399 --repo chboishabba/dashi_agda --body
          'Round 5 repository-flake Agda kernel check passed on ${{ github.sha }} (workflow run ${{ github.run_id }}).'
      - name: Report failed kernel check
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 399 --repo chboishabba/dashi_agda --body
          'Round 5 repository-flake Agda kernel check failed on ${{ github.sha }} (workflow run ${{ github.run_id }}).'
