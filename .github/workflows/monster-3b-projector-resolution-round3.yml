name: Monster 3B projector resolution round 3

on:
  pull_request:
    branches:
      - 'agent/monster-3b-projector-core-round2'
      - 'agent/monster-3b-projector-resolution-round3'
    paths:
      - 'DASHI/Moonshine/Monster3BModelProjectorResolutionExact.agda'
      - 'DASHI/Moonshine/Monster3BModelStoneVonNeumannRecognitionExact.agda'
      - 'DASHI/Moonshine/Monster3BProjectorResolutionRound3Validation.agda'
      - 'Docs/support/reference/Monster3BProjectorResolutionRound3.md'
      - 'scripts/check_monster_3b_projector_resolution_round3.sh'
      - '.github/workflows/monster-3b-projector-resolution-round3.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check projector resolution
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE='github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin'
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_monster_3b_projector_resolution_round3.sh
