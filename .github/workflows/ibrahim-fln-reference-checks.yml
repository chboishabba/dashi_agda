name: Ibrahim FLN reference checks

on:
  pull_request:
    paths:
      - 'DASHI/Wikimedia/IbrahimFiniteOrbitRevisionWeldExact.agda'
      - 'DASHI/Wikimedia/IbrahimMultilingualHyperfabricWeldExact.agda'
      - 'DASHI/Wikimedia/IbrahimPublishedSevenNodeFunnelExact.agda'
      - 'DASHI/Wikimedia/IbrahimFiniteFigureBasinCertificateExact.agda'
      - 'DASHI/Wikimedia/IbrahimITIRConsumerRepairExact.agda'
      - 'scripts/ibrahim_fln_reference_analysis.py'
      - 'scripts/ibrahim_fln_certificates.py'
      - 'tests/test_ibrahim_fln_reference_analysis.py'
      - 'tests/test_ibrahim_fln_certificates.py'
      - 'tests/test_ibrahim_fln_certificate_cli.py'
      - 'scripts/check_ibrahim_fln_maxcut.sh'
      - '.github/workflows/ibrahim-fln-reference-checks.yml'
  workflow_dispatch:

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Reference tests only (NOT Agda or historical replay)
        env:
          IBRAHIM_SKIP_AGDA: '1'
        run: bash scripts/check_ibrahim_fln_maxcut.sh
