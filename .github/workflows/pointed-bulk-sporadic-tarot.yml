name: pointed-bulk-sporadic-tarot

on:
  push:
    branches:
      - 'agent/moonshine-pointed-bulk-sporadic-tarot'
      - 'agent/jmd-sporadic-tarot-v2-correspondence'
      - 'agent/sporadic-stage-symmetry-euler-totalisation'
  pull_request:
    paths:
      - 'DASHI/Biology/PointedTernaryBulkExact.agda'
      - 'DASHI/Biology/DecimalTenTernaryPresentationExact.agda'
      - 'DASHI/Biology/ThreeSixNineMoonshineScaleExact.agda'
      - 'DASHI/Biology/ReducedFiftyThreeOrbitCandidateExact.agda'
      - 'DASHI/Biology/SporadicTarotDependencyExact.agda'
      - 'DASHI/Biology/TarotCarrierExact.agda'
      - 'DASHI/Biology/JMDSporadicTarotV2CorrespondenceExact.agda'
      - 'DASHI/Biology/JMDSporadicTarotOrdinalTotalisationExact.agda'
      - 'DASHI/Biology/SporadicStageSymmetryTarotRegression.agda'
      - 'DASHI/Biology/PointedBulkReducedMoonshineBoundary.agda'
      - 'DASHI/Biology/PointedBulkSporadicTarotSourceAtlas.agda'
      - 'DASHI/Biology/PointedBulkSporadicTarotEverything.agda'
      - 'DASHI/Foundations/BalancedTernaryStageSymmetryExact.agda'
      - 'DASHI/Foundations/StageSymmetryCarrierTowerExact.agda'
      - 'DASHI/Foundations/DialecticSheetFrameSelectorExact.agda'
      - 'DASHI/Foundations/SecondRevolutionJankoTarotExact.agda'
      - 'DASHI/Moonshine/EulerMonsterMeaningSeparationExact.agda'
      - 'DASHI/Governance/CabarlahTraumaProjectionBridgeExact.agda'
      - 'DASHI/Governance/Everything.agda'
      - 'DASHI/PointedBulkSporadicTarotCabarlahBoundary.agda'
      - 'DASHI/PointedBulkSporadicTarotCabarlahRegression.agda'
      - 'DASHI/EverythingPointedBulkSporadicTarot.agda'
      - 'Docs/support/reference/PointedBulkSporadicTarotCabarlah.md'
      - 'Docs/support/reference/ThreeSixNineMoonshineScaleLedger.md'
      - 'Docs/support/reference/SporadicStageSymmetryEulerTotalisation.md'
      - 'scripts/check_pointed_bulk_sporadic_tarot.sh'
      - '.github/workflows/pointed-bulk-sporadic-tarot.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Resolve repository Agda toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-link --print-out-paths .#agda-with-dashi-deps)"
          agda_bin="$package/bin/agda"
          test -x "$agda_bin"
          "$agda_bin" --version
          printf 'AGDA_BIN=%s\n' "$agda_bin" >> "$GITHUB_ENV"
      - name: Check pointed bulk, totalised Tarot, stage symmetry, and Euler boundaries
        env:
          DASHI_REPO_ROOT: ${{ github.workspace }}
          DASHI_AGDA29_EPHEMERAL: '1'
          AGDA_LOG_PATH: ${{ runner.temp }}/pointed-bulk-sporadic-tarot-agda.log
        run: bash scripts/check_pointed_bulk_sporadic_tarot.sh
      - name: Report kernel-check status to the active pull request
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$GITHUB_REF_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            echo "No open pull request found for $GITHUB_REF_NAME; skipping comment."
            exit 0
          fi

          gh pr comment "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Pointed bulk / totalised sporadic Tarot / stage-symmetry Agda kernel check ${CHECK_STATUS} on ${GITHUB_SHA} (workflow run ${GITHUB_RUN_ID})."
