name: Yang-Mills P33 hard mathematics

on:
  push:
    branches:
      - 'agent/ym-round12-p33-hard-math'
      - 'agent/ym-round13-five-local-physical-bounds'
    paths:
      - 'DASHI/Physics/YangMills/BalabanPath4GeneratedLDLCertificate.agda'
      - 'DASHI/Physics/YangMills/BalabanP33*.agda'
      - 'scripts/check_yang_mills_p33_hard_math.sh'
      - 'scripts/check_yang_mills_p33_five_local_bounds.sh'
      - '.github/workflows/yang-mills-p33-hard-math.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanPath4GeneratedLDLCertificate.agda'
      - 'DASHI/Physics/YangMills/BalabanP33*.agda'
      - 'scripts/check_yang_mills_p33_hard_math.sh'
      - 'scripts/check_yang_mills_p33_five_local_bounds.sh'
      - '.github/workflows/yang-mills-p33-hard-math.yml'
  workflow_dispatch:

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
      - name: Check exact LDL, SU2 geometry, Wilson/CMP109 channels and decay reductions
        run: |
          nix develop --command bash scripts/check_yang_mills_p33_hard_math.sh
          nix develop --command bash scripts/check_yang_mills_p33_five_local_bounds.sh
