      - 'DASHI/Physics/YangMills/BalabanP33RationalInverseNorm32Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33WeightedNeumannHalfContractionExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33FiveLocalPhysicalBoundsValidation.agda'
      - 'scripts/check_yang_mills_p33_hard_math.sh'
      - 'scripts/check_yang_mills_p33_five_local_bounds.sh'
      - '.github/workflows/yang-mills-p33-hard-math.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanPath4GeneratedLDLCertificate.agda'
      - 'DASHI/Physics/YangMills/BalabanP33FiniteSignedRemainderSummationExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33Path4SignedRemainderCoercivityExact.agda'
