name: proof-experiment-action-369-agda

on:
  pull_request:
    paths:
      - 'DASHI/Core/HistoryIndexedProofExperimentActionLoopExact.agda'
      - 'DASHI/Core/ProofExperimentAction369IntegrationExact.agda'
      - 'DASHI/Core/ProofExperimentAction369Validation.agda'
      - 'DASHI/Moonshine/Base369OODAProofExperimentObserverExact.agda'
      - 'DASHI/Moonshine/Monster196830RegularBulkResidualControlPatternExact.agda'
      - 'DASHI/EverythingProofExperimentAction369.agda'
      - 'scripts/check_proof_experiment_action_369.sh'
      - 'DASHI/Physics/Foundations/TorqueTrialectic369Exact.agda'
      - 'DASHI/Physics/Foundations/TorqueTrialectic369Regression.agda'
      - 'DASHI/Physics/Foundations/ResonantFlightPhaseCoupledPowerExact.agda'
      - 'DASHI/Physics/Textile/BendingTorsionTextileLawExact.agda'
      - 'DASHI/Physics/POAMSScientificMechanismBoundaryExact.agda'
      - '.github/workflows/proof-experiment-action-369-agda.yml'
  push:
    branches:
      - agent/ooda-proof-experiment-196830
      - chatgpt/torque-trialectic-maxcut
    paths:
      - 'DASHI/Core/HistoryIndexedProofExperimentActionLoopExact.agda'
      - 'DASHI/Core/ProofExperimentAction369IntegrationExact.agda'
      - 'DASHI/Core/ProofExperimentAction369Validation.agda'
      - 'DASHI/Moonshine/Base369OODAProofExperimentObserverExact.agda'
      - 'DASHI/Moonshine/Monster196830RegularBulkResidualControlPatternExact.agda'
      - 'DASHI/EverythingProofExperimentAction369.agda'
      - 'scripts/check_proof_experiment_action_369.sh'
      - 'DASHI/Physics/Foundations/TorqueTrialectic369Exact.agda'
      - 'DASHI/Physics/Foundations/TorqueTrialectic369Regression.agda'
      - 'DASHI/Physics/Foundations/ResonantFlightPhaseCoupledPowerExact.agda'
      - 'DASHI/Physics/Textile/BendingTorsionTextileLawExact.agda'
      - 'DASHI/Physics/POAMSScientificMechanismBoundaryExact.agda'
      - '.github/workflows/proof-experiment-action-369-agda.yml'

jobs:
  agda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install -y agda agda-stdlib
      - name: Check torque trialectic tranche
        run: |
          agda -i . -i /usr/share/agda-stdlib DASHI/Physics/Foundations/TorqueTrialectic369Regression.agda
          agda -i . -i /usr/share/agda-stdlib DASHI/Physics/Textile/BendingTorsionTextileLawExact.agda
          agda -i . -i /usr/share/agda-stdlib DASHI/Physics/Foundations/ResonantFlightPhaseCoupledPowerExact.agda
          agda -i . -i /usr/share/agda-stdlib DASHI/Physics/POAMSScientificMechanismBoundaryExact.agda
