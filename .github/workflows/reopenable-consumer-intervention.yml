name: Reopenable consumer intervention Agda check

on:
  pull_request:
    paths:
      - 'DASHI/Core/ActiveInformationDualEffectBridgeExact.agda'
      - 'DASHI/Core/ConsumerIndexedGovernedTransitionExact.agda'
      - 'DASHI/Core/SelectiveAuthorityCertificateExact.agda'
      - 'DASHI/Core/AdaptiveFidelityConsumerMarginExact.agda'
      - 'DASHI/Core/TypedEvidenceDependencyExact.agda'
      - 'DASHI/Core/DualEffectInformationActionExact.agda'
      - 'DASHI/Core/CompositionalComplianceExact.agda'
      - 'DASHI/Core/CounterexampleGuidedConsumerRefinementExact.agda'
      - 'DASHI/Core/IndexedRobustnessExact.agda'
      - 'DASHI/Core/ReopenableConsumerInterventionCrossDomainRegression.agda'
      - 'DASHI/Geometry/AdaptiveWearableCompilerExact.agda'
      - 'DASHI/Environment/LESResearchCrossPollinationRound5Exact.agda'
      - 'DASHI/ReopenableConsumerInterventionCrossDomainEverything.agda'
      - 'Docs/ReopenableConsumerInterventionRound4.md'
      - '.github/workflows/reopenable-consumer-intervention.yml'

concurrency:
  group: reopenable-consumer-intervention-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: reopenable-consumer-intervention-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Check cross-domain governed kernel with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache"
            export DASHI_STATUS_DIR="$RUNNER_TEMP/dashi-status"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-reopenable-consumer-intervention.log"
            export AGDA_JOBS=2
            mkdir -p "$XDG_CACHE_HOME" "$DASHI_STATUS_DIR"
            targets=(
              DASHI/ReopenableConsumerInterventionCrossDomainEverything.agda
              DASHI/Core/ReopenableConsumerInterventionCrossDomainRegression.agda
              DASHI/Environment/LESResearchCrossPollinationRound5Exact.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-reopenable-consumer-intervention.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 agda-reopenable-consumer-intervention.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reopenable-consumer-intervention-agda-log
          path: agda-reopenable-consumer-intervention.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
