      - 'DASHI/Moonshine/JInvariant369CanonicalInterpretationExact.agda'
      - 'DASHI/Moonshine/MonsterAtlas6561X8RecognitionObligationExact.agda'
      - 'DASHI/Moonshine/JInvariant369NeutralCuspRelationCrossPollinationExact.agda'
      - 'DASHI/Moonshine/JInvariant369SSP15SignedFRACTRANBranchExact.agda'
      - 'DASHI/Moonshine/JInvariant369OggAddressSSP15NoGoExact.agda'
      - 'DASHI/Moonshine/JInvariant369SSP15PrimeInternalFibreExact.agda'
      - 'DASHI/Moonshine/JInvariant369CanonicalJointReflectionMinimalExact.agda'
      - 'DASHI/Moonshine/JInvariantSmithChartActionSeparationExact.agda'
      - 'DASHI/Moonshine/JInvariantSmithChartMobiusMatrixBridgeExact.agda'
      - 'DASHI/Biology/NonaryCompletionPhaseQuotientExact.agda'
      - 'DASHI/Biology/D4IrrepFiniteFrickeEquivariantExact.agda'
      - 'DASHI/Moonshine/JInvariant369SSPLevelDihedralIntertwinerExact.agda'
      - 'scripts/check_j369_c6_ten_rank_weight12.sh'
      - '.github/workflows/j369-c6-ten-rank-weight12.yml'
  pull_request:
    paths:
      - 'DASHI/Moonshine/JInvariant369C6TenRankWeightTwelveCrossPollinationExact.agda'
      - 'DASHI/Moonshine/JInvariant369CanonicalInterpretationExact.agda'
