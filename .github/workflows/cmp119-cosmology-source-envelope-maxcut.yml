name: CMP119 cosmology source-envelope max-cut

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223R136SourceEnvelopeUpperExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223R136SourceEnvelopeUpperTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailToSourceEnvelopeExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailToSourceEnvelopeTest.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003DExact.agda'
      - 'DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003DTest.agda'
      - '.github/workflows/cmp119-cosmology-source-envelope-maxcut.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp119-cosmology-source-envelope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Typecheck source-envelope max-cut
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            for source in \
              DASHI/Physics/Foundations/CMP119CosmologyEq223R136SourceEnvelopeUpperExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyEq223R136SourceEnvelopeUpperTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailToSourceEnvelopeExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyEq223DirectTailToSourceEnvelopeTest.agda \
              DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003DExact.agda \
              DASHI/Physics/Foundations/CMP119CosmologyParetoMaxCut20261003DTest.agda
            do
              agda -i . -i DCHoTT-Agda -i vendor/bishop -i cubical -l standard-library "$source"
            done
          '
