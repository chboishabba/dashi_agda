name: Numeric PNF hyperfabric Agda check

on:
  push:
    paths:
      - 'DASHI/Cognition/PNF/ComplexityArithmetic.agda'
      - 'DASHI/Cognition/PNF/NumericAuthority.agda'
      - 'DASHI/Cognition/PNF/SpacyNumericProjection.agda'
      - 'DASHI/Cognition/PNF/NumericHyperfabric.agda'
      - 'DASHI/Cognition/PNF/DemandResolutionState.agda'
      - 'DASHI/Cognition/PNF/AdjacentReconciliationWork.agda'
      - 'DASHI/Cognition/PNF/OrderedWorldParserLookahead.agda'
      - 'DASHI/Cognition/PNF/WorkConservingPersistence.agda'
      - 'DASHI/Cognition/PNF/BoundedMDLPlanner.agda'
      - 'DASHI/Cognition/PNF/BoundedInterfaceSketch.agda'
      - 'DASHI/Cognition/PNF/ParentInterfaceReduction.agda'
      - 'DASHI/Cognition/PNF/SparseFibredFrontier.agda'
      - 'DASHI/Cognition/PNF/SparseFrontierConstraints.agda'
      - 'DASHI/Cognition/PNF/DirectDemandLookup.agda'
      - 'DASHI/Cognition/PNF/SetBasedDemandPlanning.agda'
      - 'DASHI/Cognition/PNF/NumericPNFCompilation.agda'
      - 'DASHI/Cognition/PNF/NumericPNFRegression.agda'
      - 'DASHI/Cognition/PNF/NumericPNFHyperfabricEverything.agda'
      - 'Docs/NumericPNFHyperfabricFormalisation.md'
      - 'Docs/WorkConservingPersistenceFormalisation.md'
      - 'Docs/SparseFibredFrontierFormalisation.md'
      - 'Docs/SparseFrontierConstraintsFormalisation.md'
      - '.github/workflows/numeric-pnf-hyperfabric.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'DASHI/Cognition/PNF/ComplexityArithmetic.agda'
      - 'DASHI/Cognition/PNF/NumericAuthority.agda'
      - 'DASHI/Cognition/PNF/SpacyNumericProjection.agda'
      - 'DASHI/Cognition/PNF/NumericHyperfabric.agda'
      - 'DASHI/Cognition/PNF/DemandResolutionState.agda'
      - 'DASHI/Cognition/PNF/AdjacentReconciliationWork.agda'
      - 'DASHI/Cognition/PNF/OrderedWorldParserLookahead.agda'
      - 'DASHI/Cognition/PNF/WorkConservingPersistence.agda'
      - 'DASHI/Cognition/PNF/BoundedMDLPlanner.agda'
      - 'DASHI/Cognition/PNF/BoundedInterfaceSketch.agda'
      - 'DASHI/Cognition/PNF/ParentInterfaceReduction.agda'
      - 'DASHI/Cognition/PNF/SparseFibredFrontier.agda'
      - 'DASHI/Cognition/PNF/SparseFrontierConstraints.agda'
      - 'DASHI/Cognition/PNF/DirectDemandLookup.agda'
      - 'DASHI/Cognition/PNF/SetBasedDemandPlanning.agda'
      - 'DASHI/Cognition/PNF/NumericPNFCompilation.agda'
      - 'DASHI/Cognition/PNF/NumericPNFRegression.agda'
      - 'DASHI/Cognition/PNF/NumericPNFHyperfabricEverything.agda'
      - 'Docs/NumericPNFHyperfabricFormalisation.md'
      - 'Docs/WorkConservingPersistenceFormalisation.md'
      - 'Docs/SparseFibredFrontierFormalisation.md'
      - 'Docs/SparseFrontierConstraintsFormalisation.md'
      - '.github/workflows/numeric-pnf-hyperfabric.yml'

concurrency:
  group: numeric-pnf-hyperfabric-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: numeric-pnf-hyperfabric-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Check numeric PNF hyperfabric with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-numeric-pnf-hyperfabric-check.log"
            export AGDA_JOBS=2
            scripts/run_agda29_parallel_check.sh \
              DASHI/Cognition/PNF/NumericPNFHyperfabricEverything.agda
          ) > agda-numeric-pnf-hyperfabric-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 240 agda-numeric-pnf-hyperfabric-check.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-pnf-hyperfabric-agda-log
          path: agda-numeric-pnf-hyperfabric-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
