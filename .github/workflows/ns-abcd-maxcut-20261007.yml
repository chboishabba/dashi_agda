  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Agda semantic preflight
        run: python -m pip install -e tools/agda_preflight
      - name: Preflight ABCD max-cut owners
        run: |
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingAPureAnalysisFrontier20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingAPureAnalysisFrontier20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingPrincipalDefectRows20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingPrincipalDefectRows20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingLiteralCompanion20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingLiteralCompanion20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingPrincipalHalf20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingPrincipalHalf20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingDefectBipartite20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalTouchingDefectBipartite20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingBPureAnalysisFrontier20261005Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSOpenAI2026ReleasedCDCurrentHeadAudit20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSOpenAI2026ReleasedCDCurrentHeadAudit20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingCDPublicationAuditLedger20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingCDPublicationAuditLedger20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingCDReleasedAuditFrontier20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingCDReleasedAuditFrontier20261007Test.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSABCDMaxCut20261007Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSABCDMaxCut20261007Test.agda
