name: NS positive B max-cut

on:
  push:
    branches:
      - 'agent/ns-r655-remote-collar-transport'
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionLiteralPairExtractionMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionLiteralPairExtractionMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalDeepBlocksFromLiteralRowsMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalDeepBlocksFromLiteralRowsMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406DirectCompanionMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406DirectCompanionMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406HomogeneityBoundaryMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406HomogeneityBoundaryMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPositiveMaxCut20261004Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPositiveMaxCut20261004Test.agda'
      - '.github/workflows/ns-b-positive-maxcut.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionLiteralPairExtractionMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionLiteralPairExtractionMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalDeepBlocksFromLiteralRowsMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalDeepBlocksFromLiteralRowsMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406DirectCompanionMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406DirectCompanionMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406HomogeneityBoundaryMaxCutExact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406HomogeneityBoundaryMaxCutTest.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPositiveMaxCut20261004Exact.agda'
      - 'DASHI/Physics/Closure/NSClayFacingBPositiveMaxCut20261004Test.agda'
      - '.github/workflows/ns-b-positive-maxcut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Agda semantic preflight
        run: python -m pip install -e tools/agda_preflight

      - name: Preflight positive B max-cut owners
        run: |
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionLiteralPairExtractionMaxCutExact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionLiteralPairExtractionMaxCutTest.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalDeepBlocksFromLiteralRowsMaxCutExact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNFixedOutputPhysicalDeepBlocksFromLiteralRowsMaxCutTest.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406DirectCompanionMaxCutExact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406DirectCompanionMaxCutTest.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406HomogeneityBoundaryMaxCutExact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSTriadKNPhysicalCriticalRegionR406HomogeneityBoundaryMaxCutTest.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingBPositiveMaxCut20261004Exact.agda
          dashi-agda-preflight --root . DASHI/Physics/Closure/NSClayFacingBPositiveMaxCut20261004Test.agda
