name: NS Luo physical analytic frontier

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNLuo*.agda'
      - 'scripts/check_ns_luo_physical_analytic_frontier.sh'
      - 'scripts/check_ns_luo_full_lemma_inventory.py'
      - 'scripts/check_ns_luo_submission_audit.sh'
      - 'scripts/generate_ns_luo_submission_audit.py'
      - 'scripts/test_generate_ns_luo_submission_audit.py'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ns-luo-physical-analytic-frontier.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNLuo*.agda'
      - 'scripts/check_ns_luo_physical_analytic_frontier.sh'
      - 'scripts/check_ns_luo_full_lemma_inventory.py'
      - 'scripts/check_ns_luo_submission_audit.sh'
      - 'scripts/generate_ns_luo_submission_audit.py'
      - 'scripts/test_generate_ns_luo_submission_audit.py'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ns-luo-physical-analytic-frontier.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda-29:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check physical-analytic Luo frontier
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            export AGDA_BIN="$(command -v agda)"
            export AGDA_ARGS="-i . -i DCHoTT-Agda -i cubical -l standard-library"
            export AGDA_JOBS="$(nproc)"
            bash scripts/check_ns_luo_physical_analytic_frontier.sh
          '
