name: Gate 4 physical round 6

on:
  workflow_dispatch:
  push:
    branches:
      - agent/balaban-primary-averaging-qstar
    paths:
      - 'DASHI/Analysis/**'
      - 'DASHI/Foundations/**'
      - 'DASHI/Physics/YangMills/**'
      - 'scripts/check_gate4_physical_round*.sh'
      - 'scripts/check_gate4_seven_group.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/gate4-physical-round6.yml'

permissions:
  contents: read

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-agda-29:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run focused Gate-4 round-six checker
        shell: bash
        run: |
          nix develop --accept-flake-config --command bash -lc '
            set -euo pipefail
            export AGDA_BIN="$(command -v agda)"
            export AGDA_ARGS="-i . -i DCHoTT-Agda -i cubical -l standard-library"
            export AGDA_JOBS="$(nproc)"
            bash scripts/check_gate4_physical_round6.sh
          '
