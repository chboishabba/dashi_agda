name: Yang-Mills Clay round 37 repair selector

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - 'agent/ym-clay-alpha-round36-finite-atom-selector'
      - 'agent/ym-clay-alpha-round37-repair-selector'
    paths:
      - 'DASHI/Physics/YangMills/BalabanSelectedPlaquetteLinearRepairModelExact.agda'
      - 'DASHI/Physics/YangMills/BalabanSelectedPlaquetteResidualBudgetRound37Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33WilsonGateSignatureRound37Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanClayHighestAlphaRound37RepairSelectorValidation.agda'
      - 'Docs/support/reference/YangMillsSelectedVariationRepairRound37.md'
      - 'scripts/check_yang_mills_clay_highest_alpha_round37.sh'
      - '.github/workflows/yang-mills-clay-round37-repair-selector.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check selected-variation repair tranche
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE='github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin'
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_yang_mills_clay_highest_alpha_round37.sh
