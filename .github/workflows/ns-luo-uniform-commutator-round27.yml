name: NS Luo uniform commutator round 27

on:
  push:
    branches: ['agent/ns-luo-uniform-commutator-round27']
  pull_request:
    branches:
      - 'agent/ns-luo-galerkin-critical-ledger-round26'
      - 'agent/ns-luo-uniform-commutator-round27'
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNLuoUniformCommutatorTaxRound27Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLuoFiniteEnergyContinuationRound27Exact.agda'
      - 'DASHI/Physics/Closure/NSTriadKNLuoUniformCommutatorRound27Validation.agda'
      - 'docs/ns-clay-contract/uniform-commutator-round27.md'
      - 'scripts/check_ns_luo_uniform_commutator_round27.sh'
      - '.github/workflows/ns-luo-uniform-commutator-round27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check uniform commutator tranche
        shell: bash
        run: |
          set -euo pipefail
          export AGDA_FLAKE='github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin'
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          export AGDA_JOBS=4
          bash scripts/check_ns_luo_uniform_commutator_round27.sh
