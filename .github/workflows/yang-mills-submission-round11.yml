name: Yang-Mills submission round eleven

on:
  push:
    branches:
      - 'agent/ym-round11-ratio-p06-audit'
    paths:
      - 'DASHI/Physics/YangMills/BalabanBishopConfiguredTermIdentificationExact.agda'
      - 'DASHI/Physics/YangMills/BalabanStepVPolynomialDirectRatioExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP06PeriodicSupportBridgeExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP06DiameterComplexityAuditExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33P10Gate4DependencySpineExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsSubmissionRound11*.agda'
      - 'DASHI/Physics/YangMills/BalabanClayConstructiveProducerSubmissionRound11Advance.agda'
      - 'scripts/check_yang_mills_submission_round11.sh'
      - '.github/workflows/yang-mills-submission-round11.yml'
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanBishopConfiguredTermIdentificationExact.agda'
      - 'DASHI/Physics/YangMills/BalabanStepVPolynomialDirectRatioExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP06PeriodicSupportBridgeExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP06DiameterComplexityAuditExact.agda'
      - 'DASHI/Physics/YangMills/BalabanP33P10Gate4DependencySpineExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsSubmissionRound11*.agda'
      - 'DASHI/Physics/YangMills/BalabanClayConstructiveProducerSubmissionRound11Advance.agda'
      - 'scripts/check_yang_mills_submission_round11.sh'
      - '.github/workflows/yang-mills-submission-round11.yml'
  workflow_dispatch:

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGDA_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
      - name: Check direct-ratio, P06 audit and P33-P10-Gate4 roots
        run: nix develop --command bash scripts/check_yang_mills_submission_round11.sh
