name: SensibLaw expert production integrity

on:
  push:
    paths:
      - 'DASHI/Law/SensibLawExpertEvidenceProductionIntegrityExact.agda'
      - 'DASHI/Law/SensibLawExpertEvidenceProductionIntegrityRegression.agda'
      - 'DASHI/Core/MeasurementAdministrationComparabilityExact.agda'
      - 'DASHI/Core/MeasurementAdministrationComparabilityRegression.agda'
      - 'DASHI/Core/QueryIndexedProjectionAdequacyExact.agda'
      - 'DASHI/Core/AuthorityNonPromotionCore.agda'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/sensiblaw-expert-production-integrity.yml'
  pull_request:
    paths:
      - 'DASHI/Law/SensibLawExpertEvidenceProductionIntegrityExact.agda'
      - 'DASHI/Law/SensibLawExpertEvidenceProductionIntegrityRegression.agda'
      - 'DASHI/Core/MeasurementAdministrationComparabilityExact.agda'
      - 'DASHI/Core/MeasurementAdministrationComparabilityRegression.agda'
      - 'DASHI/Core/QueryIndexedProjectionAdequacyExact.agda'
      - 'DASHI/Core/AuthorityNonPromotionCore.agda'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/sensiblaw-expert-production-integrity.yml'
  workflow_dispatch:

concurrency:
  group: sensiblaw-expert-production-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: sensiblaw-expert-production-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}
      - name: Check expert production integrity modules
        id: focused
        shell: bash
        run: |
          set +e
          (
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-sensiblaw-expert-production.log"
            export AGDA_JOBS=2
            targets=(
              DASHI/Core/MeasurementAdministrationComparabilityRegression.agda
              DASHI/Law/SensibLawExpertEvidenceProductionIntegrityRegression.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-sensiblaw-expert-production.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 220 agda-sensiblaw-expert-production.log
          exit 0
      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensiblaw-expert-production-agda-log
          path: agda-sensiblaw-expert-production.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
