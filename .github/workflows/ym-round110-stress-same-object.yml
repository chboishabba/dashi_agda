name: YM Round110-115 stress completion Agda

on:
  pull_request:
    paths:
      - 'DASHI/Physics/YangMills/BalabanSameFamilyStressCauchySchwingerRound109Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanStressSameObjectProvenanceRound110Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanMarkedStressLiteralDerivativeRound111Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanStressShellEnergyToHilbertRound112Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanStressShellPartitionEnergyRound113Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanLiteralStressCoordinateRound114Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanLiteralStressCompletionRound115Exact.agda'
      - 'DASHI/Physics/YangMills/BalabanLiteralStressCompletionRound115Validation.agda'
      - 'DASHI/Physics/YangMills/BalabanCMP119CompatibleLocalExpectationFlowExact.agda'
      - 'DASHI/Physics/YangMills/BalabanTopDownSummableRGIncrementExact.agda'
      - 'DASHI/Physics/YangMills/BalabanRowBActivityEntropyToShellEnergyExact.agda'
      - 'DASHI/Physics/YangMills/BalabanMarkedSourceGeometricShellEnergyExact.agda'
      - 'DASHI/Physics/YangMills/BalabanMarkedSourceCoefficientEnergyHilbertCompilerExact.agda'
      - 'DASHI/Physics/YangMills/BalabanMarkedSourceNuclearCompositeFieldExact.agda'
      - 'DASHI/Physics/YangMills/BalabanMarkedSourceCompositeStressFieldExact.agda'
      - 'DASHI/Physics/YangMills/YangMillsClayLiteralTopDownConstructionExact.agda'
      - 'scripts/check_ym_round110_stress_same_object.sh'
      - '.github/workflows/ym-round110-stress-same-object.yml'
  workflow_dispatch:

concurrency:
  group: ym-round110-115-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agda:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: cachix/install-nix-action@v27
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check Round110-115 stress completion chain
        env:
          AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
          DASHI_REPO_ROOT: ${{ github.workspace }}
          DASHI_AGDA29_CACHE_ROOT: ${{ runner.temp }}/dashi-agda29-round115
          DASHI_STATUS_DIR: ${{ runner.temp }}/dashi-agda29-round115/status
          XDG_CACHE_HOME: ${{ runner.temp }}/dashi-xdg-round115
          AGDA_LOG_PATH: ${{ github.workspace }}/ym-round115-agda.log
          AGDA_JOBS: '4'
          DASHI_NO_TMUX: '1'
        run: bash scripts/check_ym_round110_stress_same_object.sh
      - name: Upload Round115 Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-round110-115-stress-completion-agda-log
          path: ym-round115-agda*.log
          if-no-files-found: warn
