name: NS Luo terminal interaction round 10

on:
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/**'
      - 'scripts/check_ns_luo_terminal_interaction_round10.sh'
      - 'scripts/check_ns_luo_commutator_symmetry_round9.sh'
      - 'scripts/run_agda29_parallel_check.sh'
      - '.github/workflows/ns-luo-terminal-interaction-round10.yml'
  workflow_dispatch:


concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check terminal interaction round ten
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-luo-round10-agda.log"
            export AGDA_JOBS=4
            bash scripts/check_ns_luo_terminal_interaction_round10.sh
          ) > ns-luo-round10-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 ns-luo-round10-check.log
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-luo-round10-logs
          path: |
            ns-luo-round10-check.log
            ns-luo-round10-agda.log
          if-no-files-found: warn
      - name: Fail on checker error
        if: steps.check.outputs.status != '0'
        run: exit 1
