name: NS Luo hard-math round 5 check

on:
  push:
    branches:
      - agent/ns-luo-hard-math-round5
  pull_request:
    paths:
      - 'DASHI/Physics/Closure/NSTriadKNLuo*.agda'
      - 'scripts/check_ns_luo_hard_math_round5.sh'
      - '.github/workflows/ns-luo-hard-math-round5-check.yml'

concurrency:
  group: ns-luo-round5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ns-luo-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Luo round-five hard math with Agda 2.9
        id: check
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/ns-luo-round5-check.log"
            export AGDA_JOBS=4
            scripts/check_ns_luo_hard_math_round5.sh
          ) > ns-luo-round5-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 220 ns-luo-round5-check.log
          exit 0
      - name: Upload Luo round-five check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-luo-round5-check-log
          path: ns-luo-round5-check.log
          if-no-files-found: error
      - name: Fail on Agda error
        if: steps.check.outputs.status != '0'
        run: exit 1
