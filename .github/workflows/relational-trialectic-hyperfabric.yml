      - 'DASHI/Cognition/PNF/IntegrativeComplexityDifferentiationIntegrationExact.agda'
      - 'DASHI/Cognition/PNF/RelationalPerspective*.agda'
      - 'DASHI/Cognition/PNF/AdmissibleFactorisationDecisionHyperfabricExact.agda'
