      - 'DASHI/EverythingRelationalTrialecticHyperfabric.agda'
      - '.github/workflows/relational-trialectic-hyperfabric.yml'

concurrency:
  group: dashi-global-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-agda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Restore Agda 2.9 shadow cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: relational-trialectic-agda29-${{ runner.os }}-86a1179-${{ hashFiles('scripts/run_agda29_parallel_check.sh') }}

      - name: Check relational trialectic rollup with Agda 2.9
        id: focused
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            export AGDA_FLAKE="github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin"
            export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
            export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
            export AGDA_LOG_PATH="$GITHUB_WORKSPACE/agda-relational-trialectic-check.log"
            export AGDA_JOBS=2
            targets=(
              DASHI/EverythingRelationalTrialecticHyperfabric.agda
              DASHI/Reasoning/NonginMaxCutEverything.agda
              DASHI/Reasoning/TrialecticHigherDescentMaxCutPromotionValidation.agda
              DASHI/Reasoning/TrialecticFiniteTriadicHypersheafValidation.agda
              DASHI/Reasoning/TrialecticFiniteHypercover369CechCrosswalkValidation.agda
              DASHI/Reasoning/TrialecticHypersheafHypercoverFrontierValidation.agda
              DASHI/Reasoning/TrialecticT27WavePhaseHigherStackValidation.agda
              DASHI/Reasoning/TrialecticT27FiniteTriadicHypersheafValidation.agda
              DASHI/Philosophy/NonginCurrentMaxCutValidation.agda
              DASHI/Philosophy/NonginCurrentMaxCutT27Validation.agda
              DASHI/Philosophy/NonginRoadmapClosureValidation.agda
              DASHI/Philosophy/NonginExtendedRoadmapValidation.agda
            )
            scripts/run_agda29_parallel_check.sh "${targets[@]}"
          ) > agda-relational-trialectic-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 260 agda-relational-trialectic-check.log
          exit 0

      - name: Upload focused Agda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-trialectic-agda-log
          path: agda-relational-trialectic-check.log
          if-no-files-found: error

      - name: Fail on Agda error
        if: steps.focused.outputs.status != '0'
        run: exit 1
