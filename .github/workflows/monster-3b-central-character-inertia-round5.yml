name: Monster 3B central character inertia round 5

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - 'master'
      - 'agent/monster-3b-orbifold-local-module-round4'
      - 'agent/monster-3b-central-character-inertia-round5'
    paths:
      - 'DASHI/Moonshine/Monster3BCentralCharacterInertiaExact.agda'
      - 'DASHI/Moonshine/MonsterOggNonaryProbeAuthorityExact.agda'
      - 'DASHI/Moonshine/MonsterOggNonarySevenSevenOneEquivalenceExact.agda'
      - 'DASHI/Moonshine/Monster3BActualZetaPromotionPipelineExact.agda'
      - 'DASHI/Moonshine/Monster3BMultiplicityTwelveSeventyEightRecognitionExact.agda'
      - 'DASHI/Moonshine/Monster3BCentralCharacterInertiaRound5Validation.agda'
      - 'DASHI/EverythingMonster3BCentralCharacterInertiaRound5.agda'
      - 'Docs/support/reference/Monster3BCentralCharacterInertiaRound5.md'
      - 'scripts/check_monster_3b_central_character_inertia_round5.sh'
      - '.github/workflows/monster-3b-central-character-inertia-round5.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_FLAKE: github:agda/agda/86a1179c1f886da773dc53be920bcca5d876884e#debug.bin
  AGDA_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GAP, CTblLib and certificate dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache pinned Agda environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dashi-agda29
          key: ${{ runner.os }}-agda29-86a1179c1f886da773dc53be920bcca5d876884e
          restore-keys: |
            ${{ runner.os }}-agda29-
      - name: Check Monster 3B central-character inertia tranche
        shell: bash
        run: |
          set -euo pipefail
          export DASHI_REPO_ROOT="$GITHUB_WORKSPACE"
          export DASHI_AGDA29_CACHE_ROOT="$RUNNER_TEMP/dashi-agda29"
          bash scripts/check_monster_3b_central_character_inertia_round5.sh
      - name: Upload inherited actual MN3B certificates
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: monster-3b-central-character-inertia-round5
          path: |
            build/monster_3b_normalizer_restriction.json
            build/monster_3b_heisenberg_model_certificate.json
            build/generated/DASHI/Moonshine/Generated/Monster3BRestrictionCertificate.agda
          if-no-files-found: error
