name: Twin-prime finite wheel regression

on:
  pull_request:
    paths:
      - "DASHI/Arithmetic/TwinPrimeSixWheelExact.agda"
      - "DASHI/Arithmetic/TwinPrimeFRACDASHReuseExact.agda"
      - "scripts/check_twin_prime_six_wheel_finite.py"
      - "scripts/check_twin_prime_ssp15_crt_finite.py"
      - ".github/workflows/twin-prime-finite-wheel.yml"
  push:
    paths:
      - "DASHI/Arithmetic/TwinPrimeSixWheelExact.agda"
      - "DASHI/Arithmetic/TwinPrimeFRACDASHReuseExact.agda"
      - "scripts/check_twin_prime_six_wheel_finite.py"
      - "scripts/check_twin_prime_ssp15_crt_finite.py"
      - ".github/workflows/twin-prime-finite-wheel.yml"

jobs:
  exact-finite-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check finite arithmetic, not unbounded theorem
        run: |
          python3 -B scripts/check_twin_prime_six_wheel_finite.py
          python3 -B scripts/check_twin_prime_ssp15_crt_finite.py
      - name: Check theorem owner contains no new axioms or holes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = (
              "DASHI/Arithmetic/TwinPrimeSixWheelExact.agda",
              "DASHI/Arithmetic/TwinPrimeFRACDASHReuseExact.agda",
          )
          texts = [Path(path).read_text() for path in paths]
          for source in texts:
              for forbidden in ("postulate ", "TERMINATING", "{!!", "?" + "?"):
                  assert forbidden not in source, forbidden
          for required in ("pairSurvivorMustBeR5", "twinInfinitudeImpliesBoundedPairsTwo"):
              assert required in texts[0], required
          for required in ("bridgeChoosesFirstApplicable", "bridgeActivationForcesResidueFive"):
              assert required in texts[1], required
          print("static source check passed; NOT an Agda kernel receipt")
          PY
