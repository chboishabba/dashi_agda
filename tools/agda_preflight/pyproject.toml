[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashi-agda-preflight"
version = "0.1.0"
description = "Fast tree-sitter based Agda semantic preflight checks for DASHI"
requires-python = ">=3.9"
dependencies = [
  # tree-sitter-agda 1.3.3 exposes its language through the PyCapsule API,
  # which requires the 0.25 runtime line.
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-agda[core]>=1.3.3,<2",
]

[project.scripts]
dashi-agda-preflight = "agda_preflight.cli:main"
dashi-agda-evidence = "agda_preflight.evidence_cli:main"
dashi-agda-triage = "agda_preflight.triage_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agda_preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-xdist>=3,<4",
]

[project.entry-points.pytest11]
dashi_agda_preflight = "agda_preflight.pytest_plugin"
