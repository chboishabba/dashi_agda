[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashi-agda-preflight"
version = "0.1.0"
description = "Fast tree-sitter based Agda semantic preflight checks for DASHI"
requires-python = ">=3.9"
dependencies = [
  # tree-sitter-agda 1.3.3 exposes its language through the PyCapsule API.
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-agda[core]>=1.3.3,<2",
]

[project.scripts]
dashi-agda-preflight = "agda_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agda_preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
