[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashi-agda-preflight"
version = "0.2.0"
description = "DASHI repository intelligence core: semantic preflight, discovery, history and provenance"
requires-python = ">=3.9"
dependencies = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-agda[core]>=1.3.3,<2",
]

[project.scripts]
dashi-repo = "agda_preflight.product_cli:main"
dashi-repo-formal-evidence = "agda_preflight.external_evidence_cli:main"
dashi-repo-kernel-certify = "agda_preflight.kernel_certification_cli:main"
dashi-repo-formal-evidence-from-kernel = "agda_preflight.external_evidence_from_kernel_cli:main"
dashi-repo-mcp = "agda_preflight.repository_mcp:main"
dashi-agda = "agda_preflight.interactive_cli:main"
dashi-agda-server = "agda_preflight.service:main"
dashi-agda-mcp = "agda_preflight.mcp_server:main"
dashi-agda-mcp-smoke = "agda_preflight.mcp_smoke:main"
dashi-agda-preflight = "agda_preflight.cli:main"
dashi-agda-evidence = "agda_preflight.evidence_cli:main"
dashi-agda-triage = "agda_preflight.triage_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agda_preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-xdist>=3,<4",
]
mcp = [
  "mcp>=2,<3; python_version >= '3.10'",
]

[project.entry-points.pytest11]
dashi_agda_preflight = "agda_preflight.pytest_plugin"
